<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Second Brain</title>

<!-- Firebase project settings live beside this file. -->
<script src="./astral.config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --c1:hsl(265,80%,52%); --c2:hsl(300,78%,50%); --c3:hsl(230,80%,50%);
    --o1:.15; --o2:.12; --o3:.07;
    --accent:hsl(265,82%,74%); --accent-soft:hsla(265,82%,60%,.16); --accent-line:hsla(265,82%,70%,.32);
    --ink:#f4f4f7; --ink-dim:#8b8b98; --ink-faint:#565663;
    --line:rgba(255,255,255,0.07); --line-soft:rgba(255,255,255,0.045);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{ background:#000; color:var(--ink); font-family:"DM Sans",system-ui,-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; }

  /* ---------- AMOLED aurora ---------- */
  .ambient{ position:fixed; inset:0; z-index:0; background:#000; overflow:hidden; }
  .glow{ position:absolute; border-radius:50%; filter:blur(130px); mix-blend-mode:screen; will-change:transform;
    transition:background-color 1.1s linear, opacity 1s linear;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .g1{ width:74vw; height:54vh; top:-34vh; left:-26vw; background:var(--c1); opacity:var(--o1); animation-name:float1; animation-duration:34s; }
  .g2{ width:80vw; height:58vh; bottom:-36vh; right:-28vw; background:var(--c2); opacity:var(--o2); animation-name:float2; animation-duration:46s; }
  .g3{ width:54vw; height:40vh; top:52vh; left:38vw; background:var(--c3); opacity:var(--o3); animation-name:float3; animation-duration:40s; }
  .ambient::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(88% 74% at 50% 38%, rgba(0,0,0,.86), rgba(0,0,0,0) 80%); }
  .ambient.still .glow{ animation-play-state:paused; }
  @keyframes float1{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(12vw,9vh) scale(1.1)} }
  @keyframes float2{ 0%,100%{transform:translate(0,0) scale(1.05)} 50%{transform:translate(-13vw,-8vh) scale(.92)} }
  @keyframes float3{ 0%,100%{transform:translate(-50%,0) scale(1)} 50%{transform:translate(-38%,-9vh) scale(1.14)} }
  @media (prefers-reduced-motion: reduce){ .glow{ animation-duration:240s !important; } }

  .app{ position:relative; z-index:1; height:100dvh; display:grid; grid-template-columns:300px 1fr; transition:grid-template-columns .24s ease; }
  .app.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .app.sidebar-collapsed .drawer{ min-width:0; overflow:hidden; opacity:0; pointer-events:none; }
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; }

  /* ---------- top bar ---------- */
  .bar{ display:flex; align-items:center; gap:6px; padding:calc(var(--safe-t) + 12px) 18px 12px; flex:none; }
  .icon{ width:40px; height:40px; flex:none; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); cursor:pointer; border-radius:12px; transition:.15s; }
  #settingsBtn{ display:none; }
  .icon:hover{ color:var(--ink); background:rgba(255,255,255,.05); } .icon svg{ width:20px; height:20px; }
  .icon.hide-wide{ display:grid; }
  .spacer{ flex:1; }
  .copy-all{ display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:.9rem; color:#08080a; background:var(--accent); cursor:pointer; border:none; border-radius:999px; padding:9px 16px; transition:transform .06s, filter .15s; }
  .copy-all:hover{ filter:brightness(1.08); } .copy-all:active{ transform:scale(.97); } .copy-all svg{ width:16px; height:16px; }
  .copy-all.done{ background:#34d399; color:#04120c; }
  .save-state{ margin-right:8px; font-family:"DM Mono",monospace; font-size:.68rem; color:var(--ink-faint); white-space:nowrap; transition:color .16s; }
  .save-state.saving{ color:var(--accent); }
  .save-state.cloud{ color:#6ee7b7; }
  .save-state.bad{ color:#f87171; }

  /* ---------- canvas ---------- */
  .canvas{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; padding:0 26px calc(120px + var(--safe-b)); }
  .canvas::-webkit-scrollbar{ width:9px; } .canvas::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:9px; }
  .sheet{ max-width:760px; margin:0 auto; padding-top:8px; }
  .title{ width:100%; background:none; border:none; outline:none; color:var(--ink); font-weight:700; letter-spacing:-.02em; font-size:clamp(2rem,6vw,3rem); line-height:1.06; padding:6px 0 0; }
  .title::placeholder{ color:var(--ink-faint); }

  .assign{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:14px 0 12px; }
  .pickbtn{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; transition:.14s; }
  .pickbtn:hover{ color:var(--ink); background:rgba(255,255,255,.08); }
  .pickbtn svg{ width:13px; height:13px; }
  .chip{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); padding:5px 9px 5px 8px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .chip .cx{ cursor:pointer; opacity:.55; font-size:.92rem; line-height:1; color:var(--ink-faint); } .chip .cx:hover{ opacity:1; color:#f87171; }

  .meta{ font-family:"DM Mono",monospace; font-size:.72rem; color:var(--ink-faint); margin:0 0 26px; }
  .meta b{ color:var(--ink-dim); font-weight:500; }

  .note-body{ width:100%; background:none; border:none; outline:none; resize:none; display:block; color:var(--ink); font-size:1.08rem; line-height:1.72; padding:2px 0; min-height:46vh; overflow:hidden; }
  .note-body::placeholder{ color:var(--ink-faint); }

  .ch{ padding:4px 0 22px; border-bottom:1px solid var(--line-soft); margin-bottom:22px; }
  .ch:last-of-type{ border-bottom:none; }
  .ch-top{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .ch-idx{ font-family:"DM Mono",monospace; font-size:.72rem; color:var(--accent); opacity:.7; flex:none; }
  .ch-name{ flex:1; min-width:0; background:none; border:none; outline:none; color:var(--ink); font-weight:600; font-size:1.02rem; letter-spacing:-.01em; padding:2px 0; }
  .ch-name::placeholder{ color:var(--ink-faint); }
  .ch-copy{ flex:none; font-weight:600; font-size:.8rem; color:var(--accent); background:var(--accent-soft); cursor:pointer; border:1px solid var(--accent-line); border-radius:8px; padding:6px 13px; transition:.15s; }
  .ch-copy:hover{ filter:brightness(1.15); } .ch-copy:active{ transform:scale(.95); }
  .ch-copy.done{ color:#6ee7b7; border-color:rgba(110,231,183,.4); background:rgba(52,211,153,.16); }
  .ch-body{ width:100%; background:none; border:none; outline:none; resize:none; display:block; color:var(--ink); font-size:1.06rem; line-height:1.7; padding:4px 0 0; min-height:56px; overflow:hidden; }
  .ch-body::placeholder{ color:var(--ink-faint); }
  .ch-foot{ display:flex; align-items:center; gap:2px; margin-top:8px; opacity:.3; transition:opacity .18s; }
  .ch:focus-within .ch-foot{ opacity:.9; }
  .ch-foot .g{ width:30px; height:30px; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); cursor:pointer; border-radius:8px; }
  .ch-foot .g:hover{ color:var(--ink); background:rgba(255,255,255,.06); } .ch-foot .g:disabled{ opacity:.3; cursor:default; }
  .ch-foot .g.del:hover{ color:#f87171; background:rgba(248,113,113,.12); } .ch-foot .g svg{ width:16px; height:16px; }
  .ch-foot .cc{ margin-left:auto; font-family:"DM Mono",monospace; font-size:.68rem; color:var(--ink-faint); }
  .add{ width:100%; margin-top:6px; padding:14px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:500; font-size:.9rem; color:var(--ink-dim); background:none; border:1px solid var(--line); border-radius:14px; cursor:pointer; transition:.15s; }
  .add:hover{ color:var(--ink); border-color:var(--accent-line); background:var(--accent-soft); }

  /* ---------- drawer ---------- */
  .drawer{ background:#000; border-right:1px solid var(--line); display:flex; flex-direction:column; padding-top:var(--safe-t); padding-bottom:var(--safe-b); min-height:0; }
  .scrim{ position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .26s; }
  .d-head{ padding:20px 18px 8px; } .d-head h2{ font-weight:700; font-size:1.2rem; letter-spacing:-.01em; margin:0; } .d-head h2 span{ color:var(--accent); }
  .d-new{ margin:6px 14px; padding:11px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:600; font-size:.88rem; color:#08080a; background:var(--accent); border:none; border-radius:12px; }
  .d-scroll{ flex:1; overflow-y:auto; min-height:0; }
  .d-scroll::-webkit-scrollbar{ width:8px; } .d-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:8px; }

  .sec-h{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 6px; }
  .sec-h span{ font-family:"DM Mono",monospace; font-size:.58rem; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-faint); }
  .sec-h button{ width:22px; height:22px; display:grid; place-items:center; border:none; background:none; color:var(--ink-faint); cursor:pointer; border-radius:6px; font-size:1rem; }
  .sec-h button:hover{ color:var(--ink); background:rgba(255,255,255,.06); }

  .folder-row{ display:flex; align-items:center; gap:9px; padding:8px 12px; margin:1px 10px; border-radius:9px; cursor:pointer; font-size:.88rem; color:var(--ink); }
  .folder-row:hover{ background:rgba(255,255,255,.05); } .folder-row.active{ background:var(--accent-soft); }
  .folder-row svg{ width:15px; height:15px; color:var(--ink-dim); flex:none; }
  .folder-row .fn{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-row .fx{ opacity:0; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:.9rem; padding:0 4px; }
  .folder-row:hover .fx{ opacity:1; } .folder-row .fx:hover{ color:#f87171; }

  .tagcloud{ display:flex; flex-wrap:wrap; gap:5px; padding:2px 16px 8px; }
  .tg{ display:inline-flex; align-items:center; gap:6px; font-weight:500; font-size:.78rem; padding:5px 10px 5px 8px; border-radius:8px; color:var(--ink-dim); background:rgba(255,255,255,.035); border:1px solid transparent; cursor:pointer; transition:.13s; }
  .tg:hover{ background:rgba(255,255,255,.075); color:var(--ink); }
  .tg.active{ background:var(--accent-soft); color:var(--ink); border-color:var(--accent-line); }
  .tg .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .tg .tx{ opacity:0; margin-left:1px; font-size:.9rem; line-height:1; color:var(--ink-faint); }
  .tg:hover .tx{ opacity:.75; } .tg .tx:hover{ opacity:1; color:#f87171; }
  .tag-empty{ padding:0 18px 8px; font-size:.76rem; color:var(--ink-faint); }

  .d-list{ padding:4px 10px 8px; }
  .d-item{ display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:11px; cursor:pointer; transition:background .13s; }
  .d-item:hover{ background:rgba(255,255,255,.05); } .d-item.active{ background:var(--accent-soft); }
  .d-item > svg{ width:15px; height:15px; color:var(--ink-dim); flex:none; }
  .d-item .dt{ flex:1; min-width:0; } .d-item .dt-title{ font-weight:500; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .d-item .dt-meta{ display:flex; align-items:center; gap:5px; margin-top:3px; }
  .d-item .dt-meta .m{ font-family:"DM Mono",monospace; font-size:.62rem; color:var(--ink-faint); }
  .d-item .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .d-item .dx{ opacity:0; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:1rem; padding:2px 6px; border-radius:6px; }
  .d-item:hover .dx{ opacity:1; } .d-item .dx:hover{ color:#f87171; }

  .d-foot{ display:flex; align-items:center; gap:8px; padding:11px 14px; border-top:1px solid var(--line); }
  .d-foot .sbtn{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:9px; font-size:.8rem; font-weight:500; color:var(--ink-dim); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .d-foot .sbtn:hover{ color:var(--ink); background:rgba(255,255,255,.08); }
  .d-foot .sbtn svg{ width:15px; height:15px; }
  .d-foot .who{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .d-foot .who img{ width:26px; height:26px; border-radius:50%; flex:none; }
  .d-foot .who b{ font-size:.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- floating menu ---------- */
  .menu{ position:fixed; z-index:70; background:#0b0b0f; border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 18px 55px rgba(0,0,0,.7); min-width:200px; max-width:270px; }
  .menu .mtitle{ font-family:"DM Mono",monospace; font-size:.56rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); padding:6px 10px 4px; }
  .menu button.mi{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 11px; background:none; border:none; color:var(--ink); font-size:.86rem; border-radius:8px; cursor:pointer; }
  .menu button.mi:hover{ background:rgba(255,255,255,.06); } .menu button.mi svg{ width:16px; height:16px; color:var(--ink-dim); flex:none; }
  .menu button.mi .chk{ margin-left:auto; color:var(--accent); opacity:0; } .menu button.mi.on .chk{ opacity:1; }
  .menu .sep{ height:1px; background:var(--line); margin:5px 4px; }
  .menu .mrow{ padding:6px; } .menu .mrow input{ width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:9px 10px; font-family:inherit; font-size:.85rem; outline:none; }
  .menu .mrow input:focus{ border-color:var(--accent-line); }
  .menu .maxscroll{ max-height:230px; overflow-y:auto; }

  /* ---------- toast ---------- */
  .toast{ position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%,16px); z-index:120; padding:10px 18px; border-radius:12px; background:#141418; border:1px solid var(--line); font-size:.82rem; color:var(--ink); opacity:0; pointer-events:none; transition:.2s; max-width:88vw; }
  .toast.show{ opacity:1; transform:translate(-50%,0); } .toast .tk{ color:#6ee7b7; } .toast.bad .tk{ color:#f87171; }

  /* ---------- modals ---------- */
  .modal{ position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); padding:18px; }
  .modal.open{ display:flex; }
  .modal-box{ width:100%; max-width:560px; max-height:88vh; overflow-y:auto; background:#0a0a0e; border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 28px 90px rgba(0,0,0,.58); }
  .modal-box::-webkit-scrollbar{ width:8px; } .modal-box::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.09); border-radius:8px; }
  .mh{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .mh h3{ font-weight:700; font-size:1.2rem; margin:0; letter-spacing:-.01em; }
  .mh .x{ width:32px; height:32px; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); font-size:1.2rem; cursor:pointer; border-radius:9px; }
  .mh .x:hover{ color:var(--ink); background:rgba(255,255,255,.07); }
  .grp{ margin-top:22px; }
  .grp > h4{ font-family:"DM Mono",monospace; font-size:.58rem; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 11px; }
  .hint{ font-size:.8rem; color:var(--ink-dim); line-height:1.55; margin:0 0 12px; }
  .hint a{ color:var(--accent); }

  .themes{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .th{ min-width:0; display:grid; grid-template-columns:76px 1fr 18px; align-items:center; gap:11px; cursor:pointer; color:var(--ink); text-align:left; padding:8px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.025); transition:background .14s,border-color .14s,transform .14s; }
  .th:hover{ background:rgba(255,255,255,.065); border-color:rgba(255,255,255,.14); transform:translateY(-1px); }
  .th.on{ background:var(--accent-soft); border-color:var(--accent-line); }
  .th .prev{ display:block; width:76px; height:48px; border-radius:9px; background-color:#000; background-image:var(--preview); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .th .nm{ display:block; min-width:0; font-size:.79rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .th .check{ width:18px; height:18px; display:grid; place-items:center; border-radius:50%; color:#070709; background:var(--accent); opacity:0; transform:scale(.7); transition:.14s; font-size:.7rem; font-weight:800; }
  .th.on .check{ opacity:1; transform:scale(1); }

  .srow{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-top:1px solid var(--line); }
  .srow:first-of-type{ border-top:none; }
  .srow .sl{ font-size:.9rem; } .srow .sl small{ display:block; color:var(--ink-faint); font-size:.74rem; margin-top:2px; }
  .toggle{ width:44px; height:26px; flex:none; border-radius:999px; background:rgba(255,255,255,.12); border:none; cursor:pointer; position:relative; transition:.15s; }
  .toggle.on{ background:var(--accent); }
  .toggle b{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .16s; } .toggle.on b{ left:21px; }

  .ta{ width:100%; min-height:120px; resize:vertical; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; color:var(--ink); padding:12px; font-family:"DM Mono",monospace; font-size:.76rem; line-height:1.5; outline:none; }
  .ta:focus{ border-color:var(--accent-line); }
  .btnrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .b2{ padding:10px 15px; font-size:.84rem; font-weight:600; border-radius:10px; cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink); }
  .b2:hover{ background:rgba(255,255,255,.1); }
  .b2.primary{ background:var(--accent); color:#08080a; border-color:transparent; } .b2.primary:hover{ filter:brightness(1.08); }
  .b2.danger{ color:#f87171; } .b2.danger:hover{ background:rgba(248,113,113,.12); }
  .gsign{ width:100%; display:flex; align-items:center; justify-content:center; gap:9px; padding:12px; cursor:pointer; font-weight:600; font-size:.88rem; color:#1f1f1f; background:#fff; border:none; border-radius:12px; }
  .gsign:hover{ filter:brightness(.94); } .gsign svg{ width:18px; height:18px; }
  .acctbox{ display:flex; align-items:center; gap:11px; padding:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; }
  .acctbox img{ width:38px; height:38px; border-radius:50%; flex:none; }
  .acctbox .ai{ flex:1; min-width:0; } .acctbox .ai b{ display:block; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acctbox .ai small{ color:#34d399; font-size:.72rem; }

  .modal-opt{ width:100%; text-align:left; padding:13px 15px; margin-bottom:9px; cursor:pointer; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; transition:.14s; }
  .modal-opt:hover{ background:var(--accent-soft); border-color:var(--accent-line); }
  .modal-opt b{ display:block; font-weight:600; font-size:.92rem; color:var(--ink); } .modal-opt small{ font-size:.74rem; color:var(--ink-faint); }

  @media (max-width: 900px){
    .app{ grid-template-columns:1fr; }
    .drawer{ position:fixed; z-index:30; top:0; bottom:0; left:0; width:min(82vw,300px); transform:translateX(-102%); transition:transform .26s cubic-bezier(.4,0,.2,1); box-shadow:0 0 60px rgba(0,0,0,.6); }
    .app.open .drawer{ transform:translateX(0); } .app.open .scrim{ opacity:1; pointer-events:auto; }
    .icon.hide-wide{ display:grid; }
    .canvas{ padding-left:20px; padding-right:20px; }
    .themes{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (max-width: 560px){
    .modal-box{ padding:20px; }
    .themes{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

      <div class="spacer"></div>
      <button class="icon" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3.7 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <span class="save-state" id="saveState" role="status" aria-live="polite">Saved locally</span>
      <button class="copy-all" id="copyAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span id="copyAllLabel">Copy all</span></button>
    </div>
    <div class="canvas" id="canvas"></div>

</div>

<div class="toast" id="toast"></div>
<div class="modal" id="settingsModal"><div class="modal-box" id="settingsBox"></div></div>
<div class="modal" id="syncModal"><div class="modal-box" id="syncBox"></div></div>

<script>
(function(){
  "use strict";

  /* =================== themes =================== */
  /* each: glows = 3 x [hue,sat,light], o = 3 opacities, accent = [h,s,l] */
  var THEMES=[
    {id:"nebula",  name:"Nebula",  glows:[[265,80,52],[300,78,50],[230,80,50]], o:[.15,.12,.07], accent:[265,82,74]},
    {id:"orchid",  name:"Orchid",  glows:[[310,78,52],[340,75,50],[280,75,50]], o:[.14,.11,.07], accent:[312,80,76]},
    {id:"ember",   name:"Ember",   glows:[[14,84,50],[34,85,50],[350,75,48]],   o:[.14,.11,.07], accent:[20,85,71]},
    {id:"amber",   name:"Amber",   glows:[[38,85,50],[50,85,50],[26,80,48]],    o:[.13,.10,.06], accent:[42,88,68]},
    {id:"aurora",  name:"Aurora",  glows:[[158,78,46],[185,75,46],[130,70,44]], o:[.14,.11,.07], accent:[160,75,66]},
    {id:"abyss",   name:"Abyss",   glows:[[212,82,48],[240,78,48],[195,80,46]], o:[.15,.12,.07], accent:[205,85,72]},
    {id:"crimson", name:"Crimson", glows:[[352,85,45],[8,80,44],[330,70,42]],   o:[.14,.11,.06], accent:[355,80,71]},
    {id:"sunset",  name:"Sunset",  glows:[[22,88,52],[332,78,52],[272,72,50]],  o:[.15,.13,.09], accent:[340,82,74]},
    {id:"vapor",   name:"Vapor",   glows:[[186,88,52],[310,82,56],[256,76,52]], o:[.14,.13,.09], accent:[190,85,72]},
    {id:"prism",   name:"Prism",   glows:[[210,88,52],[322,82,54],[46,88,52]],  o:[.13,.12,.09], accent:[280,80,76]},
    {id:"oil",     name:"Oil",     glows:[[172,70,46],[276,66,50],[42,72,50]],  o:[.13,.12,.08], accent:[176,66,70]},
    {id:"yinyang", name:"Yin Yang",glows:[[0,0,100],[220,18,52],[0,0,100]],     o:[.13,.10,.04], accent:[0,0,90]},
    {id:"void",    name:"Void",    glows:[[250,40,40],[250,30,34],[250,20,30]], o:[.07,.05,.03], accent:[250,45,74]},
    {id:"mono",    name:"Mono",    glows:[[0,0,62],[0,0,50],[0,0,42]],          o:[.09,.07,.04], accent:[0,0,86]}
  ];
  var TAG_HUES=[265,320,15,42,158,205,95,340,180,55];

  /* =================== storage =================== */
  var KEY="astral-notes-v5", OLDS=["astral-notes-v4","astral-notes-v3"], CFGKEY="astral-fb-config", mem=null;
  var canPersist=(function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } })();
  function readKey(k){ if(canPersist){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){} } return null; }
  function migrate(){
    var v4=readKey("astral-notes-v4");
    if(v4&&v4.items) return { items:v4.items, folders:v4.folders||[], tags:v4.tags||[], currentId:v4.currentId, motion:v4.motion!==false, theme:v4.bg||"nebula" };
    var v3=readKey("astral-notes-v3");
    if(v3&&v3.scripts) return { items:v3.scripts.map(function(s){ s.type="script"; s.folderId=null; s.tagIds=[]; return s; }), folders:[], tags:[], currentId:v3.currentId, motion:v3.motion!==false, theme:v3.bg||"nebula" };
    return null;
  }
  function loadLocal(){ var v=readKey(KEY); if(v&&v.items) return v; if(!canPersist&&mem) return mem; return migrate(); }
  function setSaveState(label,kind){ var el=$("saveState"); if(!el) return; el.textContent=label; el.className="save-state"+(kind?" "+kind:""); }
  function persist(){ var d=JSON.stringify(state); if(canPersist){ try{ localStorage.setItem(KEY,d); }catch(e){ mem=JSON.parse(d); } } else mem=JSON.parse(d); setSaveState(currentUser?"Saved locally · syncing":"Saved locally"); saveCloud(); }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function sec(t,b){ return {id:uid(),title:t||"",body:b||""}; }
  function baseItem(){ return { id:uid(), title:"", folderId:(state&&state.filterFolder)||null, tagIds:(state&&state.filterTag)?[state.filterTag]:[], updated:Date.now() }; }
  function newScriptItem(){ var it=baseItem(); it.type="script"; it.sections=[sec("Intro",""),sec("Main",""),sec("Outro","")]; return it; }
  function newNoteItem(){ var it=baseItem(); it.type="note"; it.body=""; return it; }

  var state=loadLocal();
  if(!state||!state.items){ state={ items:[], folders:[], tags:[], currentId:null, motion:true, theme:"nebula", filterFolder:null, filterTag:null }; state.items.push(newScriptItem()); state.currentId=state.items[0].id; }
  state.folders=state.folders||[]; state.tags=state.tags||[]; state.items=state.items||[];
  if(typeof state.motion!=="boolean") state.motion=true;
  if(!state.theme) state.theme="nebula";
  state.filterFolder=state.filterFolder||null; state.filterTag=state.filterTag||null;
  if(!state.items.length) state.items.push(newScriptItem());
  if(!state.currentId || !state.items.some(function(i){return i.id===state.currentId;})) state.currentId=state.items[0].id;

  function current(){ return state.items.find(function(s){return s.id===state.currentId;})||state.items[0]; }
  function themeDef(){ return THEMES.find(function(t){return t.id===state.theme;})||THEMES[0]; }
  function folderById(id){ return state.folders.find(function(f){return f.id===id;}); }
  function tagById(id){ return state.tags.find(function(t){return t.id===id;}); }
  function visibleItems(){ return state.items.filter(function(it){ if(state.filterFolder && it.folderId!==state.filterFolder) return false; if(state.filterTag && (it.tagIds||[]).indexOf(state.filterTag)<0) return false; return true; }); }

  var $=function(id){ return document.getElementById(id); };
  var app=$("app"), ambient=$("ambient"), canvas=$("canvas"), listEl=$("list"), toast=$("toast"),
      menuBtn=$("menuBtn"), scrim=$("scrim"), foldersEl=$("folders"), tagsEl=$("tags"),
      listLabel=$("listLabel"), dfoot=$("dfoot");

  /* =================== theme apply =================== */
  var rootS=document.documentElement.style, phase=0, motionTimer=null;
  function hsl(a,shift){ return "hsl("+(((a[0]+(shift||0))%360)+360)%360+","+a[1]+"%,"+a[2]+"%)"; }
  function applyTheme(shift){
    var t=themeDef(); shift=shift||0;
    rootS.setProperty("--c1",hsl(t.glows[0],shift));
    rootS.setProperty("--c2",hsl(t.glows[1],shift));
    rootS.setProperty("--c3",hsl(t.glows[2],shift));
    rootS.setProperty("--o1",t.o[0]); rootS.setProperty("--o2",t.o[1]); rootS.setProperty("--o3",t.o[2]);
    var a=t.accent;
    rootS.setProperty("--accent","hsl("+a[0]+","+a[1]+"%,"+a[2]+"%)");
    rootS.setProperty("--accent-soft","hsla("+a[0]+","+a[1]+"%,"+Math.max(a[2]-14,30)+"%,.16)");
    rootS.setProperty("--accent-line","hsla("+a[0]+","+a[1]+"%,"+a[2]+"%,.32)");
  }
  function startMotion(){ stopMotion(); motionTimer=setInterval(function(){ phase+=0.02; applyTheme(Math.sin(phase)*14); },130); }
  function stopMotion(){ if(motionTimer){ clearInterval(motionTimer); motionTimer=null; } applyTheme(0); }
  function syncMotion(){ ambient.classList.toggle("still",!state.motion); if(state.motion) startMotion(); else stopMotion(); }

  /* =================== helpers =================== */
  function words(s){ var t=(s||"").trim(); return t?t.split(/\s+/).length:0; }
  function dur(w){ var s=Math.round(w/150*60), m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }
  function itemText(it){ return it.type==="script" ? (it.sections||[]).map(function(x){return x.body;}).join(" ") : (it.body||""); }
  function itemWords(it){ return words(itemText(it)); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function copy(text,cb){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(cb,function(){ fbcopy(text,cb); }); } else fbcopy(text,cb); }
  function fbcopy(text,cb){ var t=document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(t); cb&&cb(); }
  var toastTimer=null;
  function showToast(m,bad){ toast.className="toast show"+(bad?" bad":""); toast.innerHTML='<span class="tk">'+(bad?"!":"✓")+'</span> '+m; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toast.classList.remove("show"); },2200); }
  var saveTimer=null; function save(){ setSaveState("Saving…","saving"); clearTimeout(saveTimer); saveTimer=setTimeout(persist,400); }

  var ICON_SCRIPT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="5" rx="1.5"/><rect x="4" y="12" width="16" height="8" rx="1.5"/></svg>';
  var ICON_NOTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>';
  var ICON_FOLDER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

  /* =================== floating menu =================== */
  var openMenuEl=null, openMenuAnchor=null;
  function closeMenu(){ if(openMenuEl){ if(openMenuEl.parentNode) openMenuEl.parentNode.removeChild(openMenuEl); openMenuEl=null; openMenuAnchor=null; document.removeEventListener("mousedown",menuOutside,true); } }
  function menuOutside(e){ if(openMenuEl && openMenuAnchor && openMenuAnchor.contains(e.target)) return; if(openMenuEl && !openMenuEl.contains(e.target)) closeMenu(); }
  function openMenu(anchor,build){
    closeMenu();
    var m=document.createElement("div"); m.className="menu"; build(m); document.body.appendChild(m);
    var r=anchor.getBoundingClientRect(), mw=m.offsetWidth||210, mh=m.offsetHeight||160;
    var left=Math.min(r.left, window.innerWidth-mw-10); if(left<10) left=10;
    var top=r.bottom+6; if(top+mh>window.innerHeight-10) top=Math.max(10,r.top-mh-6);
    m.style.left=left+"px"; m.style.top=top+"px";
     openMenuEl=m; openMenuAnchor=anchor;
    setTimeout(function(){ document.addEventListener("mousedown",menuOutside,true); },0);
    var inp=m.querySelector("input"); if(inp) inp.focus();
    return m;
  }
  function mkItem(iconHtml,label,on,onclick){ var b=document.createElement("button"); b.className="mi"+(on?" on":""); b.innerHTML=iconHtml+'<span>'+escapeHtml(label)+'</span><span class="chk">✓</span>'; b.onclick=onclick; return b; }
  function sep(){ var s=document.createElement("div"); s.className="sep"; return s; }

  /* =================== sidebar =================== */
  function renderFolders(){
    foldersEl.innerHTML="";
    var all=document.createElement("div"); all.className="folder-row"+(state.filterFolder===null?" active":"");
    all.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="fn">All notes</span>';
    all.onclick=function(){ state.filterFolder=null; persist(); renderAll(); };
    foldersEl.appendChild(all);
    state.folders.forEach(function(f){
      var row=document.createElement("div"); row.className="folder-row"+(state.filterFolder===f.id?" active":"");
      row.innerHTML=ICON_FOLDER+'<span class="fn"></span><button class="fx" title="Delete folder">✕</button>';
      row.querySelector(".fn").textContent=f.name;
      row.onclick=function(e){ if(e.target.classList.contains("fx")) return; state.filterFolder=f.id; app.classList.remove("open"); persist(); renderAll(); };
      row.querySelector(".fx").onclick=function(e){ e.stopPropagation(); if(!confirm('Delete folder "'+f.name+'"? Notes inside are kept and moved to All notes.')) return; state.items.forEach(function(it){ if(it.folderId===f.id) it.folderId=null; }); state.folders=state.folders.filter(function(x){ return x.id!==f.id; }); if(state.filterFolder===f.id) state.filterFolder=null; persist(); renderAll(); };
      foldersEl.appendChild(row);
    });
  }
  function renderTags(){
    tagsEl.innerHTML="";
    if(!state.tags.length){ var e=document.createElement("div"); e.className="tag-empty"; e.textContent="No tags yet — tap ＋"; tagsEl.appendChild(e); return; }
    var cloud=document.createElement("div"); cloud.className="tagcloud";
    state.tags.forEach(function(t){
      var chip=document.createElement("span"); chip.className="tg"+(state.filterTag===t.id?" active":"");
      chip.innerHTML='<span class="dot" style="background:hsl('+t.hue+',65%,62%)"></span>'+escapeHtml(t.name)+'<span class="tx" title="Delete tag">✕</span>';
      chip.onclick=function(e){
        if(e.target.classList.contains("tx")){ e.stopPropagation(); if(!confirm('Delete tag "'+t.name+'"?')) return;
          state.items.forEach(function(it){ it.tagIds=(it.tagIds||[]).filter(function(x){ return x!==t.id; }); });
          state.tags=state.tags.filter(function(x){ return x.id!==t.id; });
          if(state.filterTag===t.id) state.filterTag=null; persist(); renderAll(); return; }
        state.filterTag = state.filterTag===t.id ? null : t.id; app.classList.remove("open"); persist(); renderAll();
      };
      cloud.appendChild(chip);
    });
    tagsEl.appendChild(cloud);
  }
  function renderList(){
    var items=visibleItems();
    var lbl = state.filterTag ? ((tagById(state.filterTag)||{}).name||"Tag") : state.filterFolder ? ((folderById(state.filterFolder)||{}).name||"Folder") : "All notes";
    listLabel.textContent=lbl+"  ·  "+items.length;
    listEl.innerHTML="";
    if(!items.length){ var e=document.createElement("div"); e.className="tag-empty"; e.style.padding="10px 12px"; e.textContent="Nothing here yet."; listEl.appendChild(e); return; }
    items.forEach(function(it){
      var el=document.createElement("div"); el.className="d-item"+(it.id===state.currentId?" active":"");
      var dots=(it.tagIds||[]).map(function(id){ var t=tagById(id); return t?'<span class="dot" style="background:hsl('+t.hue+',65%,62%)"></span>':""; }).join("");
      el.innerHTML=(it.type==="script"?ICON_SCRIPT:ICON_NOTE)+'<div class="dt"><div class="dt-title"></div><div class="dt-meta"><span class="m">'+(it.type==="script"?((it.sections||[]).length+" ch · "):"")+itemWords(it)+' words</span>'+dots+'</div></div><button class="dx" aria-label="Delete">✕</button>';
      el.querySelector(".dt-title").textContent=it.title||(it.type==="script"?"Untitled script":"Untitled note");
      el.onclick=function(e){ if(e.target.classList.contains("dx")) return; state.currentId=it.id; app.classList.remove("open"); renderList(); renderMain(); };
      el.querySelector(".dx").onclick=function(e){ e.stopPropagation(); delItem(it.id); };
      listEl.appendChild(el);
    });
  }
  function renderAll(){ renderFolders(); renderTags(); renderList(); renderMain(); }
  function delItem(id){
    if(!confirm("Delete this? This can't be undone.")) return;
    var i=state.items.findIndex(function(s){ return s.id===id; });
    if(i<0) return;
    state.items.splice(i,1);
    if(!state.items.length) state.items.push(newScriptItem());
    if(state.currentId===id){ var vis=visibleItems(); state.currentId=(vis[0]||state.items[0]).id; }
    persist(); renderList(); renderMain();
  }

  /* =================== editor =================== */
  function grow(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
  function renderMain(){
    var it=current(); canvas.innerHTML="";
    if(!it) return;
    var sheet=document.createElement("div"); sheet.className="sheet";

    var ti=document.createElement("input"); ti.className="title"; ti.type="text"; ti.value=it.title||"";
    ti.placeholder=it.type==="script"?"Untitled script":"Untitled note";
    ti.oninput=function(){ it.title=ti.value; it.updated=Date.now(); save(); refreshListTitles(); };
    sheet.appendChild(ti);

    sheet.appendChild(buildAssign(it));
    var meta=document.createElement("div"); meta.className="meta"; meta.id="meta"; sheet.appendChild(meta);

    if(it.type==="script"){
      (it.sections||[]).forEach(function(section,i){ sheet.appendChild(buildCh(it,section,i)); });
      var add=document.createElement("button"); add.className="add"; add.textContent="＋  Add chapter";
      add.onclick=function(){ it.sections.push(sec("","")); it.updated=Date.now(); persist(); renderMain(); renderList(); var b=canvas.querySelectorAll(".ch-body"); if(b.length) b[b.length-1].focus(); };
      sheet.appendChild(add);
    } else {
      var body=document.createElement("textarea"); body.className="note-body"; body.value=it.body||""; body.placeholder="Start writing…";
      body.oninput=function(){ it.body=body.value; it.updated=Date.now(); grow(body); updateMeta(); save(); refreshListMeta(); };
      sheet.appendChild(body);
    }
    canvas.appendChild(sheet);
    var tas=canvas.querySelectorAll(".ch-body,.note-body");
    for(var i=0;i<tas.length;i++) grow(tas[i]);
    updateMeta();
  }
  /* update sidebar text in place — never re-render the list while typing */
  function refreshListTitles(){
    var it=current(); if(!it) return;
    var items=visibleItems(), idx=items.findIndex(function(x){ return x.id===it.id; });
    if(idx<0){ return; }
    var node=listEl.children[idx]; if(!node) return;
    var t=node.querySelector(".dt-title"); if(t) t.textContent=it.title||(it.type==="script"?"Untitled script":"Untitled note");
  }
  function refreshListMeta(){
    var it=current(); if(!it) return;
    var items=visibleItems(), idx=items.findIndex(function(x){ return x.id===it.id; });
    if(idx<0) return;
    var node=listEl.children[idx]; if(!node) return;
    var m=node.querySelector(".dt-meta .m");
    if(m) m.textContent=(it.type==="script"?((it.sections||[]).length+" ch · "):"")+itemWords(it)+" words";
  }

  function buildAssign(it){
    var wrap=document.createElement("div"); wrap.className="assign";
    var fbtn=document.createElement("button"); fbtn.className="pickbtn";
    var f=folderById(it.folderId);
    fbtn.innerHTML=ICON_FOLDER+'<span>'+escapeHtml(f?f.name:"Folder")+'</span>';
    fbtn.onclick=function(){ openFolderPick(fbtn,it); };
    wrap.appendChild(fbtn);

    (it.tagIds||[]).forEach(function(id){
      var t=tagById(id); if(!t) return;
      var chip=document.createElement("span"); chip.className="chip";
      chip.innerHTML='<span class="dot" style="background:hsl('+t.hue+',65%,62%)"></span>'+escapeHtml(t.name)+'<span class="cx">×</span>';
      chip.querySelector(".cx").onclick=function(){ it.tagIds=it.tagIds.filter(function(x){ return x!==id; }); it.updated=Date.now(); persist(); renderMain(); renderList(); };
      wrap.appendChild(chip);
    });
    var addTag=document.createElement("button"); addTag.className="pickbtn"; addTag.textContent="＋ Tag";
    addTag.onclick=function(){ openTagPick(addTag,it); };
    wrap.appendChild(addTag);
    return wrap;
  }

  /* =================== export / import =================== */
  function doExport(){
    var payload={ app:"second-brain", version:5, items:state.items, folders:state.folders, tags:state.tags };
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="second-brain-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  }
  function doImport(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result), inc=d.items||d.scripts||d;
        if(!Array.isArray(inc)) throw new Error("bad");
        inc.forEach(function(s){ s.id=uid(); if(!s.type) s.type=s.sections?"script":"note"; s.tagIds=[]; s.folderId=null; if(s.type==="script"&&!Array.isArray(s.sections)) s.sections=[sec("",s.body||"")]; });
        state.items=inc.concat(state.items);
        if(d.folders) state.folders=state.folders.concat(d.folders.map(function(f){ return {id:uid(),name:f.name}; }));
        if(d.tags) state.tags=state.tags.concat(d.tags.map(function(t){ return {id:uid(),name:t.name,hue:t.hue||265}; }));
        state.currentId=inc[0].id; persist(); renderAll(); showToast("Imported "+inc.length+" item"+(inc.length===1?"":"s"));
      }catch(err){ showToast("That file couldn’t be read",true); }
    };
    r.readAsText(file);
  }

  /* =================== Firebase (configured in astral.config.js) =================== */
  var auth=null, db=null, currentUser=null, cloudTimer=null, fbReady=false;
  function usableCfg(cfg){
    if(!cfg||!cfg.apiKey||!cfg.projectId||!cfg.authDomain) return false;
    return !/PASTE_|YOUR_PROJECT_ID/.test(cfg.apiKey+" "+cfg.projectId+" "+cfg.authDomain);
  }
  function getCfg(){
    var external=window.ASTRAL_CONFIG;
    if(external&&external.firebase) external=external.firebase;
    if(usableCfg(external)) return external;
    var legacy=readKey(CFGKEY);
    return usableCfg(legacy)?legacy:null;
  }
  function parseCfg(text){
    if(!text) return null;
    /* scan every {...} block in the paste and return the first one that
       actually looks like a Firebase config, so extra import/init lines
       pasted alongside it don't matter */
    for(var i=0;i<text.length;i++){
      if(text.charAt(i)!=="{") continue;
      var depth=0, end=-1;
      for(var j=i;j<text.length;j++){
        var c=text.charAt(j);
        if(c==="{") depth++;
        else if(c==="}"){ depth--; if(depth===0){ end=j; break; } }
      }
      if(end<0) continue;
      var candidate=text.slice(i,end+1), obj=null;
      try{ obj=(new Function("return ("+candidate+")"))(); }catch(e){ continue; }
      if(obj && typeof obj==="object" && obj.apiKey && obj.projectId) return obj;
    }
    return null;
  }
  function initFirebase(){
    var cfg=getCfg();
    if(!cfg||typeof firebase==="undefined"){ renderFoot(); return; }
    try{
      if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
      auth=firebase.auth(); db=firebase.firestore(); fbReady=true;
      auth.onAuthStateChanged(function(u){ currentUser=u; renderFoot(); if(u) loadCloud(); });
    }catch(e){ console.warn("Firebase init failed:",e); fbReady=false; showToast("Firebase config could not be loaded",true); }
    renderFoot();
  }
  function authErrorMessage(e){
    var code=e&&e.code||"";
    if(location.protocol==="file:") return "Open v3 with Start Second Brain.cmd so Google sign-in has a valid web address";
    if(code==="auth/unauthorized-domain") return "This address is not in Firebase Authentication → Authorized domains";
    if(code==="auth/operation-not-allowed"||code==="auth/configuration-not-found") return "Google sign-in is disabled. In Firebase Console → Authentication → Sign-in method, enable Google";
    if(code==="auth/operation-not-supported-in-this-environment") return "Google sign-in needs http://localhost — use the v3 launcher";
    if(code==="auth/popup-blocked") return "Your browser blocked the Google sign-in window";
    if(code==="auth/network-request-failed") return "Could not reach Google. Check your connection and try again";
    if(code==="auth/popup-closed-by-user") return "Sign-in canceled";
    return "Sign-in failed"+(code?" ("+code.replace(/^auth\//,"")+")":"");
  }
  function signIn(){
    if(!fbReady){ showToast("Add your Firebase project settings to astral.config.js",true); return; }
    if(location.protocol==="file:"){ showToast(authErrorMessage(),true); return; }
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){
      console.warn(e);
      showToast(authErrorMessage(e),e&&e.code!=="auth/popup-closed-by-user");
    });
  }
  function hasContent(items){ return items && items.some(function(s){ return (s.title&&s.title.trim())||itemText(s).trim(); }); }
  function sig(s){ return (s.title||"")+"|"+itemText(s); }
  function useData(d){
    state.items=(d.items&&d.items.length)?d.items:[newScriptItem()];
    state.folders=d.folders||[]; state.tags=d.tags||[];
    state.currentId=state.items[0].id; state.filterFolder=null; state.filterTag=null;
    if(canPersist){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
    renderAll();
  }
  function unionBy(a,b,keyfn){ var seen={}; a.forEach(function(x){ seen[keyfn(x)]=1; }); return a.concat((b||[]).filter(function(x){ return !seen[keyfn(x)]; })); }
  function askSync(cb){
    var box=$("syncBox");
    box.innerHTML='<div class="mh"><h3>Which notes do you want?</h3></div><p class="hint">This device and your account both have saved notes. Choose how to combine them.</p>'+
      '<button class="modal-opt" data-c="cloud"><b>Use my account</b><small>replace what\u2019s on this device</small></button>'+
      '<button class="modal-opt" data-c="local"><b>Use this device</b><small>overwrite what\u2019s in the cloud</small></button>'+
      '<button class="modal-opt" data-c="merge"><b>Keep both</b><small>merge the two sets together</small></button>';
    var btns=box.querySelectorAll(".modal-opt");
    for(var i=0;i<btns.length;i++){ (function(b){ b.onclick=function(){ $("syncModal").classList.remove("open"); cb(b.getAttribute("data-c")); }; })(btns[i]); }
    $("syncModal").classList.add("open");
  }
  function loadCloud(){
    if(!currentUser||!db) return;
    db.collection("users").doc(currentUser.uid).get().then(function(doc){
      var cloud=doc.exists?doc.data():null;
      var cloudHas=cloud&&cloud.items&&hasContent(cloud.items);
      var localHas=hasContent(state.items);
      if(cloudHas&&localHas){
        askSync(function(choice){
          if(choice==="cloud"){ useData(cloud); showToast("Using your account"); }
          else if(choice==="local"){ saveCloudNow(); showToast("Cloud updated from this device"); }
          else {
            var seen={}; state.items.forEach(function(s){ seen[sig(s)]=1; });
            var add=cloud.items.filter(function(s){ return !seen[sig(s)]; }).map(function(s){ s.id=uid(); return s; });
            state.items=state.items.concat(add);
            state.folders=unionBy(state.folders,cloud.folders,function(f){ return f.name; });
            state.tags=unionBy(state.tags,cloud.tags,function(t){ return t.name; });
            persist(); renderAll(); saveCloudNow(); showToast("Merged "+add.length+" from your account");
          }
        });
      } else if(cloudHas){ useData(cloud); showToast("Synced from your account"); }
      else { saveCloudNow(); showToast("Account linked — your notes are now saved"); }
    }).catch(function(e){ console.warn(e); showToast("Couldn’t read cloud data — check Firestore rules",true); });
  }
  function saveCloud(){ if(!currentUser||!db) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(saveCloudNow,1500); }
  function saveCloudNow(){ if(!currentUser||!db) return; db.collection("users").doc(currentUser.uid).set({ items:state.items, folders:state.folders, tags:state.tags, updated:Date.now() }).then(function(){ setSaveState("Saved to cloud","cloud"); }).catch(function(e){ console.warn(e); setSaveState("Saved locally · cloud sync failed","bad"); }); }
  window.addEventListener("beforeunload",saveCloudNow);

      return;
    }
    el.innerHTML='<p class="hint"><b>Sync is not configured.</b><br>Put this project’s Firebase web settings in <b>astral.config.js</b>, then reopen the app. People using the finished app will only see the sign-in button.</p>';
  }
  $("settingsBtn").onclick=function(){ openSettings(); };
  $("settingsModal").onclick=function(e){ if(e.target===$("settingsModal")) $("settingsModal").classList.remove("open"); };

  /* =================== boot =================== */
  applyTheme(0); syncMotion(); renderAll(); renderFoot(); initFirebase();
  window.__astral={ state:state, render:renderAll };
})();
</script>
</body>
</html>
