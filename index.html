<style>
  :root{
    --c1:hsl(265,80%,52%); --c2:hsl(300,78%,50%); --c3:hsl(230,80%,50%);
    --o1:.15; --o2:.12; --o3:.07;
    --accent:hsl(265,82%,74%); --accent-soft:hsla(265,82%,60%,.16); --accent-line:hsla(265,82%,70%,.32);
    --ink:#f4f4f7; --ink-dim:#8b8b98; --ink-faint:#565663;
    --line:rgba(255,255,255,0.07); --line-soft:rgba(255,255,255,0.045);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{ background:#000; color:var(--ink); font-family:"DM Sans",system-ui,-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; }

  /* ---------- AMOLED aurora ---------- */
  .ambient{ position:fixed; inset:0; z-index:0; background:#000; overflow:hidden; }
  .glow{ position:absolute; border-radius:50%; filter:blur(130px); mix-blend-mode:screen; will-change:transform;
    transition:background-color 1.1s linear, opacity 1s linear;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .g1{ width:74vw; height:54vh; top:-34vh; left:-26vw; background:var(--c1); opacity:var(--o1); animation-name:float1; animation-duration:34s; }
  .g2{ width:80vw; height:58vh; bottom:-36vh; right:-28vw; background:var(--c2); opacity:var(--o2); animation-name:float2; animation-duration:46s; }
  .g3{ width:54vw; height:40vh; top:52vh; left:38vw; background:var(--c3); opacity:var(--o3); animation-name:float3; animation-duration:40s; }
  .ambient::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(88% 74% at 50% 38%, rgba(0,0,0,var(--darkness,.86)), rgba(0,0,0,0) 80%); }
  .ambient.still .glow{ animation-play-state:paused; }
  @keyframes float1{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(12vw,9vh) scale(1.1)} }
  @keyframes float2{ 0%,100%{transform:translate(0,0) scale(1.05)} 50%{transform:translate(-13vw,-8vh) scale(.92)} }
  @keyframes float3{ 0%,100%{transform:translate(-50%,0) scale(1)} 50%{transform:translate(-38%,-9vh) scale(1.14)} }
  @media (prefers-reduced-motion: reduce){ .glow{ animation-duration:240s !important; } }

  .app{ position:relative; z-index:1; height:100dvh; display:grid; grid-template-columns:300px 1fr; transition:grid-template-columns .24s ease; }
  .app.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .app.sidebar-collapsed .drawer{ min-width:0; overflow:hidden; opacity:0; pointer-events:none; }
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; }

  /* ---------- top bar ---------- */
  .bar{ display:flex; align-items:center; gap:6px; padding:calc(var(--safe-t) + 12px) 18px 12px; flex:none; }
  .icon{ width:40px; height:40px; flex:none; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); cursor:pointer; border-radius:12px; transition:.15s; }
  #settingsBtn{ display:none; }
  .icon:hover{ color:var(--ink); background:rgba(255,255,255,.05); } .icon svg{ width:20px; height:20px; transition:transform .24s cubic-bezier(.2,.9,.3,1.4); }
  .icon:hover svg{ transform:scale(1.1); } .icon:active{ transform:scale(.92); }
  #settingsBtn:hover svg,.settings-gear:hover svg{ transform:rotate(65deg); }
  .icon.hide-wide{ display:grid; }
  .spacer{ flex:1; }
  .bar-actions{ display:flex; align-items:center; justify-content:flex-end; gap:6px; min-width:0; }
  /* Top-bar actions are secondary chrome, so they read as quiet outline chips.
     The one filled accent control in the app is ＋ New in the sidebar; add
     .primary here if a bar action ever needs to outrank it. */
  .copy-all{ display:inline-flex; align-items:center; gap:7px; flex:none; white-space:nowrap; font-weight:600; font-size:.82rem; color:var(--ink-dim); background:rgba(255,255,255,.045); cursor:pointer; border:1px solid var(--line); border-radius:10px; padding:8px 13px; transition:transform .06s, background .15s, border-color .15s, color .15s; }
  .copy-all:hover{ color:var(--ink); background:rgba(255,255,255,.085); border-color:var(--accent-line); } .copy-all:active{ transform:scale(.97); } .copy-all svg{ width:15px; height:15px; }
  .copy-all.primary{ color:#08080a; background:var(--accent); border-color:transparent; }
  .copy-all.primary:hover{ color:#08080a; background:var(--accent); filter:brightness(1.08); }
  .copy-all.done{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .save-state{ margin-right:8px; font-family:"DM Mono",monospace; font-size:.68rem; color:var(--ink-faint); white-space:nowrap; transition:color .16s; }
  .save-state.saving{ color:var(--accent); }
  .save-state.cloud{ color:#6ee7b7; }
  .save-state.bad{ color:#f87171; }

  .title-tools{ display:flex; align-items:center; gap:10px; margin:4px 0 0; }
  .title-tools .title{ flex:1; min-width:0; }
  .ai-title{ flex:none; display:inline-flex; align-items:center; gap:6px; margin-top:5px; padding:8px 10px; border:1px solid var(--accent-line); border-radius:10px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font:600 .72rem "DM Sans",sans-serif; white-space:nowrap; }
  .ai-title:hover{ filter:brightness(1.1); } .ai-title:disabled{ cursor:wait; opacity:.7; }

  /* ---------- canvas ---------- */
  .canvas{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; padding:0 26px calc(120px + var(--safe-b)); }
  .canvas::-webkit-scrollbar{ width:9px; } .canvas::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:9px; }
  .sheet{ max-width:760px; margin:0 auto; padding-top:8px; }
  .title{ width:100%; background:none; border:none; outline:none; resize:none; overflow:hidden; display:block; color:var(--ink); font-family:inherit; font-weight:700; letter-spacing:-.02em; font-size:clamp(2rem,6vw,3rem); line-height:1.06; padding:6px 0 0; }
  .title::placeholder{ color:var(--ink-faint); }
  .todo-title-row{ display:flex; align-items:flex-start; gap:12px; }
  .todo-title-row .title{ flex:1; min-width:0; }
  .todo-item-check{ width:40px; height:40px; margin-top:8px; flex:none; display:grid; place-items:center; border:1px solid var(--accent-line); border-radius:12px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font-size:1.1rem; font-weight:800; transition:.15s; }
  .todo-item-check:hover{ filter:brightness(1.15); transform:scale(1.04); }
  .todo-item-check.done{ color:#07110c; background:#6ee7b7; border-color:#6ee7b7; }
  .todo-item-delete{ flex:none; margin-top:8px; border:1px solid rgba(248,113,113,.3); border-radius:10px; padding:10px 12px; color:#f87171; background:rgba(248,113,113,.09); cursor:pointer; font:600 .78rem "DM Sans",sans-serif; }
  .todo-item-delete:hover{ background:rgba(248,113,113,.18); }
  .todo-title-row.done .title{ color:var(--ink-dim); text-decoration:line-through; }

  .assign{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:14px 0 12px; }
  .pickbtn{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; transition:color .14s,background .14s,border-color .14s,transform .16s cubic-bezier(.2,.9,.3,1.3); }
  .pickbtn:hover{ color:var(--ink); background:rgba(255,255,255,.08); border-color:var(--accent-line); transform:translateY(-1px); }
  .pickbtn:active{ transform:translateY(0) scale(.96); }
  .chip{ animation:popIn .28s cubic-bezier(.2,1.1,.35,1) both; }
  .pickbtn svg{ width:13px; height:13px; }
  .color-swatch{ width:10px; height:10px; border:1px solid rgba(255,255,255,.28); border-radius:50%; background:var(--ink-dim); }
  .chip{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); padding:5px 9px 5px 8px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .chip .cx{ cursor:pointer; opacity:.55; font-size:.92rem; line-height:1; color:var(--ink-faint); } .chip .cx:hover{ opacity:1; color:#f87171; }

  .meta{ font-family:"DM Mono",monospace; font-size:.72rem; color:var(--ink-faint); margin:0 0 26px; }
  .meta b{ color:var(--ink-dim); font-weight:500; }

  .note-editor{ display:grid; gap:4px; padding-bottom:24px; }
  .note-editor-tools{ display:flex; justify-content:flex-end; margin:-7px 0 6px; }
  .attachment-add{ flex:none; border:1px solid var(--line); border-radius:999px; padding:7px 11px; color:var(--ink-dim); background:rgba(255,255,255,.035); cursor:pointer; font:600 .75rem "DM Sans",sans-serif; transition:.15s; }
  .attachment-add:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-paragraph-wrap{ position:relative; padding-bottom:2px; transition:padding-bottom .15s; }
  .note-paragraph{ min-height:88px; outline:none; color:var(--ink); font-size:1.08rem; line-height:1.72; padding:2px 0; white-space:pre-wrap; }
  .note-paragraph:empty::before{ content:attr(data-placeholder); color:var(--ink-faint); pointer-events:none; }
  .note-paragraph b,.note-paragraph strong{ font-weight:700; } .note-paragraph i,.note-paragraph em{ font-style:italic; } .note-paragraph u{ text-decoration-color:var(--accent); text-underline-offset:3px; }
  .note-format-trigger{ position:absolute; z-index:5; right:0; bottom:5px; width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; color:var(--ink-dim); background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); cursor:pointer; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,color .15s,border-color .15s,background .15s,visibility .15s; }
  .note-format-trigger svg{ width:14px; height:14px; }
  .note-paragraph-wrap:hover .note-format-trigger,.note-paragraph-wrap:focus-within .note-format-trigger,.note-paragraph-wrap.format-open .note-format-trigger{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-format-trigger:hover,.note-paragraph-wrap.format-open .note-format-trigger{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-format{ position:absolute; z-index:4; right:34px; bottom:5px; display:flex; gap:3px; padding:4px; border:1px solid var(--line); border-radius:10px; background:rgba(13,13,17,.92); box-shadow:0 12px 30px rgba(0,0,0,.28); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,visibility .15s; }
  .note-paragraph-wrap.format-open .note-format{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-format button{ min-width:25px; height:24px; border:0; border-radius:6px; color:var(--ink-dim); background:transparent; cursor:pointer; font:700 .73rem "DM Sans",sans-serif; }
  .note-format button:hover{ color:var(--ink); background:var(--accent-soft); }
  .note-block-actions{ position:absolute; z-index:6; display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:10px; background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,visibility .15s; }
  .note-block-actions button{ width:24px; height:24px; display:grid; place-items:center; border:0; border-radius:6px; color:var(--ink-dim); background:transparent; cursor:pointer; }
  .note-block-actions button svg{ width:14px; height:14px; } .note-block-actions button:hover{ color:var(--ink); background:var(--accent-soft); } .note-block-actions button.delete:hover{ color:#fca5a5; background:rgba(248,113,113,.12); } .note-block-actions button:disabled{ cursor:default; opacity:.3; }
  .note-paragraph-actions{ right:34px; bottom:5px; } .note-heading-actions{ right:34px; bottom:5px; } .note-chapter-actions{ right:0; bottom:5px; }
  .note-paragraph-wrap:hover .note-paragraph-actions,.note-paragraph-wrap:focus-within .note-paragraph-actions,.note-heading:hover .note-heading-actions,.note-heading:focus-within .note-heading-actions,.note-chapter:hover .note-chapter-actions,.note-chapter:focus-within .note-chapter-actions{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-paragraph-wrap:hover,.note-paragraph-wrap:focus-within,.note-heading:hover,.note-heading:focus-within{ padding-bottom:39px; }
  .note-paragraph-wrap.format-open .note-paragraph-actions{ opacity:0; visibility:hidden; pointer-events:none; }
  .note-heading{ position:relative; display:flex; align-items:center; gap:8px; margin:18px 0 5px; padding-bottom:2px; transition:padding-bottom .15s; }
  .note-heading input{ flex:1; min-width:0; padding:1px 0; border:0; outline:none; color:var(--ink); background:transparent; font-family:inherit; font-weight:700; letter-spacing:-.025em; transition:padding .14s; }
  .note-heading.h1 input{ font-size:1.75rem; } .note-heading.h2 input{ font-size:1.4rem; } .note-heading.h3 input{ font-size:1.12rem; }
  .heading-size{ position:absolute; right:0; bottom:5px; width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; color:var(--ink-dim); background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); cursor:pointer; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,color .15s,border-color .15s,background .15s,visibility .15s; }
  .heading-size svg{ width:14px; height:14px; } .note-heading:focus-within .heading-size,.note-heading:hover .heading-size{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); } .heading-size:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-comment{ margin:10px 0; padding:12px 16px; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); color:var(--ink-dim); text-align:center; }
  .note-comment small{ display:block; margin-bottom:4px; color:var(--accent); font:500 .6rem "DM Mono",monospace; letter-spacing:.15em; }
  .note-comment textarea{ width:100%; min-height:34px; border:0; outline:none; resize:none; color:inherit; background:transparent; text-align:center; font:italic .94rem/1.55 "DM Sans",sans-serif; }
  .note-prompt{ display:grid; gap:9px; margin:12px 0; padding:13px; border:1px solid var(--accent-line); border-radius:14px; background:linear-gradient(135deg,var(--accent-soft),rgba(255,255,255,.025)); }
  .note-prompt-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; } .note-prompt-head b{ color:var(--accent); font-size:.78rem; } .note-prompt-head button{ border:1px solid var(--line); border-radius:7px; padding:5px 8px; color:var(--ink-dim); background:rgba(0,0,0,.15); cursor:pointer; font:600 .68rem "DM Sans",sans-serif; }
  .note-prompt textarea{ width:100%; min-height:108px; border:0; outline:none; resize:vertical; color:var(--ink); background:transparent; font:.9rem/1.6 "DM Mono",monospace; }
  .note-group{ margin:12px 0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.022); }
  .note-group summary{ display:flex; align-items:center; gap:9px; padding:11px 12px; color:var(--ink); cursor:pointer; list-style:none; font-size:.86rem; font-weight:600; } .note-group summary::-webkit-details-marker{ display:none; }
  .note-group summary::before{ content:"›"; color:var(--accent); font-size:1.2rem; transition:transform .16s; } .note-group[open] summary::before{ transform:rotate(90deg); }
  .note-group summary input{ flex:1; min-width:0; border:0; outline:none; color:inherit; background:transparent; font:inherit; font-weight:inherit; }
  .note-group-body{ min-height:74px; padding:2px 13px 14px 34px; outline:none; color:var(--ink-dim); font-size:.94rem; line-height:1.65; white-space:pre-wrap; } .note-group-body:empty::before{ content:"Add group content…"; color:var(--ink-faint); }
  .note-chapter{ position:relative; padding:4px 0 22px; border-bottom:1px solid var(--line-soft); margin-bottom:18px; }
  .note-chapter:last-child{ border-bottom:none; }
  .note-chapter-head{ display:flex; align-items:center; gap:9px; }
  .note-chapter-index{ flex:none; color:var(--accent); font:500 .66rem "DM Mono",monospace; }
  .note-chapter-title{ flex:1; min-width:0; border:0; outline:0; padding:3px 0; color:var(--ink); background:transparent; font:600 1.02rem "DM Sans",sans-serif; }
  .note-chapter-title::placeholder{ color:var(--ink-faint); }
  .note-chapter-listen{ flex:none; display:inline-flex; align-items:center; gap:5px; padding:6px 9px; border:1px solid var(--accent-line); border-radius:8px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font:600 .7rem "DM Sans",sans-serif; }
  .note-chapter-listen.done{ color:#04120c; background:#34d399; border-color:#34d399; }
  .note-chapter-audio-menu{ flex:none; width:29px; height:29px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:8px; color:var(--ink-dim); background:rgba(255,255,255,.04); cursor:pointer; font:700 1rem/1 "DM Sans",sans-serif; }
  .note-chapter-audio-menu:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-chapter .note-paragraph-wrap{ margin:5px 0 0 25px; }
  .note-chapter .note-paragraph{ min-height:64px; font-size:1rem; }
  /* Code has a status line at its bottom. Keep its block controls below the
     editor instead of covering that line, while all other block controls stay
     exactly where they are. */
  .note-code{ position:relative; margin:12px 0 51px; padding-top:1px; }
  .note-code .note-block-actions{ right:9px; bottom:-34px; top:auto; }
  .note-code:hover .note-block-actions,.note-code:focus-within .note-block-actions{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .workout-summary{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:8px 0 12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--accent-soft); }
  .workout-summary b{ color:var(--accent); } .workout-summary small{ color:var(--ink-faint); }
  .note-drop{ height:10px; margin:0; border-radius:7px; transition:height .14s,background .14s,border-color .14s; }
  .note-editor.dragging .note-drop{ height:30px; border:1px dashed rgba(255,255,255,.14); }
  .note-editor.dragging .note-drop::after{ content:"Drop attachment here"; display:block; color:var(--ink-faint); font:500 .64rem "DM Mono",monospace; text-align:center; line-height:28px; opacity:0; transition:opacity .14s; }
  .note-editor.dragging .note-drop.over{ border-color:var(--accent-line); background:var(--accent-soft); }
  .note-editor.dragging .note-drop.over::after{ opacity:1; color:var(--accent); }
  .note-attachment{ width:min(100%,var(--attachment-width,100%)); position:relative; margin:10px 0 14px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:rgba(255,255,255,.035); box-shadow:0 12px 38px rgba(0,0,0,.16); cursor:grab; }
  .note-attachment.dragging{ opacity:.42; } .note-attachment:active{ cursor:grabbing; }
  .attachment-grip{ position:absolute; z-index:2; top:9px; left:9px; padding:4px 6px; border-radius:7px; color:rgba(255,255,255,.68); background:rgba(10,10,14,.58); font:700 .72rem "DM Mono",monospace; letter-spacing:-.18em; pointer-events:none; }
  .note-attachment-image{ display:block; width:100%; max-height:70vh; min-height:112px; object-fit:contain; background:rgba(0,0,0,.28); }
  .note-attachment-video{ display:block; width:100%; max-height:70vh; min-height:180px; background:#000; }
  .note-attachment-file{ display:flex; align-items:center; gap:10px; min-height:78px; padding:14px 64px 14px 14px; }

  .attachment-info{ min-width:0; flex:1; display:grid; gap:3px; } .attachment-info b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.84rem; } .attachment-info small{ color:var(--ink-faint); font:400 .66rem "DM Mono",monospace; }

  .tg .tag-count{ min-width:19px; padding:2px 5px; border-radius:6px; color:var(--ink-faint); background:rgba(255,255,255,.055); font:500 .58rem "DM Mono",monospace; text-align:center; transition:color .16s,background .16s; }

  /* ---------- motion system ----------
     Entrance animations are opt-in per render: JS adds .enter (or a --i stagger
     index) only when the thing on screen actually changed, so routine
     re-renders — a keystroke, a checkbox — never replay them.
     Everything here is switched off by Settings → Motion and by the OS
     reduced-motion preference, both of which land on body.reduce-fx. */
  @keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(9px) } to{ opacity:1; transform:none } }
  @keyframes popIn{ 0%{ opacity:0; transform:translateY(6px) scale(.96) } 62%{ opacity:1; transform:translateY(-1px) scale(1.012) } 100%{ opacity:1; transform:none } }
  @keyframes menuIn{ from{ opacity:0; transform:translateY(-5px) scale(.94) } to{ opacity:1; transform:none } }
  @keyframes menuRow{ from{ opacity:0; transform:translateX(-6px) } to{ opacity:1; transform:none } }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(16px) scale(.96) } to{ opacity:1; transform:none } }
  @keyframes sheetIn{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:none } }
  @keyframes tickPop{ 0%{ transform:scale(.3) rotate(-25deg) } 60%{ transform:scale(1.28) rotate(6deg) } 100%{ transform:none } }
  @keyframes sheen{ to{ transform:translateX(420%) } }
  @keyframes justAdded{
    0%{ opacity:0; transform:translateY(-9px) scale(.97); box-shadow:0 0 0 2px var(--accent-line) }
    55%{ opacity:1; transform:none; box-shadow:0 0 0 2px var(--accent-line) }
    100%{ opacity:1; transform:none; box-shadow:0 0 0 8px transparent }
  }

  /* The stagger index is capped in JS, so a 400-note list never waits seconds
     for its last row to arrive. */
  .d-list.enter .d-item{ animation:fadeUp .34s cubic-bezier(.2,.9,.3,1) both; animation-delay:calc(var(--i,0) * 26ms); }
  .tagcloud.enter .tg{ animation:popIn .34s cubic-bezier(.2,.9,.3,1.1) both; animation-delay:calc(var(--i,0) * 30ms); }
  /* Scoped through .d-list so it outranks the stagger rule above — a brand new
     row should flash, not queue up behind the others. */
  .d-list .d-item.just-added{ animation:justAdded .55s cubic-bezier(.2,.9,.3,1.1) both; animation-delay:0s; }
  .sheet.enter{ animation:sheetIn .34s cubic-bezier(.2,.9,.3,1) both; }
  .tag-empty{ animation:fadeIn .25s ease both; }

    lines.push("HOW YOU WORK");

    lines.push("- If the user only wants feedback, an opinion, or an answer, reply in words and do not call propose_edits.");
    lines.push("- You can use list_notes to see note titles and ids. Before reading any note that is not open, call request_note_access; the app will ask the user first. Only use read_notes after access is granted.");
    lines.push("- When the user asks you to create a new note, call create_note. The app asks the user for confirmation before saving it.");
    lines.push("- Only propose an edit when they asked for one, or when you offered and they agreed.");
    lines.push("- You can create and edit the document's text blocks: paragraphs, headings, chapters, comments, prompts, collapsible groups, and code. Use propose_edits with insert_after and block_type to create one; use an existing target_id to edit one. File attachments cannot be created or changed by the assistant.");
    lines.push("- Keep normal replies to one to three short sentences. They are read aloud, so use no markdown, lists, headings, or emoji.");
    lines.push("- Exception: after proposing an edit, or when the user asks to hear, repeat, or recap a pending suggestion, read the proposed wording aloud verbatim before saying it is waiting for approval. Never tell them to look at the preview or say you cannot see it.");
    lines.push("- Write proposed text in the user's own voice and formatting. Do not introduce styling the document does not already use.");
    lines.push("- Voice transcripts contain filler and misheard words. Read past them for intent and never quote the transcript back.");
    lines.push("- If a request is ambiguous, ask one short question instead of guessing at a large rewrite.");
    if(targetItem&&targets.length){
      lines.push("");
      lines.push("EDITING RULES");
      lines.push("- Every editable piece of the open document is listed below with a target_id. Use those ids exactly and never invent one.");

    if(longMemory){ lines.push(""); lines.push("LONG-TERM MEMORY"); lines.push(agentJsonString(longMemory)); }
    if(shortMemory){ lines.push(""); lines.push("SHORT-TERM MEMORY"); lines.push(agentJsonString(shortMemory)); }

    if(targetItem&&targets.length){
      lines.push("OPEN DOCUMENT — "+itemLabel(targetItem));
      var body=targets.map(function(t){ return "--- target_id: "+t.id+"\npart: "+t.label+"\ntext: "+(t.text?t.text:"(empty)"); }).join("\n");

  function collabTools(hasDocument){

        edits:{type:"array",description:"The changes, in document order.",items:{type:"object",properties:{

    tools.push({type:"function",function:{
      name:"request_note_access",

  /* ---------- model and speech APIs ---------- */
  function openaiRequest(path,body){
    var key=runtimeApiKeys.openai;
    if(!key) return Promise.reject(new Error("Add your OpenAI API key in Settings → API keys."));
    return fetch("https://api.openai.com/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify(body)}).then(function(response){
      return response.text().then(function(raw){
        var data=null;
        try{ data=JSON.parse(raw); }catch(e){}
        if(!response.ok) throw new Error((data&&data.error&&data.error.message)||("OpenAI request failed ("+response.status+")."));
        if(!data) throw new Error("OpenAI returned an unreadable response.");
        return data;
      });
    });
  }
  function generateNoteTitle(note){
    var source=itemText(note).replace(/\s+/g," ").trim().slice(0,12000);
    if(!source) return Promise.reject(new Error("The note is empty"));
    return openaiRequest("chat/completions",{
      model:"gpt-4o-mini",
      temperature:0.2,
      max_tokens:24,
      messages:[
        {role:"system",content:"Create a concise, descriptive title for the user's note. Return only 1 to 6 words. Do not use quotation marks, markdown, or ending punctuation."},
        {role:"user",content:source}
      ]
    }).then(function(result){
      var raw=cleanText(result&&result.choices&&result.choices[0]&&result.choices[0].message&&result.choices[0].message.content).replace(/^['\"`]+|['\"`]+$/g,"").replace(/[.!?]+$/g,"").trim();
      return raw.split(/\s+/).slice(0,6).join(" ");
    });
  }
  /* Reasoning models reject temperature outright. Rather than track which ones,
     retry once without it whenever the API names it in the error. */
  function agentCompletion(agentItem,messages,tools){
    var a=normalizeAgent(agentItem);
    function send(withTemperature,allowModelFallback){
      var body={model:a.model||AGENT_DEFAULT_MODEL,messages:messages};
      if(tools&&tools.length){ body.tools=tools; body.tool_choice="auto"; }
      if(withTemperature) body.temperature=a.temperature;
      return openaiRequest("chat/completions",body).catch(function(error){
        if(withTemperature&&/temperature/i.test(error.message||"")) return send(false);
        if(allowModelFallback!==false&&a.model!==AGENT_DEFAULT_MODEL&&/(model|does not exist|not found|unavailable)/i.test(error.message||"")){
          console.warn("Agent model unavailable; retrying with "+AGENT_DEFAULT_MODEL);
          a.model=AGENT_DEFAULT_MODEL; return send(withTemperature,false);
        }
        throw error;
      });
    }
    return send(true,true);
  }
  function agentModels(){
    if(agentModelCache) return Promise.resolve(agentModelCache);
    var key=runtimeApiKeys.openai;
    if(!key) return Promise.resolve(AGENT_FALLBACK_MODELS.slice());
    return fetch("https://api.openai.com/v1/models",{headers:{"Authorization":"Bearer "+key}}).then(function(response){
      if(!response.ok) throw new Error("Model list unavailable");
      return response.json();
    }).then(function(data){
      var skip=/embedding|whisper|tts|dall-e|moderation|audio|realtime|transcribe|image|davinci|babbage|codex|sora|computer-use|instruct|vision-preview|search-preview|gpt-3\.5|gpt-4-0613|turbo-2024/i;
      var ids=(data&&data.data||[]).map(function(model){ return cleanText(model&&model.id); })
        .filter(function(id){ return id&&( /^(gpt-|o[134])/i.test(id))&&!skip.test(id); }).sort();
      agentModelCache=ids.length?ids:AGENT_FALLBACK_MODELS.slice();
      return agentModelCache;
    }).catch(function(error){ console.warn("OpenAI model list unavailable:",error); return AGENT_FALLBACK_MODELS.slice(); });
  }
  function transcribeSpeech(blob){
    var name="speech."+audioFileExtension(blob.type);
    function viaElevenLabs(){
      var form=new FormData();
      form.append("file",blob,name); form.append("model_id","scribe_v1");
      return fetch("https://api.elevenlabs.io/v1/speech-to-text",{method:"POST",headers:{"xi-api-key":runtimeApiKeys.elevenlabs},body:form}).then(function(response){
        return response.text().then(function(raw){
          var data=null; try{ data=JSON.parse(raw); }catch(e){}
          if(!response.ok){
            var detail=data&&data.detail;
            throw new Error(cleanText(detail&&detail.message)||cleanText(typeof detail==="string"?detail:"")||"ElevenLabs could not transcribe that.");
          }
          return cleanText(data&&data.text);
        });
      });
    }
    function viaOpenAI(){
      var form=new FormData();
      form.append("file",blob,name); form.append("model","whisper-1");
      return fetch("https://api.openai.com/v1/audio/transcriptions",{method:"POST",headers:{"Authorization":"Bearer "+runtimeApiKeys.openai},body:form}).then(function(response){
        return response.text().then(function(raw){
          var data=null; try{ data=JSON.parse(raw); }catch(e){}
          if(!response.ok) throw new Error((data&&data.error&&data.error.message)||"OpenAI could not transcribe that.");
          return cleanText(data&&data.text);
        });
      });
    }
    if(runtimeApiKeys.elevenlabs) return viaElevenLabs().catch(function(error){
      if(!runtimeApiKeys.openai) throw error;
      console.warn("ElevenLabs transcription failed, falling back to OpenAI:",error);
      return viaOpenAI();
    });
    if(runtimeApiKeys.openai) return viaOpenAI();
    return Promise.reject(new Error("Add an ElevenLabs or OpenAI key to use the microphone."));
  }

  /* ---------- spoken replies ---------- */
  function stopCollabSpeech(){
    collab.speakToken++;
    if(collab.audio){ try{ collab.audio.pause(); }catch(e){} collab.audio=null; }
    if(collab.audioUrl){ URL.revokeObjectURL(collab.audioUrl); collab.audioUrl=null; }
  }
  function splitCollabSpeech(text){
    var remaining=cleanText(text), chunks=[];
    while(remaining.length>COLLAB_SPEECH_CHUNK_LIMIT){
      var at=Math.max(remaining.lastIndexOf(". ",COLLAB_SPEECH_CHUNK_LIMIT-1),remaining.lastIndexOf("! ",COLLAB_SPEECH_CHUNK_LIMIT-1),remaining.lastIndexOf("? ",COLLAB_SPEECH_CHUNK_LIMIT-1),remaining.lastIndexOf("\n",COLLAB_SPEECH_CHUNK_LIMIT-1));
      if(at<Math.floor(COLLAB_SPEECH_CHUNK_LIMIT*.55)) at=remaining.lastIndexOf(" ",COLLAB_SPEECH_CHUNK_LIMIT-1);
      if(at<1) at=COLLAB_SPEECH_CHUNK_LIMIT-1;
      chunks.push(remaining.slice(0,at+1).trim());
      remaining=remaining.slice(at+1).trim();
    }
    if(remaining) chunks.push(remaining);
    return chunks;
  }
  function speakCollab(text){
    var spoken=cleanText(text);
    if(!agentSettings().speakReplies||!runtimeApiKeys.elevenlabs||!spoken) return;
    var agentItem=collabAgent(); if(!agentItem) return;
    stopTts(); stopCollabSpeech();
    var token=collab.speakToken, chunks=splitCollabSpeech(spoken), voiceId=normalizeAgent(agentItem).voiceId;
    function playNext(){
      if(token!==collab.speakToken||!collab.host) return;
      var chunk=chunks.shift();
      if(!chunk){ stopCollabSpeech(); setCollabStatus(""); return; }
      requestTtsAudio(chunk,voiceId).then(function(blob){
        if(token!==collab.speakToken||!collab.host) return;
        if(collab.audioUrl) URL.revokeObjectURL(collab.audioUrl);
        collab.audioUrl=URL.createObjectURL(blob);
        collab.audio=new Audio(collab.audioUrl);
        collab.audio.onended=function(){
          if(token!==collab.speakToken) return;
          collab.audio=null;
          if(collab.audioUrl){ URL.revokeObjectURL(collab.audioUrl); collab.audioUrl=null; }
          playNext();
        };
        collab.audio.onerror=function(){ if(token===collab.speakToken){ stopCollabSpeech(); setCollabStatus(""); } };
        setCollabStatus("Speaking…");
        return collab.audio.play();
      }).catch(function(error){
        console.warn("Agent speech failed:",error);
        if(token===collab.speakToken){ stopCollabSpeech(); setCollabStatus(""); }
      });
    }
    playNext();
  }

  /* ---------- conversation state ---------- */
  function collabAgent(){ return agentById(collab.agentId)||preferredAgent(); }
  function collabDocument(){
    if(collab.mode!=="document"||!collab.itemId) return null;
    var it=(state.items||[]).find(function(x){ return x.id===collab.itemId; });
    return (it&&it.type!=="agent")?it:null;
  }
  function collabConversation(){

    return agentItem?normalizeAgent(agentItem).chat:[];
  }
  function pushCollabMessage(role,text){

    log.push({role:role,text:String(text||"").slice(0,COLLAB_MESSAGE_LIMIT),ts:Date.now()});
    while(log.length>COLLAB_HISTORY_LIMIT) log.shift();
    if(doc) doc.updated=Date.now();

    save(); renderCollabLog();
  }
  function noteCatalog(includeAgents){

      return {id:it.id,title:it.title||("Untitled "+itemLabel(it).toLowerCase()),type:itemLabel(it)};

  function noteTextForAgent(it){

  function createAgentNote(title,content){

  /* Session notes and proposals are deliberately not persisted: they describe

  /* ---------- proposals: the only path from model output to your text ---------- */
  function proposalEditPreviewText(edit){
    if(edit.action==="append") return joinText(edit.source||"",edit.after,edit.inline);
    if(edit.action==="prepend") return joinText(edit.after,edit.source||"",edit.inline);
    return edit.after||"";
  }
  function collabPendingProposalContext(){
    var pending=collab.proposals.filter(function(proposal){ return proposal.state==="pending"; });
    if(!pending.length) return "";
    var text=pending.map(function(proposal){
      return "Suggestion: "+proposal.summary+"\n"+proposal.edits.map(function(edit){
        return "Part: "+edit.label+"\nProposed wording:\n"+proposalEditPreviewText(edit);
      }).join("\n\n");
    }).join("\n\n");
    return text.length>COLLAB_PROPOSAL_CONTEXT_LIMIT?text.slice(0,COLLAB_PROPOSAL_CONTEXT_LIMIT)+"\n(Pending suggestions truncated.)":text;

  function proposalSpokenReply(proposals){

        if(text) readings.push((proposal.edits.length>1?"For "+edit.label+", ":"")+text);
      });
    });
    if(!readings.length) return agentSettings().requireApproval?"I have a suggestion waiting for your approval.":"I applied the requested change automatically.";

      ? "Here is the suggested wording. "+readings.join(" ")+" It is only a suggestion and is waiting for your approval."

  function buildProposal(summary,rawEdits,targets){
    var index={};

    (Array.isArray(rawEdits)?rawEdits:[]).forEach(function(raw){
      if(!raw||typeof raw!=="object") return;
      var targetId=cleanText(raw.target_id), text=typeof raw.text==="string"?raw.text:"";
      var action=["replace","append","prepend","insert_after"].indexOf(raw.action)>=0?raw.action:"replace";
      if(!targetId||!text) return;
      var target=index[targetId];
      if(action==="insert_after"){
        edits.push({targetId:targetId,action:action,after:text,before:"",note:cleanText(raw.note),
          blockType:["paragraph","heading","chapter","comment","prompt","group","code"].indexOf(raw.block_type)>=0?raw.block_type:"paragraph",
          label:target?target.label:(targetId==="end"?"End of document":"Unknown part"),
          actionLabel:target?"new part after this":"added at the end"});

      }
      if(!target) return;
      edits.push({targetId:targetId,action:action,after:text,source:target.text,inline:target.inline,note:cleanText(raw.note),label:target.label,

  function applyProposal(proposal){
    var it=collabDocument();

    if(agentSettings().backupBeforeWork) captureAutoBackup(true,"agent");

        :edit.action==="prepend"?joinText(edit.after,target.text,target.inline)

  /* ---------- a turn ---------- */
  function collabApiMessages(agentItem,targetItem,targets){
    var messages=[{role:"system",content:collabSystemPrompt(agentItem,targetItem,targets)}];
    collabConversation().forEach(function(entry){
      messages.push({role:entry.role==="user"?"user":"assistant",content:entry.text});
    });
    return messages;
  }
  function runCollabTurn(){
    var agentItem=collabAgent();
    if(!agentItem){ setCollabStatus("Create an agent first.",true); return; }
    if(!runtimeApiKeys.openai){ setCollabStatus("Add your OpenAI API key in Settings → API keys.",true); return; }
    var targetItem=collabDocument(), targets=collabTargets(targetItem);
    var messages=collabApiMessages(agentItem,targetItem,targets), tools=collabTools(!!(targetItem&&targets.length)), turnProposals=[];

    var rounds=0;

      rounds++;
      return agentCompletion(agentItem,messages,tools).then(function(data){
        var a=normalizeAgent(agentItem);
        if(data&&data.usage&&typeof data.usage.total_tokens==="number") a.stats.tokens+=data.usage.total_tokens;
        var choice=data&&data.choices&&data.choices[0], message=choice&&choice.message;

        if(!calls.length) return cleanText(message.content);
        messages.push({role:"assistant",content:message.content||null,tool_calls:calls});
        calls.forEach(function(call){
          var name=call&&call.function&&call.function.name, args={}, result="Done.";
          try{ args=JSON.parse(call.function.arguments||"{}"); }catch(e){ args={}; }
          if(name==="propose_edits"){
            var proposal=buildProposal(args.summary,args.edits,targets);
            if(proposal){
              collab.proposals.push(proposal); turnProposals.push(proposal);
              if(agentSettings().requireApproval){
                renderCollabLog();
                result="Preview shown to the user with Apply and Discard buttons. The app will read the exact proposed wording aloud and remind them it is waiting for approval.";
              } else {
                applyProposal(proposal);
                result="The proposal was applied automatically after saving a backup.";
              }
            }
            else result="No usable edits were in that call. Check that every target_id came from the OPEN DOCUMENT list.";
          } else if(name==="list_notes"){
            result=JSON.stringify(noteCatalog(!!args.include_agents));
          } else if(name==="request_note_access"){
            var requested=(Array.isArray(args.note_ids)?args.note_ids:[]).map(cleanText).filter(Boolean);
            var available=(state.items||[]).filter(function(it){ return requested.indexOf(it.id)>=0&&it.type!=="agent"; });
            if(!available.length) result="No matching notes were found. Use list_notes first.";
            else {
              var labels=available.map(function(it){ return (it.title||"Untitled")+" ("+itemLabel(it)+")"; }).join(", ");
              var allowed=window.confirm("Allow the assistant to read these notes?\n\n"+labels+"\n\nReason: "+(cleanText(args.reason)||"requested by the assistant"));
              if(allowed){ collab.grantedNoteIds=collab.grantedNoteIds||{}; available.forEach(function(it){ collab.grantedNoteIds[it.id]=true; }); result="Permission granted for: "+available.map(function(it){return it.id;}).join(", "); }
              else result="Permission denied by the user.";

            var ids=(Array.isArray(args.note_ids)?args.note_ids:[]).map(cleanText).filter(Boolean), granted=collab.grantedNoteIds||{};
            var readable=(state.items||[]).filter(function(it){ return ids.indexOf(it.id)>=0&&granted[it.id]&&it.type!=="agent"; });
            result=readable.length?readable.map(noteTextForAgent).join("\n\n---\n\n"):"No approved notes matched. Ask for permission first.";
          } else if(name==="create_note"){
            var noteTitle=cleanText(args.title), noteContent=typeof args.content==="string"?args.content.trim():"";
            if(!noteTitle||!noteContent) result="A title and non-empty content are required.";
            else if(window.confirm("Create a new note?\n\n"+noteTitle+"\n\n"+noteContent.slice(0,800)+(noteContent.length>800?"…":""))){
              if(agentSettings().backupBeforeWork) captureAutoBackup(true,"agent");
              var created=createAgentNote(noteTitle,noteContent); result="Created note "+created.id+" titled \""+created.title+"\".";
            } else result="The user cancelled note creation.";
          } else if(name==="remember"){
            var key=cleanText(args.key), value=cleanText(args.value);
            if(key&&value){
              var where=agentMemoryWrite(agentItem,args.scope==="short"?"short":"long",key,value);

          messages.push({role:"tool",tool_call_id:call.id,content:result});
        });

  function releaseCollabRecorder(){
    if(collab.recorderStream) collab.recorderStream.getTracks().forEach(function(track){ track.stop(); });

  function toggleCollabMic(){
    if(collab.recorder){ stopCollabRecording(); return; }
    if(collab.busy) return;
    if(activeAudioRecorder){ setCollabStatus("Finish the audio recording first.",true); return; }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ setCollabStatus("This browser can’t record audio.",true); return; }
    if(!runtimeApiKeys.elevenlabs&&!runtimeApiKeys.openai){ setCollabStatus("Add an API key in Settings → API keys first.",true); return; }
    stopCollabSpeech(); stopTts();
    setCollabStatus("Waiting for the microphone…");
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mimeType=audioRecordingMimeType(), recorder, chunks=[], failed=false;
      try{ recorder=mimeType?new MediaRecorder(stream,{mimeType:mimeType}):new MediaRecorder(stream); }
      catch(error){ stream.getTracks().forEach(function(track){ track.stop(); }); throw error; }
      collab.recorder=recorder; collab.recorderStream=stream; collab.recorderStop=false;
      recorder.ondataavailable=function(event){ if(event.data&&event.data.size) chunks.push(event.data); };
      recorder.onerror=function(error){ failed=true; console.warn("Agent recording failed:",error); };
      recorder.onstop=function(){
        var blob=new Blob(chunks,{type:recorder.mimeType||mimeType||"audio/webm"});
        releaseCollabRecorder();
        if(failed||!blob.size){ setCollabStatus("Nothing was recorded.",true); return; }
        setCollabStatus("Transcribing…");
        collab.busy=true; updateCollabControls();
        transcribeSpeech(blob).then(function(text){
          collab.busy=false; updateCollabControls();
          if(!text){ setCollabStatus("That came through silent — try again.",true); return; }
          sendCollabMessage(text);
        }).catch(function(error){
          collab.busy=false; updateCollabControls();
          console.warn("Transcription failed:",error);
          pushCollabNote(cleanText(error&&error.message)||"That could not be transcribed.",true);
          setCollabStatus("");
        });
      };
      recorder.start();
      startCollabSession();
      setCollabStatus("Listening — tap the microphone again when you’re done.");
      updateCollabControls();
    }).catch(function(error){
      console.warn("Microphone unavailable:",error);
      releaseCollabRecorder();
      setCollabStatus(error&&error.name==="NotAllowedError"?"Microphone permission was blocked for this site.":"The microphone could not be opened.",true);
    });
  }

    var entries=collabConversation().map(function(entry){ return {ts:entry.ts||0,order:0,node:collabMessageNode(entry)}; })

    if(!userId||!db){ status.textContent="Sign in first. API keys only sync to your signed-in account."; return; }
    status.textContent="Loading your synced API keys…";
    getPrivateSettings().then(function(settings){
      if(!openai.isConnected||!eleven.isConnected) return;
      var keys=settings.apiKeys||{};
      openai.value=cleanText(keys.openai)||runtimeApiKeys.openai;
      eleven.value=cleanText(keys.elevenlabs)||runtimeApiKeys.elevenlabs;
      setEnabled(true);
      status.textContent=settings.apiVault&&!settings.apiKeys?"An older vault was found. Type your keys once to replace it.":"Changes save and sync automatically as you type.";
    }).catch(function(error){ console.warn(error); status.textContent="Could not load API keys. Check your cloud connection."; });
    function saveKeys(){
      if(!currentUser||currentUser.uid!==userId||!db) return;
      var keys={version:1,openai:cleanText(openai.value),elevenlabs:cleanText(eleven.value),updated:Date.now()};
      status.textContent="Saving and syncing…";
      savePrivateSettings({apiKeys:keys,apiVault:firebase.firestore.FieldValue.delete()}).then(function(){
        applyApiSettings({apiKeys:keys,voiceSettings:{selectedVoiceId:runtimeApiKeys.elevenlabsVoice,savedVoices:runtimeApiKeys.savedVoices}});
        if(status.isConnected) status.textContent="Saved. Your signed-in devices update automatically.";
      }).catch(function(error){ console.warn(error); if(status.isConnected) status.textContent="Could not sync API keys. Check your cloud connection."; });
    }
    function queueSave(){
      clearTimeout(apiKeySaveTimer);
      status.textContent="Saving changes…";
      apiKeySaveTimer=setTimeout(saveKeys,650);
    }
    openai.oninput=queueSave;
    eleven.oninput=queueSave;
  }
  function voiceChoice(voice){
    var id=cleanText(voice&&voice.id||voice&&voice.voice_id||voice), labels=voice&&voice.labels&&typeof voice.labels==="object"?voice.labels:{}, details=[];
    if(voice&&voice.description) details.push(cleanText(voice.description));
    Object.keys(labels).forEach(function(key){ var value=cleanText(labels[key]); if(value&&details.indexOf(value)<0) details.push(value); });
    return {id:id,name:cleanText(voice&&voice.name)||id,detail:details.slice(0,3).join(" · ")||cleanText(voice&&voice.category)||"Saved ElevenLabs voice"};
  }
  function getVoiceChoices(voices,selectedId){
    var all={}, choices=[];
    function include(voice){
      var choice=voiceChoice(voice);
      if(!choice.id||all[choice.id]) return;
      all[choice.id]=choice;
      choices.push(choice);
    }
    include({id:DEFAULT_ELEVENLABS_VOICE,name:"Default voice",description:"Rachel · ElevenLabs default"});
    cleanSavedVoices(runtimeApiKeys.savedVoices).forEach(include);
    (voices||[]).forEach(include);
    if(selectedId&&!all[selectedId]) include({id:selectedId,name:"Saved voice",description:"Added with ElevenLabs Voice ID"});
    choices.sort(function(a,b){ if(a.id===DEFAULT_ELEVENLABS_VOICE) return -1; if(b.id===DEFAULT_ELEVENLABS_VOICE) return 1; return a.name.localeCompare(b.name); });
    return {all:all,choices:choices};
  }
  function addVoiceChoice(list,choice,selected){
    var button=document.createElement("button"), copy=document.createElement("span"), name=document.createElement("b"), detail=document.createElement("small"), mark=document.createElement("span");
    button.type="button"; button.className="voice-choice"+(selected?" selected":""); button.setAttribute("data-voice-id",choice.id);
    copy.className="voice-choice-copy"; name.textContent=choice.name; detail.textContent=choice.detail; copy.appendChild(name); copy.appendChild(detail);
    mark.className="voice-choice-mark"; mark.textContent=selected?"Selected":"";
    button.appendChild(copy); button.appendChild(mark); list.appendChild(button);
  }
  function renderVoicePicker(picker,list,voices,selectedId,query){
    var built=getVoiceChoices(voices,selectedId), selected=built.all[selectedId], pickerName=picker.querySelector("b"), pickerDetail=picker.querySelector("small"), filter=cleanText(query).toLowerCase();
    pickerName.textContent=selected?selected.name:"ElevenLabs Voice ID";
    pickerDetail.textContent=selected?selected.detail:"Paste a voice ID to add it to your list";
    list.innerHTML="";
    var custom=document.createElement("button"), copy=document.createElement("span"), name=document.createElement("b"), detail=document.createElement("small"), mark=document.createElement("span");
    custom.type="button"; custom.className="voice-choice custom"; custom.setAttribute("data-voice-id",CUSTOM_VOICE_OPTION);
    copy.className="voice-choice-copy"; name.textContent="ElevenLabs Voice ID"; detail.textContent="Paste a voice ID and save it to your list"; copy.appendChild(name); copy.appendChild(detail);
    mark.className="voice-choice-mark"; mark.textContent="＋"; custom.appendChild(copy); custom.appendChild(mark); list.appendChild(custom);
    var shown=0;
    built.choices.forEach(function(choice){
      if(filter&&((choice.name+" "+choice.detail+" "+choice.id).toLowerCase().indexOf(filter)<0)) return;
      addVoiceChoice(list,choice,choice.id===selectedId); shown++;
    });
    if(!shown){ var empty=document.createElement("div"); empty.className="voice-empty"; empty.textContent="No saved voices match that search."; list.appendChild(empty); }
  }
  function getElevenLabsSavedVoices(apiKey){
    var voices=[];
    function loadPage(token){
      var url="https://api.elevenlabs.io/v2/voices?voice_type=saved&page_size=100&include_total_count=false"+(token?"&next_page_token="+encodeURIComponent(token):"");
      return fetch(url,{headers:{"xi-api-key":apiKey}}).then(function(response){
        if(!response.ok) return response.text().then(function(message){ throw new Error(message||"ElevenLabs could not load voices"); });
        return response.json();
      }).then(function(data){
        voices=voices.concat(Array.isArray(data.voices)?data.voices:[]);
        return data.has_more&&data.next_page_token?loadPage(data.next_page_token):voices;
      });
    }
    return loadPage("");
  }
  function findElevenLabsVoice(apiKey,voiceId){
    var url="https://api.elevenlabs.io/v2/voices?voice_ids="+encodeURIComponent(voiceId)+"&page_size=1&include_total_count=false";
    return fetch(url,{headers:{"xi-api-key":apiKey}}).then(function(response){
      if(!response.ok) return response.text().then(function(message){ throw new Error(message||"ElevenLabs could not check that voice"); });
      return response.json();
    }).then(function(data){ return Array.isArray(data.voices)&&data.voices.length?data.voices[0]:null; });
  }
  function saveVoiceSettings(selectedVoiceId,savedVoices){
    return savePrivateSettings({voiceSettings:{version:1,selectedVoiceId:selectedVoiceId,savedVoices:cleanSavedVoices(savedVoices),updated:Date.now()}});
  }
  function setupVoiceSettings(){
    var picker=$("elevenlabsVoicePicker"), menu=$("elevenlabsVoiceMenu"), search=$("elevenlabsVoiceSearch"), list=$("elevenlabsVoiceOptions"), custom=$("customVoiceEntry"), input=$("customElevenlabsVoiceId"), save=$("saveCustomVoiceBtn"), status=$("voiceStatus"), userId=currentUser&&currentUser.uid, fetched=[];
    var chapterNames=$("readChapterNamesToggle"); chapterNames.classList.toggle("on",state.readChapterNames);
    chapterNames.onclick=function(){ state.readChapterNames=!state.readChapterNames; chapterNames.classList.toggle("on",state.readChapterNames); persist(); };
    function currentVoiceId(){ return runtimeApiKeys.elevenlabsVoice||DEFAULT_ELEVENLABS_VOICE; }
    function render(selectedId){ renderVoicePicker(picker,list,fetched,selectedId||currentVoiceId(),search.value); }
    function setMenu(open){ menu.hidden=!open; picker.classList.toggle("open",open); picker.setAttribute("aria-expanded",open?"true":"false"); if(open) search.focus(); }
    function showCustom(show){ custom.hidden=!show; if(show) input.focus(); }
    function selectVoice(id,saved){
      var previous=currentVoiceId();
      setMenu(false);
      status.textContent="Saving your voice choice…";
      saveVoiceSettings(id,saved).then(function(){
        runtimeApiKeys.elevenlabsVoice=id;
        runtimeApiKeys.savedVoices=cleanSavedVoices(saved);
        updateTtsButton(current());
        render(id);
        if(status.isConnected) status.textContent="Voice selected and synced to your signed-in devices.";
      }).catch(function(error){ console.warn(error); render(previous); if(status.isConnected) status.textContent="Could not save your voice choice. Check your cloud connection."; });
    }
    if(!userId||!db){
      render(currentVoiceId());
      status.textContent="Sign in and add an ElevenLabs API key to choose a voice.";
      return;
    }
    getPrivateSettings().then(function(settings){
      if(!picker.isConnected||!currentUser||currentUser.uid!==userId) return;
      applyApiSettings(settings);
      var selectedId=currentVoiceId();
      render(selectedId);
      if(!runtimeApiKeys.elevenlabs){
        status.textContent="Add an ElevenLabs API key in API keys to load your saved voices.";
        return;
      }
      status.textContent="Loading your saved ElevenLabs voices…";
      getElevenLabsSavedVoices(runtimeApiKeys.elevenlabs).then(function(voices){
        if(!picker.isConnected) return;
        fetched=voices;
        render(selectedId);
        picker.disabled=false;
        status.textContent=voices.length?"Loaded "+voices.length+" saved ElevenLabs voice"+(voices.length===1?".":"s."):"No saved ElevenLabs voices were found yet.";
      }).catch(function(error){
        console.warn("ElevenLabs voice list failed:",error);
        render(selectedId);
        picker.disabled=false;
        status.textContent="Could not load saved voices. Check your ElevenLabs API key.";
      });
    }).catch(function(error){ console.warn(error); status.textContent="Could not load voice settings. Check your cloud connection."; });
    picker.onclick=function(){ if(picker.disabled) return; if(menu.hidden){ render(currentVoiceId()); setMenu(true); } else setMenu(false); };
    search.oninput=function(){ render(currentVoiceId()); };
    list.onclick=function(event){
      var button=event.target.closest("[data-voice-id]");
      if(!button||!list.contains(button)) return;
      var id=button.getAttribute("data-voice-id");
      if(id===CUSTOM_VOICE_OPTION){ setMenu(false); renderVoicePicker(picker,list,fetched,"",search.value); showCustom(true); return; }
      showCustom(false);
      selectVoice(id,runtimeApiKeys.savedVoices);
    };
    save.onclick=function(){
      var id=cleanText(input.value);
      if(!id){ status.textContent="Paste an ElevenLabs Voice ID first."; input.focus(); return; }
      if(!runtimeApiKeys.elevenlabs){ status.textContent="Add an ElevenLabs API key before saving a voice ID."; return; }
      save.disabled=true;
      status.textContent="Checking that voice ID…";
      findElevenLabsVoice(runtimeApiKeys.elevenlabs,id).then(function(voice){
        if(!voice) throw new Error("Voice not found");
        var saved=cleanSavedVoices(runtimeApiKeys.savedVoices.concat([{id:id,name:cleanText(voice.name)||id}]));
        return saveVoiceSettings(id,saved).then(function(){ return {saved:saved,voice:voice}; });
      }).then(function(result){
        runtimeApiKeys.elevenlabsVoice=id;
        runtimeApiKeys.savedVoices=result.saved;
        updateTtsButton(current());
        input.value="";
        showCustom(false);
        render(id);
        status.textContent="Saved "+(cleanText(result.voice.name)||"voice")+" to your list and selected it.";
      }).catch(function(error){ console.warn("ElevenLabs voice ID failed:",error); status.textContent="That voice ID is not available to this ElevenLabs API key."; }).then(function(){ save.disabled=false; });
    };
  }
  function backupDate(value){ try{ return new Date(value).toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return "Unknown date"; } }
  function deviceBackupEntries(){ return autoBackups().map(function(entry,index){ return {id:"device-"+index,source:"device",kind:entry.kind||"automatic",created:entry.created,itemCount:(entry.data.items||[]).length,data:entry.data}; }); }
  function loadBackupEntries(){
    var deviceEntries=deviceBackupEntries();
    return currentUser&&db?getCloudBackups().then(function(entries){ return entries.concat(deviceEntries).sort(function(a,b){ return b.created-a.created; }); },function(error){ console.warn("Cloud restore points unavailable:",error); return deviceEntries; }):Promise.resolve(deviceEntries);
  }
  function backupFilename(entry){
    var timestamp=new Date(entry.created||Date.now()).toISOString().replace(/[:.]/g,"-");
    return "second-brain-restore-"+(entry.source||"device")+"-"+(entry.kind||"backup")+"-"+timestamp+".json";
  }
  function downloadRestorePoint(entry){
    if(!entry||!entry.data) return;
    var payload=backupSnapshot(entry.data);
    payload.exportType="restore-point";
    payload.exported=Date.now();
    payload.restorePointMetadata={source:entry.source||"device",kind:entry.kind||"automatic",created:entry.created||0,itemCount:entry.itemCount||0};
    downloadJson(payload,backupFilename(entry),"Restore point JSON downloaded");
  }
  function downloadAllRestorePoints(){
    loadBackupEntries().then(function(entries){
      downloadJson({app:"second-brain",exportType:"restore-points",exported:Date.now(),restorePoints:entries.map(function(entry){ return {source:entry.source||"device",kind:entry.kind||"automatic",created:entry.created||0,itemCount:entry.itemCount||0,data:entry.data}; })},"second-brain-restore-points-"+new Date().toISOString().replace(/[:.]/g,"-")+".json","Restore points JSON downloaded");
    }).catch(function(error){ console.warn(error); showToast("Restore points could not be downloaded",true); });
  }
  function renderBackupList(){
    var el=$("backupList"); if(!el) return;
    el.innerHTML='<p class="hint">Loading restore points…</p>';
    loadBackupEntries().then(function(entries){
      if(!el||!el.isConnected) return;
      if(!entries.length){ el.innerHTML='<p class="hint">No backups yet. Create one now, then automatic backups will appear here over time.</p>'; return; }
      el.innerHTML="";
      entries.forEach(function(entry){
        var row=document.createElement("div"); row.className="backup-entry";
        row.innerHTML='<div class="bi"><b></b><small></small></div><div class="backup-actions"><button class="b2 backup-json">JSON</button><button class="b2 backup-restore">Restore</button></div>';
        row.querySelector("b").textContent=entry.kind==="manual"?"Manual backup":entry.kind==="recovery"?"Recovery point":entry.kind==="agent"?"Before agent session":"Automatic backup";
        row.querySelector("small").textContent=backupDate(entry.created)+" · "+(entry.itemCount||((entry.data.items||[]).length))+" items";
        row.querySelector("button").onclick=function(){ restoreBackup(entry); };
        if(entry.kind==="migration") row.querySelector("b").textContent="Before chapter migration";
        row.querySelector("small").textContent+=" · "+(entry.source==="cloud"?"Cloud":"This device");
        row.querySelector(".backup-json").onclick=function(){ downloadRestorePoint(entry); };
        row.querySelector(".backup-restore").onclick=function(){ restoreBackup(entry); };
        el.appendChild(row);
      });
    }).catch(function(e){ console.warn(e); if(el&&el.isConnected) el.innerHTML='<p class="hint">Cloud backups could not be loaded. Check that the updated Firestore rules have been deployed.</p>'; });
  }
  function setupBackupSettings(){
    $("backupNowBtn").onclick=function(){
      var button=this, savedOnDevice=captureAutoBackup(true,"manual");
      if(!savedOnDevice) doExport("Backup downloaded as a recovery copy");
      renderBackupList();
      if(!currentUser||!db){ if(savedOnDevice) showToast("Backup saved on this device"); return; }
      button.disabled=true;
      writeCloudBackup("manual").then(function(){ showToast(savedOnDevice?"Backup saved on this device and to cloud":"Cloud backup created"); renderBackupList(); }).catch(function(e){
        console.warn("Cloud backup unavailable:",e);
        showToast(savedOnDevice?"Backup saved on this device; cloud copy is unavailable":"Cloud copy unavailable — recovery file downloaded",!savedOnDevice);
      }).then(function(){ button.disabled=false; });
    };
    $("expBtn").onclick=doExport;
    $("exportRestorePointsBtn").onclick=downloadAllRestorePoints;
    $("impBtn").onclick=function(){ $("impFile").click(); };
    $("impFile").onchange=function(e){ var f=e.target.files[0]; if(f) doImport(f); e.target.value=""; };
    renderBackupList();
  }
  function buildThemeGrid(){
    var grid=$("themeGrid"); if(!grid) return;
    grid.innerHTML="";
    THEMES.forEach(function(t){
      var b=document.createElement("button"); b.className="th"+(t.id===state.theme?" on":"");
      b.setAttribute("aria-label","Use "+t.name+" theme");
      b.setAttribute("aria-pressed",t.id===state.theme?"true":"false");
      b.style.setProperty("--preview","radial-gradient(circle at 12% 10%,"+hsl(t.glows[0])+" 0,transparent 54%),radial-gradient(circle at 92% 88%,"+hsl(t.glows[1])+" 0,transparent 58%),radial-gradient(circle at 60% 55%,"+hsl(t.glows[2])+" 0,transparent 50%)");
      b.innerHTML='<span class="prev"></span><span class="nm">'+t.name+'</span><span class="check">✓</span>';
      b.onclick=function(){ state.theme=t.id; applyTheme(0); syncMotion(); buildThemeGrid(); persist(); };
      grid.appendChild(b);

  function renderAcct(){
    var el=$("acctInner"); if(!el) return;
    var cfg=getCfg();
    if(currentUser){
      el.innerHTML='<div class="acctbox">'+(currentUser.photoURL?'<img src="'+currentUser.photoURL+'" alt="">':'')+'<div class="ai"><b></b><small>Notes sync automatically</small></div></div><div class="btnrow"><button class="b2" id="soBtn">Sign out &amp; wipe this device</button></div>';

        '<button class="gsign" id="giBtn"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.9 35.6 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>Sign in with Google</button>';
      $("giBtn").onclick=signIn;

  function cloudFileStatus(file){
    if(file.kind==="current") return file.inBackup?"Current attachment and backup file":"Current attachment";
    if(file.kind==="backup") return "Backup-only file";
    return "Unlinked cloud file";
  }
  function removeCloudFileReferences(path){
    var changed=false;
    forEachContentDocument(function(note){
      var removed=contentFiles(note).filter(function(attachment){ return attachment.storagePath===path; });
      if(!removed.length) return;
      var removedIds={}; removed.forEach(function(attachment){ removedIds[attachment.id]=true; removeAttachmentFile(note.id,attachment.id); });
      if(note.type==="audio"){
        note.recordings=(note.recordings||[]).filter(function(recording){ return !removedIds[recording.id]; });
        touchContent(note); changed=true; return;
      }
      note.attachments=note.attachments.filter(function(attachment){ return !removedIds[attachment.id]; });
      note.blocks=(note.blocks||[]).filter(function(block){ return !(block.type==="attachment"&&removedIds[block.attachmentId]); });
      if(!note.blocks.some(function(block){ return block.type==="text"; })) note.blocks.unshift(textBlock(""));
      syncNoteBody(note); touchContent(note); changed=true;
    });
    return changed;
  }
  function deleteCloudStorageFile(file){
    if(!currentUser||!storage||!file||!file.path||file.deleting) return;
    var impact=file.kind==="current"?" It is attached to a current note, so its attachment block will also be removed. Any backup that references it will no longer be able to restore that file.":file.kind==="backup"?" It is only retained by a cloud backup, so that backup will no longer be able to restore the file.":" It is not referenced by your current notes or cloud backups.";
    if(!confirm("Permanently delete "+file.name+" ("+fileSize(file.size)+") from cloud storage?"+impact)) return;
    file.deleting=true; renderAcct();
    storage.ref(file.path).delete().then(function(){
      if(file.kind==="current"&&removeCloudFileReferences(file.path)){ persist(); renderAll(); }
      showToast("Cloud file deleted"); scheduleAccountUsageRefresh(0);
    }).catch(function(error){
      file.deleting=false; console.warn("Cloud file could not be deleted:",error); renderAcct(); showToast("Couldn’t delete that cloud file",true);
    });
  }
  function renderCloudStorageDetails(container){
    var section=document.createElement("section"); section.className="cloud-storage-details";
    var heading=document.createElement("h4"); heading.textContent="Cloud files"; section.appendChild(heading);
    var intro=document.createElement("p");
    if(accountUsage.status!=="ready"){
      intro.textContent=accountUsage.status==="error"?"Cloud file details are unavailable right now.":"Reading saved cloud files…";
      section.appendChild(intro); container.appendChild(section); return;
    }
    var files=accountUsage.files||[];
    intro.textContent=files.length?"Every file stored for this account is listed below. Unlinked files still use storage; delete only files you no longer need.":"No files are stored in this account’s Cloud Storage folder.";
    section.appendChild(intro);
    if(files.length){
      var list=document.createElement("div"); list.className="cloud-storage-file-list";
      files.forEach(function(file){
        var row=document.createElement("div"); row.className="cloud-storage-file"+(file.kind==="unlinked"?" unlinked":""); row.title=file.path;
        var name=document.createElement("b"); name.textContent=file.name; row.appendChild(name);
        var size=document.createElement("em"); size.textContent=fileSize(file.size); row.appendChild(size);
        var detail=document.createElement("small"); detail.textContent=cloudFileStatus(file)+" · "+file.path; row.appendChild(detail);
        var remove=document.createElement("button"); remove.type="button"; remove.className="b2"; remove.textContent=file.deleting?"Deleting…":"Delete permanently"; remove.disabled=!!file.deleting; remove.onclick=function(){ deleteCloudStorageFile(file); }; row.appendChild(remove);
        list.appendChild(row);
      });
      section.appendChild(list);
    }
    container.appendChild(section);
  }
  $("settingsBtn").onclick=function(){ openSettings(); };
  $("settingsModal").onclick=function(e){ if(e.target===$("settingsModal")) $("settingsModal").classList.remove("open"); };

  /* =================== boot =================== */
  trackTimeSpent(); captureAutoBackup(false); applyTheme(0); syncMotion(); renderAll(); renderFoot(); initFirebase();
  window.__astral={ state:state, render:renderAll, api:runtimeApiKeys };
})();
