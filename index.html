<style>
  :root{
    --c1:hsl(265,80%,52%); --c2:hsl(300,78%,50%); --c3:hsl(230,80%,50%);
    --o1:.15; --o2:.12; --o3:.07;
    --accent:hsl(265,82%,74%); --accent-soft:hsla(265,82%,60%,.16); --accent-line:hsla(265,82%,70%,.32);
    --ink:#f4f4f7; --ink-dim:#8b8b98; --ink-faint:#565663;
    --line:rgba(255,255,255,0.07); --line-soft:rgba(255,255,255,0.045);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{ background:#000; color:var(--ink); font-family:"DM Sans",system-ui,-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; }

  /* ---------- AMOLED aurora ---------- */
  .ambient{ position:fixed; inset:0; z-index:0; background:#000; overflow:hidden; }
  .glow{ position:absolute; border-radius:50%; filter:blur(130px); mix-blend-mode:screen; will-change:transform;
    transition:background-color 1.1s linear, opacity 1s linear;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .g1{ width:74vw; height:54vh; top:-34vh; left:-26vw; background:var(--c1); opacity:var(--o1); animation-name:float1; animation-duration:34s; }
  .g2{ width:80vw; height:58vh; bottom:-36vh; right:-28vw; background:var(--c2); opacity:var(--o2); animation-name:float2; animation-duration:46s; }
  .g3{ width:54vw; height:40vh; top:52vh; left:38vw; background:var(--c3); opacity:var(--o3); animation-name:float3; animation-duration:40s; }
  .ambient::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(88% 74% at 50% 38%, rgba(0,0,0,var(--darkness,.86)), rgba(0,0,0,0) 80%); }
  .ambient.still .glow{ animation-play-state:paused; }
  @keyframes float1{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(12vw,9vh) scale(1.1)} }
  @keyframes float2{ 0%,100%{transform:translate(0,0) scale(1.05)} 50%{transform:translate(-13vw,-8vh) scale(.92)} }
  @keyframes float3{ 0%,100%{transform:translate(-50%,0) scale(1)} 50%{transform:translate(-38%,-9vh) scale(1.14)} }
  @media (prefers-reduced-motion: reduce){ .glow{ animation-duration:240s !important; } }

  .app{ position:relative; z-index:1; height:100dvh; display:grid; grid-template-columns:300px 1fr; transition:grid-template-columns .24s ease; }
  .app.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .app.sidebar-collapsed .drawer{ min-width:0; overflow:hidden; opacity:0; pointer-events:none; }
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; }

  /* ---------- top bar ---------- */
  .bar{ display:flex; align-items:center; gap:6px; padding:calc(var(--safe-t) + 12px) 18px 12px; flex:none; }
  .icon{ width:40px; height:40px; flex:none; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); cursor:pointer; border-radius:12px; transition:.15s; }
  #settingsBtn{ display:none; }
  .icon:hover{ color:var(--ink); background:rgba(255,255,255,.05); } .icon svg{ width:20px; height:20px; }
  .icon.hide-wide{ display:grid; }
  .spacer{ flex:1; }
  .copy-all{ display:inline-flex; align-items:center; gap:8px; flex:none; white-space:nowrap; font-weight:600; font-size:.9rem; color:#08080a; background:var(--accent); cursor:pointer; border:none; border-radius:999px; padding:9px 16px; transition:transform .06s, filter .15s; }
  .copy-all:hover{ filter:brightness(1.08); } .copy-all:active{ transform:scale(.97); } .copy-all svg{ width:16px; height:16px; }
  .copy-all.done{ background:#34d399; color:#04120c; }
  .save-state{ margin-right:8px; font-family:"DM Mono",monospace; font-size:.68rem; color:var(--ink-faint); white-space:nowrap; transition:color .16s; }
  .save-state.saving{ color:var(--accent); }
  .save-state.cloud{ color:#6ee7b7; }
  .save-state.bad{ color:#f87171; }

  /* ---------- canvas ---------- */
  .canvas{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; padding:0 26px calc(120px + var(--safe-b)); }
  .canvas::-webkit-scrollbar{ width:9px; } .canvas::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:9px; }
  .sheet{ max-width:760px; margin:0 auto; padding-top:8px; }
  .title{ width:100%; background:none; border:none; outline:none; resize:none; overflow:hidden; display:block; color:var(--ink); font-family:inherit; font-weight:700; letter-spacing:-.02em; font-size:clamp(2rem,6vw,3rem); line-height:1.06; padding:6px 0 0; }
  .title::placeholder{ color:var(--ink-faint); }
  .todo-title-row{ display:flex; align-items:flex-start; gap:12px; }

  .todo-item-delete:hover{ background:rgba(248,113,113,.18); }
  .todo-title-row.done .title{ color:var(--ink-dim); text-decoration:line-through; }

  .assign{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:14px 0 12px; }
  .pickbtn{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; transition:.14s; }
  .pickbtn:hover{ color:var(--ink); background:rgba(255,255,255,.08); }
  .pickbtn svg{ width:13px; height:13px; }
  .chip{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); padding:5px 9px 5px 8px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .chip .cx{ cursor:pointer; opacity:.55; font-size:.92rem; line-height:1; color:var(--ink-faint); } .chip .cx:hover{ opacity:1; color:#f87171; }

  .meta{ font-family:"DM Mono",monospace; font-size:.72rem; color:var(--ink-faint); margin:0 0 26px; }
  .meta b{ color:var(--ink-dim); font-weight:500; }

  .note-editor-tools{ display:flex; justify-content:flex-end; margin:-7px 0 6px; }
  .attachment-add{ flex:none; border:1px solid var(--line); border-radius:999px; padding:7px 11px; color:var(--ink-dim); background:rgba(255,255,255,.035); cursor:pointer; font:600 .75rem "DM Sans",sans-serif; transition:.15s; }
  .attachment-add:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-paragraph-wrap{ position:relative; padding-bottom:2px; transition:padding-bottom .15s; }

  .note-paragraph:empty::before{ content:attr(data-placeholder); color:var(--ink-faint); pointer-events:none; }
  .note-paragraph b,.note-paragraph strong{ font-weight:700; } .note-paragraph i,.note-paragraph em{ font-style:italic; } .note-paragraph u{ text-decoration-color:var(--accent); text-underline-offset:3px; }
  .note-format-trigger{ position:absolute; z-index:5; right:0; bottom:5px; width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; color:var(--ink-dim); background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); cursor:pointer; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,color .15s,border-color .15s,background .15s,visibility .15s; }
  .note-format-trigger svg{ width:14px; height:14px; }
  .note-paragraph-wrap:hover .note-format-trigger,.note-paragraph-wrap:focus-within .note-format-trigger,.note-paragraph-wrap.format-open .note-format-trigger{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-format-trigger:hover,.note-paragraph-wrap.format-open .note-format-trigger{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-format{ position:absolute; z-index:4; right:34px; bottom:5px; display:flex; gap:3px; padding:4px; border:1px solid var(--line); border-radius:10px; background:rgba(13,13,17,.92); box-shadow:0 12px 30px rgba(0,0,0,.28); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,visibility .15s; }
  .note-paragraph-wrap.format-open .note-format{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-format button{ min-width:25px; height:24px; border:0; border-radius:6px; color:var(--ink-dim); background:transparent; cursor:pointer; font:700 .73rem "DM Sans",sans-serif; }
  .note-format button:hover{ color:var(--ink); background:var(--accent-soft); }
  .note-block-actions{ position:absolute; z-index:6; display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:10px; background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,visibility .15s; }
  .note-block-actions button{ width:24px; height:24px; display:grid; place-items:center; border:0; border-radius:6px; color:var(--ink-dim); background:transparent; cursor:pointer; }
  .note-block-actions button svg{ width:14px; height:14px; } .note-block-actions button:hover{ color:var(--ink); background:var(--accent-soft); } .note-block-actions button.delete:hover{ color:#fca5a5; background:rgba(248,113,113,.12); } .note-block-actions button:disabled{ cursor:default; opacity:.3; }
  .note-paragraph-actions{ right:34px; bottom:5px; } .note-heading-actions{ right:34px; bottom:5px; }
  .note-paragraph-wrap:hover .note-paragraph-actions,.note-paragraph-wrap:focus-within .note-paragraph-actions,.note-heading:hover .note-heading-actions,.note-heading:focus-within .note-heading-actions{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-paragraph-wrap:hover,.note-paragraph-wrap:focus-within,.note-heading:hover,.note-heading:focus-within{ padding-bottom:39px; }
  .note-paragraph-wrap.format-open .note-paragraph-actions{ opacity:0; visibility:hidden; pointer-events:none; }
  .note-heading{ position:relative; display:flex; align-items:center; gap:8px; margin:18px 0 5px; padding-bottom:2px; transition:padding-bottom .15s; }
  .note-heading input{ flex:1; min-width:0; padding:1px 0; border:0; outline:none; color:var(--ink); background:transparent; font-family:inherit; font-weight:700; letter-spacing:-.025em; transition:padding .14s; }
  .note-heading.h1 input{ font-size:1.75rem; } .note-heading.h2 input{ font-size:1.4rem; } .note-heading.h3 input{ font-size:1.12rem; }
  .heading-size{ position:absolute; right:0; bottom:5px; width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; color:var(--ink-dim); background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); cursor:pointer; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,color .15s,border-color .15s,background .15s,visibility .15s; }
  .heading-size svg{ width:14px; height:14px; } .note-heading:focus-within .heading-size,.note-heading:hover .heading-size{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); } .heading-size:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-comment{ margin:10px 0; padding:12px 16px; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); color:var(--ink-dim); text-align:center; }
  .note-comment small{ display:block; margin-bottom:4px; color:var(--accent); font:500 .6rem "DM Mono",monospace; letter-spacing:.15em; }
  .note-comment textarea{ width:100%; min-height:34px; border:0; outline:none; resize:none; color:inherit; background:transparent; text-align:center; font:italic .94rem/1.55 "DM Sans",sans-serif; }
  .note-prompt{ display:grid; gap:9px; margin:12px 0; padding:13px; border:1px solid var(--accent-line); border-radius:14px; background:linear-gradient(135deg,var(--accent-soft),rgba(255,255,255,.025)); }
  .note-prompt-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; } .note-prompt-head b{ color:var(--accent); font-size:.78rem; } .note-prompt-head button{ border:1px solid var(--line); border-radius:7px; padding:5px 8px; color:var(--ink-dim); background:rgba(0,0,0,.15); cursor:pointer; font:600 .68rem "DM Sans",sans-serif; }
  .note-prompt textarea{ width:100%; min-height:108px; border:0; outline:none; resize:vertical; color:var(--ink); background:transparent; font:.9rem/1.6 "DM Mono",monospace; }
  .note-group{ margin:12px 0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.022); }
  .note-group summary{ display:flex; align-items:center; gap:9px; padding:11px 12px; color:var(--ink); cursor:pointer; list-style:none; font-size:.86rem; font-weight:600; } .note-group summary::-webkit-details-marker{ display:none; }
  .note-group summary::before{ content:"›"; color:var(--accent); font-size:1.2rem; transition:transform .16s; } .note-group[open] summary::before{ transform:rotate(90deg); }
  .note-group summary input{ flex:1; min-width:0; border:0; outline:none; color:inherit; background:transparent; font:inherit; font-weight:inherit; }
  .note-group-body{ min-height:74px; padding:2px 13px 14px 34px; outline:none; color:var(--ink-dim); font-size:.94rem; line-height:1.65; white-space:pre-wrap; } .note-group-body:empty::before{ content:"Add group content…"; color:var(--ink-faint); }
  .note-drop{ height:10px; margin:0; border-radius:7px; transition:height .14s,background .14s,border-color .14s; }
  .note-editor.dragging .note-drop{ height:30px; border:1px dashed rgba(255,255,255,.14); }
  .note-editor.dragging .note-drop::after{ content:"Drop attachment here"; display:block; color:var(--ink-faint); font:500 .64rem "DM Mono",monospace; text-align:center; line-height:28px; opacity:0; transition:opacity .14s; }
  .note-editor.dragging .note-drop.over{ border-color:var(--accent-line); background:var(--accent-soft); }
  .note-editor.dragging .note-drop.over::after{ opacity:1; color:var(--accent); }
  .note-attachment{ width:min(100%,var(--attachment-width,100%)); position:relative; margin:10px 0 14px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:rgba(255,255,255,.035); box-shadow:0 12px 38px rgba(0,0,0,.16); cursor:grab; }
  .note-attachment.dragging{ opacity:.42; } .note-attachment:active{ cursor:grabbing; }
  .attachment-grip{ position:absolute; z-index:2; top:9px; left:9px; padding:4px 6px; border-radius:7px; color:rgba(255,255,255,.68); background:rgba(10,10,14,.58); font:700 .72rem "DM Mono",monospace; letter-spacing:-.18em; pointer-events:none; }
  .note-attachment-image{ display:block; width:100%; max-height:70vh; min-height:112px; object-fit:contain; background:rgba(0,0,0,.28); }
  .note-attachment-file{ display:flex; align-items:center; gap:10px; min-height:78px; padding:14px 64px 14px 14px; }
  .attachment-icon{ width:34px; height:34px; flex:none; display:grid; place-items:center; border-radius:9px; color:var(--accent); background:var(--accent-soft); font-size:.76rem; font-weight:700; }
  .attachment-info{ min-width:0; flex:1; display:grid; gap:3px; } .attachment-info b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.84rem; } .attachment-info small{ color:var(--ink-faint); font:400 .66rem "DM Mono",monospace; }
  .note-attachment-actions{ position:absolute; z-index:2; top:9px; right:9px; display:flex; gap:5px; opacity:0; transition:opacity .14s; }
  .note-attachment:hover .note-attachment-actions,.note-attachment:focus-within .note-attachment-actions{ opacity:1; }
  .attachment-open,.attachment-retry,.attachment-remove{ border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:6px 8px; cursor:pointer; font:600 .7rem "DM Sans",sans-serif; backdrop-filter:blur(8px); }
  .attachment-open{ color:var(--ink); background:rgba(10,10,14,.76); } .attachment-retry{ color:var(--accent); background:rgba(10,10,14,.76); } .attachment-remove{ color:#fca5a5; background:rgba(68,12,18,.82); }
  .attachment-resize{ position:absolute; z-index:3; right:0; bottom:0; width:25px; height:25px; border:0; border-radius:10px 0 0; color:#08080a; background:var(--accent); cursor:se-resize; opacity:0; transition:opacity .14s; }
  .attachment-resize::before{ content:"↘"; font-size:.8rem; font-weight:800; } .note-attachment:hover .attachment-resize,.note-attachment:focus-within .attachment-resize{ opacity:1; }
  .attachment-status{ position:absolute; left:10px; bottom:8px; max-width:calc(100% - 42px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:4px 7px; border-radius:6px; color:rgba(255,255,255,.72); background:rgba(0,0,0,.52); font:500 .62rem "DM Mono",monospace; }

  .ch{ padding:4px 0 22px; border-bottom:1px solid var(--line-soft); margin-bottom:22px; }

  .add:hover{ color:var(--ink); border-color:var(--accent-line); background:var(--accent-soft); }

  #tags.is-collapsed{ display:none; }

  .tagcloud{ display:flex; flex-wrap:wrap; gap:5px; padding:2px 16px 8px; }

  .d-list{ padding:4px 10px 8px; }

  .d-foot{ display:flex; align-items:center; gap:8px; padding:11px 14px; border-top:1px solid var(--line); }

  .storage-usage{ position:relative; display:grid; grid-template-columns:16px minmax(0,1fr) max-content; align-items:center; gap:8px; width:100%; min-height:38px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; color:var(--ink-dim); background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.018)); line-height:1; cursor:pointer; outline:none; transition:border-color .14s,background .14s; }
  .d-foot.has-account .storage-usage{ grid-column:1 / -1; grid-row:2; grid-template-columns:18px minmax(0,1fr) max-content; gap:10px; min-height:44px; padding:6px 12px; border-radius:12px; }

  .storage-label small{ overflow:hidden; color:var(--ink-faint); font:400 .68rem "DM Sans",sans-serif; text-overflow:ellipsis; white-space:nowrap; }

  .cloud-storage-details{ margin-top:16px; }

  /* ---------- floating menu ---------- */

  /* ---------- toast ---------- */
  .toast{ position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%,16px); z-index:120; padding:10px 18px; border-radius:12px; background:#141418; border:1px solid var(--line); font-size:.82rem; color:var(--ink); opacity:0; pointer-events:none; transition:.2s; max-width:88vw; }
  .toast.show{ opacity:1; transform:translate(-50%,0); } .toast .tk{ color:#6ee7b7; } .toast.bad .tk{ color:#f87171; }

  /* ---------- modals ---------- */

  .th .check{ width:18px; height:18px; display:grid; place-items:center; border-radius:50%; color:#070709; background:var(--accent); opacity:0; transform:scale(.7); transition:.14s; font-size:.7rem; font-weight:800; }

    var button=document.createElement("button"), copy=document.createElement("span"), name=document.createElement("b"), detail=document.createElement("small"), mark=document.createElement("span");

    copy.className="voice-choice-copy"; name.textContent=choice.name; detail.textContent=choice.detail; copy.appendChild(name); copy.appendChild(detail);
    mark.className="voice-choice-mark"; mark.textContent=selected?"Selected":"";
    button.appendChild(copy); button.appendChild(mark); list.appendChild(button);
  }
  function renderVoicePicker(picker,list,voices,selectedId,query){
    var built=getVoiceChoices(voices,selectedId), selected=built.all[selectedId], pickerName=picker.querySelector("b"), pickerDetail=picker.querySelector("small"), filter=cleanText(query).toLowerCase();
    pickerName.textContent=selected?selected.name:"ElevenLabs Voice ID";
    pickerDetail.textContent=selected?selected.detail:"Paste a voice ID to add it to your list";
    list.innerHTML="";
    var custom=document.createElement("button"), copy=document.createElement("span"), name=document.createElement("b"), detail=document.createElement("small"), mark=document.createElement("span");
    custom.type="button"; custom.className="voice-choice custom"; custom.setAttribute("data-voice-id",CUSTOM_VOICE_OPTION);
    copy.className="voice-choice-copy"; name.textContent="ElevenLabs Voice ID"; detail.textContent="Paste a voice ID and save it to your list"; copy.appendChild(name); copy.appendChild(detail);
    mark.className="voice-choice-mark"; mark.textContent="＋"; custom.appendChild(copy); custom.appendChild(mark); list.appendChild(custom);
    var shown=0;
    built.choices.forEach(function(choice){
      if(filter&&((choice.name+" "+choice.detail+" "+choice.id).toLowerCase().indexOf(filter)<0)) return;
      addVoiceChoice(list,choice,choice.id===selectedId); shown++;
    });
    if(!shown){ var empty=document.createElement("div"); empty.className="voice-empty"; empty.textContent="No saved voices match that search."; list.appendChild(empty); }
  }
  function getElevenLabsSavedVoices(apiKey){
    var voices=[];
    function loadPage(token){
      var url="https://api.elevenlabs.io/v2/voices?voice_type=saved&page_size=100&include_total_count=false"+(token?"&next_page_token="+encodeURIComponent(token):"");
      return fetch(url,{headers:{"xi-api-key":apiKey}}).then(function(response){
        if(!response.ok) return response.text().then(function(message){ throw new Error(message||"ElevenLabs could not load voices"); });
        return response.json();
      }).then(function(data){
        voices=voices.concat(Array.isArray(data.voices)?data.voices:[]);
        return data.has_more&&data.next_page_token?loadPage(data.next_page_token):voices;
      });
    }
    return loadPage("");
  }
  function findElevenLabsVoice(apiKey,voiceId){
    var url="https://api.elevenlabs.io/v2/voices?voice_ids="+encodeURIComponent(voiceId)+"&page_size=1&include_total_count=false";
    return fetch(url,{headers:{"xi-api-key":apiKey}}).then(function(response){
      if(!response.ok) return response.text().then(function(message){ throw new Error(message||"ElevenLabs could not check that voice"); });
      return response.json();
    }).then(function(data){ return Array.isArray(data.voices)&&data.voices.length?data.voices[0]:null; });
  }
  function saveVoiceSettings(selectedVoiceId,savedVoices){
    return savePrivateSettings({voiceSettings:{version:1,selectedVoiceId:selectedVoiceId,savedVoices:cleanSavedVoices(savedVoices),updated:Date.now()}});
  }
  function setupVoiceSettings(){
    var picker=$("elevenlabsVoicePicker"), menu=$("elevenlabsVoiceMenu"), search=$("elevenlabsVoiceSearch"), list=$("elevenlabsVoiceOptions"), custom=$("customVoiceEntry"), input=$("customElevenlabsVoiceId"), save=$("saveCustomVoiceBtn"), status=$("voiceStatus"), userId=currentUser&&currentUser.uid, fetched=[];
    function currentVoiceId(){ return runtimeApiKeys.elevenlabsVoice||DEFAULT_ELEVENLABS_VOICE; }
    function render(selectedId){ renderVoicePicker(picker,list,fetched,selectedId||currentVoiceId(),search.value); }
    function setMenu(open){ menu.hidden=!open; picker.classList.toggle("open",open); picker.setAttribute("aria-expanded",open?"true":"false"); if(open) search.focus(); }
    function showCustom(show){ custom.hidden=!show; if(show) input.focus(); }
    function selectVoice(id,saved){
      var previous=currentVoiceId();
      setMenu(false);
      status.textContent="Saving your voice choice…";
      saveVoiceSettings(id,saved).then(function(){
        runtimeApiKeys.elevenlabsVoice=id;
        runtimeApiKeys.savedVoices=cleanSavedVoices(saved);
        updateTtsButton(current());
        render(id);
        if(status.isConnected) status.textContent="Voice selected and synced to your signed-in devices.";
      }).catch(function(error){ console.warn(error); render(previous); if(status.isConnected) status.textContent="Could not save your voice choice. Check your cloud connection."; });
    }
    if(!userId||!db){
      render(currentVoiceId());
      status.textContent="Sign in and add an ElevenLabs API key to choose a voice.";
      return;
    }
    getPrivateSettings().then(function(settings){
      if(!picker.isConnected||!currentUser||currentUser.uid!==userId) return;
      applyApiSettings(settings);
      var selectedId=currentVoiceId();
      render(selectedId);
      if(!runtimeApiKeys.elevenlabs){
        status.textContent="Add an ElevenLabs API key in API keys to load your saved voices.";
        return;
      }
      status.textContent="Loading your saved ElevenLabs voices…";
      getElevenLabsSavedVoices(runtimeApiKeys.elevenlabs).then(function(voices){
        if(!picker.isConnected) return;
        fetched=voices;
        render(selectedId);
        picker.disabled=false;
        status.textContent=voices.length?"Loaded "+voices.length+" saved ElevenLabs voice"+(voices.length===1?".":"s."):"No saved ElevenLabs voices were found yet.";
      }).catch(function(error){
        console.warn("ElevenLabs voice list failed:",error);
        render(selectedId);
        picker.disabled=false;
        status.textContent="Could not load saved voices. Check your ElevenLabs API key.";
      });
    }).catch(function(error){ console.warn(error); status.textContent="Could not load voice settings. Check your cloud connection."; });
    picker.onclick=function(){ if(picker.disabled) return; if(menu.hidden){ render(currentVoiceId()); setMenu(true); } else setMenu(false); };
    search.oninput=function(){ render(currentVoiceId()); };
    list.onclick=function(event){
      var button=event.target.closest("[data-voice-id]");
      if(!button||!list.contains(button)) return;
      var id=button.getAttribute("data-voice-id");
      if(id===CUSTOM_VOICE_OPTION){ setMenu(false); renderVoicePicker(picker,list,fetched,"",search.value); showCustom(true); return; }
      showCustom(false);
      selectVoice(id,runtimeApiKeys.savedVoices);
    };
    save.onclick=function(){
      var id=cleanText(input.value);
      if(!id){ status.textContent="Paste an ElevenLabs Voice ID first."; input.focus(); return; }
      if(!runtimeApiKeys.elevenlabs){ status.textContent="Add an ElevenLabs API key before saving a voice ID."; return; }
      save.disabled=true;
      status.textContent="Checking that voice ID…";
      findElevenLabsVoice(runtimeApiKeys.elevenlabs,id).then(function(voice){
        if(!voice) throw new Error("Voice not found");
        var saved=cleanSavedVoices(runtimeApiKeys.savedVoices.concat([{id:id,name:cleanText(voice.name)||id}]));
        return saveVoiceSettings(id,saved).then(function(){ return {saved:saved,voice:voice}; });
      }).then(function(result){
        runtimeApiKeys.elevenlabsVoice=id;
        runtimeApiKeys.savedVoices=result.saved;
        updateTtsButton(current());
        input.value="";
        showCustom(false);
        render(id);
        status.textContent="Saved "+(cleanText(result.voice.name)||"voice")+" to your list and selected it.";
      }).catch(function(error){ console.warn("ElevenLabs voice ID failed:",error); status.textContent="That voice ID is not available to this ElevenLabs API key."; }).then(function(){ save.disabled=false; });
    };
  }
  function backupDate(value){ try{ return new Date(value).toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return "Unknown date"; } }
  function renderBackupList(){
    var el=$("backupList"); if(!el) return;
    el.innerHTML='<p class="hint">Loading restore points…</p>';
    var deviceEntries=autoBackups().map(function(entry,index){ return {id:"device-"+index,kind:entry.kind||"automatic",created:entry.created,itemCount:(entry.data.items||[]).length,data:entry.data}; });
    var load=currentUser&&db?getCloudBackups().then(function(entries){ return entries.concat(deviceEntries).sort(function(a,b){ return b.created-a.created; }); },function(error){ console.warn("Cloud restore points unavailable:",error); return deviceEntries; }):Promise.resolve(deviceEntries);
    load.then(function(entries){
      if(!el||!el.isConnected) return;
      if(!entries.length){ el.innerHTML='<p class="hint">No backups yet. Create one now, then automatic backups will appear here over time.</p>'; return; }
      el.innerHTML="";
      entries.forEach(function(entry){
        var row=document.createElement("div"); row.className="backup-entry";
        row.innerHTML='<div class="bi"><b></b><small></small></div><button class="b2">Restore</button>';
        row.querySelector("b").textContent=entry.kind==="manual"?"Manual backup":entry.kind==="recovery"?"Recovery point":"Automatic backup";
        row.querySelector("small").textContent=backupDate(entry.created)+" · "+(entry.itemCount||((entry.data.items||[]).length))+" items";
        row.querySelector("button").onclick=function(){ restoreBackup(entry); };
        el.appendChild(row);
      });
    }).catch(function(e){ console.warn(e); if(el&&el.isConnected) el.innerHTML='<p class="hint">Cloud backups could not be loaded. Check that the updated Firestore rules have been deployed.</p>'; });
  }
  function setupBackupSettings(){
    $("backupNowBtn").onclick=function(){
      var button=this, savedOnDevice=captureAutoBackup(true,"manual");
      if(!savedOnDevice) doExport("Backup downloaded as a recovery copy");
      renderBackupList();
      if(!currentUser||!db){ if(savedOnDevice) showToast("Backup saved on this device"); return; }
      button.disabled=true;
      writeCloudBackup("manual").then(function(){ showToast(savedOnDevice?"Backup saved on this device and to cloud":"Cloud backup created"); renderBackupList(); }).catch(function(e){
        console.warn("Cloud backup unavailable:",e);
        showToast(savedOnDevice?"Backup saved on this device; cloud copy is unavailable":"Cloud copy unavailable — recovery file downloaded",!savedOnDevice);
      }).then(function(){ button.disabled=false; });
    };
    $("expBtn").onclick=doExport;
    $("impBtn").onclick=function(){ $("impFile").click(); };
    $("impFile").onchange=function(e){ var f=e.target.files[0]; if(f) doImport(f); e.target.value=""; };
    renderBackupList();
  }
  function buildThemeGrid(){
    var grid=$("themeGrid"); if(!grid) return;
    grid.innerHTML="";
    THEMES.forEach(function(t){
      var b=document.createElement("button"); b.className="th"+(t.id===state.theme?" on":"");
      b.setAttribute("aria-label","Use "+t.name+" theme");
      b.setAttribute("aria-pressed",t.id===state.theme?"true":"false");
      b.style.setProperty("--preview","radial-gradient(circle at 12% 10%,"+hsl(t.glows[0])+" 0,transparent 54%),radial-gradient(circle at 92% 88%,"+hsl(t.glows[1])+" 0,transparent 58%),radial-gradient(circle at 60% 55%,"+hsl(t.glows[2])+" 0,transparent 50%)");
      b.innerHTML='<span class="prev"></span><span class="nm">'+t.name+'</span><span class="check">✓</span>';
      b.onclick=function(){ state.theme=t.id; applyTheme(0); syncMotion(); buildThemeGrid(); persist(); };
      grid.appendChild(b);
    });
  }
  function renderAcct(){
    var el=$("acctInner"); if(!el) return;
    var cfg=getCfg();
    if(currentUser){
      el.innerHTML='<div class="acctbox">'+(currentUser.photoURL?'<img src="'+currentUser.photoURL+'" alt="">':'')+'<div class="ai"><b></b><small>Notes sync automatically</small></div></div><div class="btnrow"><button class="b2" id="soBtn">Sign out &amp; wipe this device</button></div>';
      el.querySelector(".ai b").textContent=currentUser.displayName||currentUser.email||"Signed in";
      renderCloudStorageDetails(el);
      $("soBtn").onclick=function(){
        cloudSyncPaused=true; clearTimeout(cloudTimer);
        auth.signOut().then(function(){ showToast("Signed out and removed local notes"); setTimeout(renderAcct,300); }).catch(function(error){ cloudSyncPaused=false; console.warn(error); showToast("Couldn’t sign out. Your local notes were kept.",true); });
      };
      return;
    }
    if(cfg&&fbReady){
      el.innerHTML='<p class="hint">Sync is set up. Sign in to save your notes to your Google account and use them on any device.</p>'+
        '<button class="gsign" id="giBtn"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.9 35.6 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>Sign in with Google</button>';
      $("giBtn").onclick=signIn;
      return;
    }
    el.innerHTML='<p class="hint"><b>Sync is not configured.</b><br>Put this project’s Firebase web settings in <b>astral.config.js</b>, then reopen the app. People using the finished app will only see the sign-in button.</p>';
  }
  function cloudFileStatus(file){
    if(file.kind==="current") return file.inBackup?"Current attachment and backup file":"Current attachment";
    if(file.kind==="backup") return "Backup-only file";
    return "Unlinked cloud file";
  }
  function removeCloudFileReferences(path){
    var changed=false;
    forEachContentDocument(function(note){
      var removed=(note.attachments||[]).filter(function(attachment){ return attachment.storagePath===path; });
      if(!removed.length) return;
      var removedIds={}; removed.forEach(function(attachment){ removedIds[attachment.id]=true; removeAttachmentFile(note.id,attachment.id); });
      note.attachments=note.attachments.filter(function(attachment){ return !removedIds[attachment.id]; });
      note.blocks=(note.blocks||[]).filter(function(block){ return !(block.type==="attachment"&&removedIds[block.attachmentId]); });
      if(!note.blocks.some(function(block){ return block.type==="text"; })) note.blocks.unshift(textBlock(""));
      syncNoteBody(note); touchContent(note); changed=true;
    });
    return changed;
  }
  function deleteCloudStorageFile(file){
    if(!currentUser||!storage||!file||!file.path||file.deleting) return;
    var impact=file.kind==="current"?" It is attached to a current note, so its attachment block will also be removed. Any backup that references it will no longer be able to restore that file.":file.kind==="backup"?" It is only retained by a cloud backup, so that backup will no longer be able to restore the file.":" It is not referenced by your current notes or cloud backups.";
    if(!confirm("Permanently delete "+file.name+" ("+fileSize(file.size)+") from cloud storage?"+impact)) return;
    file.deleting=true; renderAcct();
    storage.ref(file.path).delete().then(function(){
      if(file.kind==="current"&&removeCloudFileReferences(file.path)){ persist(); renderAll(); }
      showToast("Cloud file deleted"); scheduleAccountUsageRefresh(0);
    }).catch(function(error){
      file.deleting=false; console.warn("Cloud file could not be deleted:",error); renderAcct(); showToast("Couldn’t delete that cloud file",true);
    });
  }
  function renderCloudStorageDetails(container){
    var section=document.createElement("section"); section.className="cloud-storage-details";
    var heading=document.createElement("h4"); heading.textContent="Cloud files"; section.appendChild(heading);
    var intro=document.createElement("p");
    if(accountUsage.status!=="ready"){
      intro.textContent=accountUsage.status==="error"?"Cloud file details are unavailable right now.":"Reading saved cloud files…";
      section.appendChild(intro); container.appendChild(section); return;
    }
    var files=accountUsage.files||[];
    intro.textContent=files.length?"Every file stored for this account is listed below. Unlinked files still use storage; delete only files you no longer need.":"No files are stored in this account’s Cloud Storage folder.";
    section.appendChild(intro);
    if(files.length){
      var list=document.createElement("div"); list.className="cloud-storage-file-list";
      files.forEach(function(file){
        var row=document.createElement("div"); row.className="cloud-storage-file"+(file.kind==="unlinked"?" unlinked":""); row.title=file.path;
        var name=document.createElement("b"); name.textContent=file.name; row.appendChild(name);
        var size=document.createElement("em"); size.textContent=fileSize(file.size); row.appendChild(size);
        var detail=document.createElement("small"); detail.textContent=cloudFileStatus(file)+" · "+file.path; row.appendChild(detail);
        var remove=document.createElement("button"); remove.type="button"; remove.className="b2"; remove.textContent=file.deleting?"Deleting…":"Delete permanently"; remove.disabled=!!file.deleting; remove.onclick=function(){ deleteCloudStorageFile(file); }; row.appendChild(remove);
        list.appendChild(row);
      });
      section.appendChild(list);
    }
    container.appendChild(section);
  }
  $("settingsBtn").onclick=function(){ openSettings(); };
  $("settingsModal").onclick=function(e){ if(e.target===$("settingsModal")) $("settingsModal").classList.remove("open"); };

  /* =================== boot =================== */
  captureAutoBackup(false); applyTheme(0); syncMotion(); renderAll(); renderFoot(); initFirebase();
  window.__astral={ state:state, render:renderAll };
})();
</script>
