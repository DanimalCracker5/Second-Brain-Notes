<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Second Brain</title>

<!-- Firebase project settings live beside this file. -->
<script src="./astral.config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --c1:hsl(265,80%,52%); --c2:hsl(300,78%,50%); --c3:hsl(230,80%,50%);
    --o1:.15; --o2:.12; --o3:.07;
    --accent:hsl(265,82%,74%); --accent-soft:hsla(265,82%,60%,.16); --accent-line:hsla(265,82%,70%,.32);
    --ink:#f4f4f7; --ink-dim:#8b8b98; --ink-faint:#565663;
    --line:rgba(255,255,255,0.07); --line-soft:rgba(255,255,255,0.045);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{ background:#000; color:var(--ink); font-family:"DM Sans",system-ui,-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; }

  /* ---------- AMOLED aurora ---------- */
  .ambient{ position:fixed; inset:0; z-index:0; background:#000; overflow:hidden; }
  .glow{ position:absolute; border-radius:50%; filter:blur(130px); mix-blend-mode:screen; will-change:transform;
    transition:background-color 1.1s linear, opacity 1s linear;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .g1{ width:74vw; height:54vh; top:-34vh; left:-26vw; background:var(--c1); opacity:var(--o1); animation-name:float1; animation-duration:34s; }
  .g2{ width:80vw; height:58vh; bottom:-36vh; right:-28vw; background:var(--c2); opacity:var(--o2); animation-name:float2; animation-duration:46s; }
  .g3{ width:54vw; height:40vh; top:52vh; left:38vw; background:var(--c3); opacity:var(--o3); animation-name:float3; animation-duration:40s; }
  .ambient::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(88% 74% at 50% 38%, rgba(0,0,0,var(--darkness,.86)), rgba(0,0,0,0) 80%); }
  .ambient.still .glow{ animation-play-state:paused; }
  @keyframes float1{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(12vw,9vh) scale(1.1)} }
  @keyframes float2{ 0%,100%{transform:translate(0,0) scale(1.05)} 50%{transform:translate(-13vw,-8vh) scale(.92)} }
  @keyframes float3{ 0%,100%{transform:translate(-50%,0) scale(1)} 50%{transform:translate(-38%,-9vh) scale(1.14)} }
  @media (prefers-reduced-motion: reduce){ .glow{ animation-duration:240s !important; } }

  .app{ position:relative; z-index:1; height:100dvh; display:grid; grid-template-columns:300px 1fr; transition:grid-template-columns .24s ease; }
  .app.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .app.sidebar-collapsed .drawer{ min-width:0; overflow:hidden; opacity:0; pointer-events:none; }
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; }

  /* ---------- top bar ---------- */
  .bar{ display:flex; align-items:center; gap:6px; padding:calc(var(--safe-t) + 12px) 18px 12px; flex:none; }
  .icon{ width:40px; height:40px; flex:none; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); cursor:pointer; border-radius:12px; transition:.15s; }
  #settingsBtn{ display:none; }
  .icon:hover{ color:var(--ink); background:rgba(255,255,255,.05); } .icon svg{ width:20px; height:20px; }
  .icon.hide-wide{ display:grid; }
  .spacer{ flex:1; }
  .copy-all{ display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:.9rem; color:#08080a; background:var(--accent); cursor:pointer; border:none; border-radius:999px; padding:9px 16px; transition:transform .06s, filter .15s; }
  .copy-all:hover{ filter:brightness(1.08); } .copy-all:active{ transform:scale(.97); } .copy-all svg{ width:16px; height:16px; }
  .copy-all.done{ background:#34d399; color:#04120c; }
  .save-state{ margin-right:8px; font-family:"DM Mono",monospace; font-size:.68rem; color:var(--ink-faint); white-space:nowrap; transition:color .16s; }
  .save-state.saving{ color:var(--accent); }
  .save-state.cloud{ color:#6ee7b7; }
  .save-state.bad{ color:#f87171; }

  /* ---------- canvas ---------- */
  .canvas{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; padding:0 26px calc(120px + var(--safe-b)); }
  .canvas::-webkit-scrollbar{ width:9px; } .canvas::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:9px; }
  .sheet{ max-width:760px; margin:0 auto; padding-top:8px; }
  .title{ width:100%; background:none; border:none; outline:none; resize:none; overflow:hidden; display:block; color:var(--ink); font-family:inherit; font-weight:700; letter-spacing:-.02em; font-size:clamp(2rem,6vw,3rem); line-height:1.06; padding:6px 0 0; }
  .title::placeholder{ color:var(--ink-faint); }
  .todo-title-row{ display:flex; align-items:flex-start; gap:12px; }
  .todo-title-row .title{ flex:1; min-width:0; }
  .todo-item-check{ width:40px; height:40px; margin-top:8px; flex:none; display:grid; place-items:center; border:1px solid var(--accent-line); border-radius:12px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font-size:1.1rem; font-weight:800; transition:.15s; }
  .todo-item-check:hover{ filter:brightness(1.15); transform:scale(1.04); }
  .todo-item-check.done{ color:#07110c; background:#6ee7b7; border-color:#6ee7b7; }
  .todo-item-delete{ flex:none; margin-top:8px; border:1px solid rgba(248,113,113,.3); border-radius:10px; padding:10px 12px; color:#f87171; background:rgba(248,113,113,.09); cursor:pointer; font:600 .78rem "DM Sans",sans-serif; }
  .todo-item-delete:hover{ background:rgba(248,113,113,.18); }
  .todo-title-row.done .title{ color:var(--ink-dim); text-decoration:line-through; }

  .assign{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:14px 0 12px; }
  .pickbtn{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; transition:.14s; }
  .pickbtn:hover{ color:var(--ink); background:rgba(255,255,255,.08); }
  .pickbtn svg{ width:13px; height:13px; }
  .chip{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); padding:5px 9px 5px 8px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .chip .cx{ cursor:pointer; opacity:.55; font-size:.92rem; line-height:1; color:var(--ink-faint); } .chip .cx:hover{ opacity:1; color:#f87171; }

  .meta{ font-family:"DM Mono",monospace; font-size:.72rem; color:var(--ink-faint); margin:0 0 26px; }
  .meta b{ color:var(--ink-dim); font-weight:500; }

  .note-body{ width:100%; background:none; border:none; outline:none; resize:none; display:block; color:var(--ink); font-size:1.08rem; line-height:1.72; padding:2px 0; min-height:46vh; overflow:hidden; }
  .note-body::placeholder{ color:var(--ink-faint); }

  .ch{ padding:4px 0 22px; border-bottom:1px solid var(--line-soft); margin-bottom:22px; }
  .ch:last-of-type{ border-bottom:none; }
  .ch-top{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .ch-idx{ font-family:"DM Mono",monospace; font-size:.72rem; color:var(--accent); opacity:.7; flex:none; }
  .ch-name{ flex:1; min-width:0; background:none; border:none; outline:none; color:var(--ink); font-weight:600; font-size:1.02rem; letter-spacing:-.01em; padding:2px 0; }
  .ch-name::placeholder{ color:var(--ink-faint); }
  .ch-copy{ flex:none; font-weight:600; font-size:.8rem; color:var(--accent); background:var(--accent-soft); cursor:pointer; border:1px solid var(--accent-line); border-radius:8px; padding:6px 13px; transition:.15s; }
  .ch-copy:hover{ filter:brightness(1.15); } .ch-copy:active{ transform:scale(.95); }
  .ch-copy.done{ color:#6ee7b7; border-color:rgba(110,231,183,.4); background:rgba(52,211,153,.16); }
  .ch-body{ width:100%; background:none; border:none; outline:none; resize:none; display:block; color:var(--ink); font-size:1.06rem; line-height:1.7; padding:4px 0 0; min-height:56px; overflow:hidden; }
  .ch-body::placeholder{ color:var(--ink-faint); }
  .ch.cue{ padding:10px 0 16px; text-align:center; }
  .ch.cue .ch-top{ justify-content:center; margin-bottom:0; }
  .ch.cue .ch-idx{ color:var(--ink-faint); letter-spacing:.16em; font-size:.6rem; }
  .cue-body{ min-height:38px; color:var(--ink-dim); text-align:center; font-style:italic; font-size:.94rem; line-height:1.55; }
  .cue-body::placeholder{ color:var(--ink-faint); }
  .ch-foot{ display:flex; align-items:center; gap:2px; margin-top:8px; opacity:.3; transition:opacity .18s; }
  .ch:focus-within .ch-foot{ opacity:.9; }
  .ch-foot .g{ width:30px; height:30px; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); cursor:pointer; border-radius:8px; }
  .ch-foot .g:hover{ color:var(--ink); background:rgba(255,255,255,.06); } .ch-foot .g:disabled{ opacity:.3; cursor:default; }
  .ch-foot .g.del:hover{ color:#f87171; background:rgba(248,113,113,.12); } .ch-foot .g svg{ width:16px; height:16px; }
  .ch-foot .cc{ margin-left:auto; font-family:"DM Mono",monospace; font-size:.68rem; color:var(--ink-faint); }
  .add{ width:100%; margin-top:6px; padding:14px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:500; font-size:.9rem; color:var(--ink-dim); background:none; border:1px solid var(--line); border-radius:14px; cursor:pointer; transition:.15s; }
  .add:hover{ color:var(--ink); border-color:var(--accent-line); background:var(--accent-soft); }
  .todo-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .todo-row{ display:grid; grid-template-columns:25px minmax(0,1fr); gap:8px 10px; min-height:48px; padding:10px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); }
  .todo-check{ width:25px; height:25px; flex:none; border:1px solid var(--accent-line); border-radius:8px; background:var(--accent-soft); color:var(--accent); cursor:pointer; font-weight:800; }
  .todo-text{ min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font:500 .98rem "DM Sans",sans-serif; }
  .todo-text::placeholder{ color:var(--ink-faint); }
  .todo-row.done .todo-text{ color:var(--ink-faint); text-decoration:line-through; }
  .todo-row.done .todo-check{ color:#07110c; background:#6ee7b7; border-color:#6ee7b7; }
  .todo-details{ grid-column:2; display:grid; gap:8px; padding-top:1px; }
  .todo-description{ width:100%; min-height:28px; resize:none; border:0; outline:0; background:transparent; color:var(--ink-dim); font:400 .84rem/1.45 "DM Sans",sans-serif; }
  .todo-description::placeholder{ color:var(--ink-faint); }
  .subtasks{ display:grid; gap:5px; }
  .subtask-row{ display:flex; align-items:center; gap:7px; color:var(--ink-dim); }
  .subtask-row input[type="checkbox"]{ accent-color:var(--accent); margin:0; }
  .subtask-row input[type="text"]{ flex:1; min-width:0; border:0; outline:0; color:var(--ink-dim); background:transparent; font:400 .8rem "DM Sans",sans-serif; }
  .subtask-row.done input[type="text"]{ text-decoration:line-through; color:var(--ink-faint); }
  .todo-actions{ grid-column:2; display:flex; align-items:center; gap:8px; }
  .todo-link{ border:0; padding:2px 0; color:var(--accent); background:transparent; cursor:pointer; font:500 .74rem "DM Sans",sans-serif; }
  .todo-delete{ margin-left:auto; display:none; border:1px solid rgba(248,113,113,.25); border-radius:8px; padding:6px 9px; color:#f87171; background:rgba(248,113,113,.08); cursor:pointer; font-size:.72rem; font-weight:600; }
  .todo-row.done .todo-delete{ display:block; }
  .todo-summary{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:2px 0 18px; color:var(--ink-faint); font:500 .72rem "DM Mono",monospace; }

  /* ---------- drawer ---------- */
  .drawer{ background:#000; border-right:1px solid var(--line); display:flex; flex-direction:column; padding-top:var(--safe-t); padding-bottom:var(--safe-b); min-height:0; }
  .scrim{ position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .26s; }
  .d-head{ padding:20px 18px 8px; } .d-head h2{ font-weight:700; font-size:1.2rem; letter-spacing:-.01em; margin:0; } .d-head h2 span{ color:var(--accent); }
  .d-head small{ display:block; margin-top:3px; font-family:"DM Mono",monospace; font-size:.49rem; letter-spacing:.06em; color:var(--ink-faint); }
  .d-new{ margin:6px 14px; padding:11px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:600; font-size:.88rem; color:#08080a; background:var(--accent); border:none; border-radius:12px; }
  .d-scroll{ flex:1; overflow-y:auto; min-height:0; }
  .d-scroll::-webkit-scrollbar{ width:8px; } .d-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:8px; }

  .sec-h{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 6px; }
  .sec-h span{ font-family:"DM Mono",monospace; font-size:.58rem; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-faint); }
  .sec-h button{ width:22px; height:22px; display:grid; place-items:center; border:none; background:none; color:var(--ink-faint); cursor:pointer; border-radius:6px; font-size:1rem; }
  .sec-h button:hover{ color:var(--ink); background:rgba(255,255,255,.06); }
  .list-tools{ display:flex; align-items:center; gap:4px; }
  .list-tools button{ width:auto; min-width:22px; padding:0 5px; font-size:.72rem; }

  .folder-row{ display:flex; align-items:center; gap:9px; padding:8px 12px; margin:1px 10px; border-radius:9px; cursor:pointer; font-size:.88rem; color:var(--ink); }
  .folder-row:hover{ background:rgba(255,255,255,.05); } .folder-row.active{ background:var(--accent-soft); }
  .folder-row svg{ width:15px; height:15px; color:var(--ink-dim); flex:none; }
  .folder-row .fn{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-row .fx{ opacity:0; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:.9rem; padding:0 4px; }
  .folder-row:hover .fx{ opacity:1; } .folder-row .fx:hover{ color:#f87171; }

  .tagcloud{ display:flex; flex-wrap:wrap; gap:5px; padding:2px 16px 8px; }
  .tg{ display:inline-flex; align-items:center; gap:6px; font-weight:500; font-size:.78rem; padding:5px 10px 5px 8px; border-radius:8px; color:var(--ink-dim); background:rgba(255,255,255,.035); border:1px solid transparent; cursor:pointer; transition:.13s; }
  .tg:hover{ background:rgba(255,255,255,.075); color:var(--ink); }
  .tg.active{ background:var(--accent-soft); color:var(--ink); border-color:var(--accent-line); }
  .tg .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .tg .tx{ opacity:0; margin-left:1px; font-size:.9rem; line-height:1; color:var(--ink-faint); }
  .tg:hover .tx{ opacity:.75; } .tg .tx:hover{ opacity:1; color:#f87171; }
  .tag-empty{ padding:0 18px 8px; font-size:.76rem; color:var(--ink-faint); }

  .d-list{ padding:4px 10px 8px; }
  .d-item{ display:grid; grid-template-columns:15px minmax(0,1fr) auto; align-items:center; gap:9px; padding:10px 12px; border-radius:11px; cursor:pointer; transition:background .13s; }
  .d-item:hover{ background:rgba(255,255,255,.05); } .d-item.active{ background:var(--accent-soft); }
  .d-item > svg{ width:15px; height:15px; color:var(--ink-dim); flex:none; }
  .side-todo-check{ width:15px; height:15px; padding:0; display:grid; place-items:center; border:1px solid var(--accent-line); border-radius:4px; color:#07110c; background:var(--accent-soft); cursor:pointer; font-size:.62rem; font-weight:800; }
  .side-todo-check.done{ background:#6ee7b7; border-color:#6ee7b7; }
  .d-item.todo-done .dt-title{ color:var(--ink-faint); text-decoration:line-through; }
  .d-item .dt{ min-width:0; } .d-item .dt-title{ font-weight:500; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .d-item .dt-meta{ display:flex; align-items:center; gap:5px; margin-top:3px; }
  .d-item .dt-meta .m{ font-family:"DM Mono",monospace; font-size:.62rem; color:var(--ink-faint); }
  .d-item .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .d-item .dx{ opacity:0; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:1rem; padding:2px 6px; border-radius:6px; }
  .d-item:hover .dx{ opacity:1; } .d-item .dx:hover{ color:#f87171; }
  .d-item.todo-done .dx{ opacity:1; color:#f87171; font-size:.7rem; font-weight:600; }
  .d-tasks{ grid-column:2 / 4; display:grid; gap:4px; padding-top:2px; }
  .side-task{ display:flex; align-items:center; gap:7px; width:100%; padding:3px 0; }
  .side-task-check{ width:14px; height:14px; padding:0; display:grid; place-items:center; flex:none; border:1px solid var(--accent-line); border-radius:4px; color:#07110c; background:var(--accent-soft); cursor:pointer; font-size:.62rem; font-weight:800; }
  .side-task-open{ flex:1; min-width:0; padding:0; border:0; color:var(--ink-dim); background:transparent; text-align:left; cursor:pointer; font:400 .72rem "DM Sans",sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-task.done .side-task-open{ color:var(--ink-faint); text-decoration:line-through; } .side-task.done .side-task-check{ background:#6ee7b7; border-color:#6ee7b7; }

  .d-foot{ display:flex; align-items:center; gap:8px; padding:11px 14px; border-top:1px solid var(--line); }
  .d-foot .sbtn{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:9px; font-size:.8rem; font-weight:500; color:var(--ink-dim); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .d-foot .sbtn:hover{ color:var(--ink); background:rgba(255,255,255,.08); }
  .d-foot .sbtn svg{ width:15px; height:15px; }
  .d-foot .who{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .d-foot .who img{ width:26px; height:26px; border-radius:50%; flex:none; }
  .d-foot .who b{ font-size:.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- floating menu ---------- */
  .menu{ position:fixed; z-index:70; background:#0b0b0f; border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 18px 55px rgba(0,0,0,.7); min-width:200px; max-width:270px; }
  .menu .mtitle{ font-family:"DM Mono",monospace; font-size:.56rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); padding:6px 10px 4px; }
  .menu button.mi{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 11px; background:none; border:none; color:var(--ink); font-size:.86rem; border-radius:8px; cursor:pointer; }
  .menu button.mi:hover{ background:rgba(255,255,255,.06); } .menu button.mi svg{ width:16px; height:16px; color:var(--ink-dim); flex:none; }
  .menu button.mi .chk{ margin-left:auto; color:var(--accent); opacity:0; } .menu button.mi.on .chk{ opacity:1; }
  .menu .sep{ height:1px; background:var(--line); margin:5px 4px; }
  .menu .mrow{ padding:6px; } .menu .mrow input{ width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:9px 10px; font-family:inherit; font-size:.85rem; outline:none; }
  .menu .mrow input:focus{ border-color:var(--accent-line); }
  .menu .maxscroll{ max-height:230px; overflow-y:auto; }

  /* ---------- toast ---------- */
  .toast{ position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%,16px); z-index:120; padding:10px 18px; border-radius:12px; background:#141418; border:1px solid var(--line); font-size:.82rem; color:var(--ink); opacity:0; pointer-events:none; transition:.2s; max-width:88vw; }
  .toast.show{ opacity:1; transform:translate(-50%,0); } .toast .tk{ color:#6ee7b7; } .toast.bad .tk{ color:#f87171; }

  /* ---------- optional sign-in reminder ---------- */

  function doImport(file){

        inc.forEach(function(s){ s.id=uid(); if(!s.type) s.type=s.sections?"script":"note"; s.tagIds=[]; s.folderId=null; if(s.type==="script"&&!Array.isArray(s.sections)) s.sections=[sec("",s.body||"")]; if(s.type==="todo"&&!Array.isArray(s.todos)) s.todos=[]; });
        state.items=inc.concat(state.items);
        if(d.folders) state.folders=state.folders.concat(d.folders.map(function(f){ return {id:uid(),name:f.name}; }));
        if(d.tags) state.tags=state.tags.concat(d.tags.map(function(t){ return {id:uid(),name:t.name,hue:t.hue||265}; }));
        state.currentId=inc[0].id; persist(); renderAll(); showToast("Imported "+inc.length+" item"+(inc.length===1?"":"s"));

  function parseCfg(text){
    if(!text) return null;
    /* scan every {...} block in the paste and return the first one that
       actually looks like a Firebase config, so extra import/init lines
       pasted alongside it don't matter */
    for(var i=0;i<text.length;i++){
      if(text.charAt(i)!=="{") continue;
      var depth=0, end=-1;
      for(var j=i;j<text.length;j++){
        var c=text.charAt(j);
        if(c==="{") depth++;
        else if(c==="}"){ depth--; if(depth===0){ end=j; break; } }
      }
      if(end<0) continue;
      var candidate=text.slice(i,end+1), obj=null;
      try{ obj=(new Function("return ("+candidate+")"))(); }catch(e){ continue; }
      if(obj && typeof obj==="object" && obj.apiKey && obj.projectId) return obj;
    }
    return null;
  }

  function authErrorMessage(e){
    var code=e&&e.code||"";
    if(location.protocol==="file:") return "Open the app with Start Second Brain.cmd so Google sign-in has a valid web address";
    if(code==="auth/unauthorized-domain") return "This address is not in Firebase Authentication → Authorized domains";
    if(code==="auth/operation-not-allowed"||code==="auth/configuration-not-found") return "Google sign-in is disabled. In Firebase Console → Authentication → Sign-in method, enable Google";
    if(code==="auth/operation-not-supported-in-this-environment") return "Google sign-in needs http://localhost — use the included launcher";
    if(code==="auth/popup-blocked") return "Your browser blocked the Google sign-in window";
    if(code==="auth/network-request-failed") return "Could not reach Google. Check your connection and try again";
    if(code==="auth/popup-closed-by-user") return "Sign-in canceled";
    return "Sign-in failed"+(code?" ("+code.replace(/^auth\//,"")+")":"");
  }

  function unionBy(a,b,keyfn){ var seen={}; a.forEach(function(x){ seen[keyfn(x)]=1; }); return a.concat((b||[]).filter(function(x){ return !seen[keyfn(x)]; })); }
  function syncMarker(){ return currentUser?"second-brain-cloud-linked-"+currentUser.uid:""; }

  function markCloudLinked(){ try{ if(syncMarker()) localStorage.setItem(syncMarker(),"1"); }catch(e){} }
  function mergeWithCloud(cloud){
    var seen={}, byId={}; state.items.forEach(function(s,index){ seen[sig(s)]=1; byId[s.id]=index; });
    var add=[];
    (cloud.items||[]).forEach(function(s){
      if(Object.prototype.hasOwnProperty.call(byId,s.id)){
        var local=state.items[byId[s.id]];
        if((s.updated||0)>(local.updated||0)) state.items[byId[s.id]]=JSON.parse(JSON.stringify(s));
      } else if(!seen[sig(s)]){ var copy=JSON.parse(JSON.stringify(s)); copy.id=copy.id||uid(); add.push(copy); seen[sig(copy)]=1; }
    });
    state.items=state.items.concat(add);
    state.folders=unionBy(state.folders,cloud.folders,function(f){ return f.name; });
    state.tags=unionBy(state.tags,cloud.tags,function(t){ return t.name; });
    applyAccountPreferences(cloud);
    return add.length;
  }

        var added=mergeWithCloud(cloud); markCloudLinked(); persist(); renderAll(); saveCloudNow(); showToast(added?"Safely merged your existing notes":"Connected to your cloud notes");

      } else if(cloudHas){ useData(cloud); markCloudLinked(); setSaveState("Saved to cloud","cloud"); showToast("Synced from your account"); }

  function writeCloudBackup(kind){

  function getCloudBackups(){
    if(!currentUser||!db) return Promise.resolve([]);
    var user=db.collection("users").doc(currentUser.uid);
    return Promise.all([user.collection("backups").orderBy("created","desc").limit(28).get(),user.get()]).then(function(results){
      var entries=results[0].docs.map(function(doc){ var v=doc.data(); return {id:doc.id,kind:v.kind||"automatic",created:v.created||0,itemCount:v.itemCount,data:v.data||v}; });
      var legacy=results[1].exists?(results[1].data().backupSlots||{}):{};

      var url="https://api.elevenlabs.io/v2/voices?voice_type=saved&page_size=100&include_total_count=false"+(token?"&next_page_token="+encodeURIComponent(token):"");
      return fetch(url,{headers:{"xi-api-key":apiKey}}).then(function(response){
        if(!response.ok) return response.text().then(function(message){ throw new Error(message||"ElevenLabs could not load voices"); });
        return response.json();
      }).then(function(data){
        voices=voices.concat(Array.isArray(data.voices)?data.voices:[]);
        return data.has_more&&data.next_page_token?loadPage(data.next_page_token):voices;
      });
    }
    return loadPage("");
  }
  function findElevenLabsVoice(apiKey,voiceId){
    var url="https://api.elevenlabs.io/v2/voices?voice_ids="+encodeURIComponent(voiceId)+"&page_size=1&include_total_count=false";
    return fetch(url,{headers:{"xi-api-key":apiKey}}).then(function(response){
      if(!response.ok) return response.text().then(function(message){ throw new Error(message||"ElevenLabs could not check that voice"); });
      return response.json();
    }).then(function(data){ return Array.isArray(data.voices)&&data.voices.length?data.voices[0]:null; });
  }
  function saveVoiceSettings(selectedVoiceId,savedVoices){
    return savePrivateSettings({voiceSettings:{version:1,selectedVoiceId:selectedVoiceId,savedVoices:cleanSavedVoices(savedVoices),updated:Date.now()}});
  }
  function setupVoiceSettings(){
    var select=$("elevenlabsVoiceSelect"), custom=$("customVoiceEntry"), input=$("customElevenlabsVoiceId"), save=$("saveCustomVoiceBtn"), status=$("voiceStatus"), userId=currentUser&&currentUser.uid, fetched=[];
    function showCustom(show){ custom.hidden=!show; }
    function selectVoice(id,saved){
      status.textContent="Saving your voice choice…";
      saveVoiceSettings(id,saved).then(function(){
        runtimeApiKeys.elevenlabsVoice=id;
        runtimeApiKeys.savedVoices=cleanSavedVoices(saved);
        updateTtsButton(current());
        if(status.isConnected) status.textContent="Voice selected and synced to your signed-in devices.";
      }).catch(function(error){ console.warn(error); if(status.isConnected) status.textContent="Could not save your voice choice. Check your cloud connection."; });
    }
    if(!userId||!db){ status.textContent="Sign in and add an ElevenLabs API key to choose a voice."; return; }
    getPrivateSettings().then(function(settings){
      if(!select.isConnected||!currentUser||currentUser.uid!==userId) return;
      applyApiSettings(settings);
      var selectedId=runtimeApiKeys.elevenlabsVoice;
      if(!runtimeApiKeys.elevenlabs){
        renderVoiceOptions(select,[],selectedId);
        select.disabled=false;
        showCustom(select.value===CUSTOM_VOICE_OPTION);
        status.textContent="Add an ElevenLabs API key in API keys to load your saved voices.";
        return;
      }
      status.textContent="Loading your saved ElevenLabs voices…";
      getElevenLabsSavedVoices(runtimeApiKeys.elevenlabs).then(function(voices){
        if(!select.isConnected) return;
        fetched=voices;
        renderVoiceOptions(select,fetched,selectedId);
        select.disabled=false;
        showCustom(select.value===CUSTOM_VOICE_OPTION);
        status.textContent=voices.length?"Loaded "+voices.length+" saved ElevenLabs voice"+(voices.length===1?".":"s."):"No saved ElevenLabs voices were found yet.";
      }).catch(function(error){
        console.warn("ElevenLabs voice list failed:",error);
        renderVoiceOptions(select,[],selectedId);
        select.disabled=false;
        showCustom(select.value===CUSTOM_VOICE_OPTION);
        status.textContent="Could not load saved voices. Check your ElevenLabs API key.";
      });
    }).catch(function(error){ console.warn(error); status.textContent="Could not load voice settings. Check your cloud connection."; });
    select.onchange=function(){
      var id=select.value;
      showCustom(id===CUSTOM_VOICE_OPTION);
      if(id===CUSTOM_VOICE_OPTION) return;
      selectVoice(id,runtimeApiKeys.savedVoices);
    };
    save.onclick=function(){
      var id=cleanText(input.value);
      if(!id){ status.textContent="Paste an ElevenLabs Voice ID first."; input.focus(); return; }
      if(!runtimeApiKeys.elevenlabs){ status.textContent="Add an ElevenLabs API key before saving a voice ID."; return; }
      save.disabled=true;
      status.textContent="Checking that voice ID…";
      findElevenLabsVoice(runtimeApiKeys.elevenlabs,id).then(function(voice){
        if(!voice) throw new Error("Voice not found");
        var saved=cleanSavedVoices(runtimeApiKeys.savedVoices.concat([{id:id,name:cleanText(voice.name)||id}]));
        return saveVoiceSettings(id,saved).then(function(){ return {saved:saved,voice:voice}; });
      }).then(function(result){
        runtimeApiKeys.elevenlabsVoice=id;
        runtimeApiKeys.savedVoices=result.saved;
        updateTtsButton(current());
        renderVoiceOptions(select,fetched,id);
        showCustom(false);
        status.textContent="Saved "+(cleanText(result.voice.name)||"voice")+" to your list and selected it.";
      }).catch(function(error){ console.warn("ElevenLabs voice ID failed:",error); status.textContent="That voice ID is not available to this ElevenLabs API key."; }).then(function(){ save.disabled=false; });
    };
  }
  function backupDate(value){ try{ return new Date(value).toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return "Unknown date"; } }
  function renderBackupList(){
    var el=$("backupList"); if(!el) return;
    el.innerHTML='<p class="hint">Loading restore points…</p>';
    var load=currentUser&&db?getCloudBackups():Promise.resolve(autoBackups().map(function(entry,index){ return {id:"device-"+index,kind:"automatic",created:entry.created,itemCount:(entry.data.items||[]).length,data:entry.data}; }));
    load.then(function(entries){
      if(!el||!el.isConnected) return;
      if(!entries.length){ el.innerHTML='<p class="hint">No backups yet. Create one now, then automatic backups will appear here over time.</p>'; return; }
      el.innerHTML="";
      entries.forEach(function(entry){
        var row=document.createElement("div"); row.className="backup-entry";
        row.innerHTML='<div class="bi"><b></b><small></small></div><button class="b2">Restore</button>';
        row.querySelector("b").textContent=entry.kind==="manual"?"Manual backup":"Automatic backup";
        row.querySelector("small").textContent=backupDate(entry.created)+" · "+(entry.itemCount||((entry.data.items||[]).length))+" items";
        row.querySelector("button").onclick=function(){ restoreBackup(entry); };
        el.appendChild(row);
      });
    }).catch(function(e){ console.warn(e); if(el&&el.isConnected) el.innerHTML='<p class="hint">Cloud backups could not be loaded. Check that the updated Firestore rules have been deployed.</p>'; });
  }
  function setupBackupSettings(){
    $("backupNowBtn").onclick=function(){
      captureAutoBackup(true);
      if(!currentUser||!db){ showToast("Sign in to create a cloud backup",true); renderBackupList(); return; }
      writeCloudBackup("manual").then(function(){ showToast("Cloud backup created"); renderBackupList(); }).catch(function(e){ console.warn(e); showToast("Cloud backup failed",true); });
    };
    $("expBtn").onclick=doExport;
    $("impBtn").onclick=function(){ $("impFile").click(); };
    $("impFile").onchange=function(e){ var f=e.target.files[0]; if(f) doImport(f); e.target.value=""; };
    renderBackupList();
  }
  function buildThemeGrid(){
    var grid=$("themeGrid"); if(!grid) return;
    grid.innerHTML="";
    THEMES.forEach(function(t){
      var b=document.createElement("button"); b.className="th"+(t.id===state.theme?" on":"");
      b.setAttribute("aria-label","Use "+t.name+" theme");
      b.setAttribute("aria-pressed",t.id===state.theme?"true":"false");
      b.style.setProperty("--preview","radial-gradient(circle at 12% 10%,"+hsl(t.glows[0])+" 0,transparent 54%),radial-gradient(circle at 92% 88%,"+hsl(t.glows[1])+" 0,transparent 58%),radial-gradient(circle at 60% 55%,"+hsl(t.glows[2])+" 0,transparent 50%)");
      b.innerHTML='<span class="prev"></span><span class="nm">'+t.name+'</span><span class="check">✓</span>';
      b.onclick=function(){ state.theme=t.id; applyTheme(0); syncMotion(); buildThemeGrid(); persist(); };
      grid.appendChild(b);
    });
  }
  function renderAcct(){
    var el=$("acctInner"); if(!el) return;
    var cfg=getCfg();
    if(currentUser){
      el.innerHTML='<div class="acctbox">'+(currentUser.photoURL?'<img src="'+currentUser.photoURL+'" alt="">':'')+'<div class="ai"><b></b><small>Notes sync automatically</small></div></div><div class="btnrow"><button class="b2" id="soBtn">Sign out</button></div>';
      el.querySelector(".ai b").textContent=currentUser.displayName||currentUser.email||"Signed in";
      $("soBtn").onclick=function(){ resetApiSettings(); auth.signOut(); showToast("Signed out"); setTimeout(renderAcct,300); };
      return;
    }
    if(cfg&&fbReady){
      el.innerHTML='<p class="hint">Sync is set up. Sign in to save your notes to your Google account and use them on any device.</p>'+
        '<button class="gsign" id="giBtn"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.9 35.6 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>Sign in with Google</button>';
      $("giBtn").onclick=signIn;
      return;
    }
    el.innerHTML='<p class="hint"><b>Sync is not configured.</b><br>Put this project’s Firebase web settings in <b>astral.config.js</b>, then reopen the app. People using the finished app will only see the sign-in button.</p>';
  }
  $("settingsBtn").onclick=function(){ openSettings(); };
  $("settingsModal").onclick=function(e){ if(e.target===$("settingsModal")) $("settingsModal").classList.remove("open"); };

  /* =================== boot =================== */
  captureAutoBackup(false); applyTheme(0); syncMotion(); renderAll(); renderFoot(); initFirebase();
  window.__astral={ state:state, render:renderAll };
})();
</script>
