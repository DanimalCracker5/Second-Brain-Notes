<style>
  :root{
    --c1:hsl(265,80%,52%); --c2:hsl(300,78%,50%); --c3:hsl(230,80%,50%);
    --o1:.15; --o2:.12; --o3:.07;
    --accent:hsl(265,82%,74%); --accent-soft:hsla(265,82%,60%,.16); --accent-line:hsla(265,82%,70%,.32);
    --ink:#f4f4f7; --ink-dim:#8b8b98; --ink-faint:#565663;
    --line:rgba(255,255,255,0.07); --line-soft:rgba(255,255,255,0.045);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{ background:#000; color:var(--ink); font-family:"DM Sans",system-ui,-apple-system,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; }

  /* ---------- AMOLED aurora ---------- */
  .ambient{ position:fixed; inset:0; z-index:0; background:#000; overflow:hidden; }
  .glow{ position:absolute; border-radius:50%; filter:blur(130px); mix-blend-mode:screen; will-change:transform;
    transition:background-color 1.1s linear, opacity 1s linear;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .g1{ width:74vw; height:54vh; top:-34vh; left:-26vw; background:var(--c1); opacity:var(--o1); animation-name:float1; animation-duration:34s; }
  .g2{ width:80vw; height:58vh; bottom:-36vh; right:-28vw; background:var(--c2); opacity:var(--o2); animation-name:float2; animation-duration:46s; }
  .g3{ width:54vw; height:40vh; top:52vh; left:38vw; background:var(--c3); opacity:var(--o3); animation-name:float3; animation-duration:40s; }
  .ambient::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(88% 74% at 50% 38%, rgba(0,0,0,var(--darkness,.86)), rgba(0,0,0,0) 80%); }
  .ambient.still .glow{ animation-play-state:paused; }
  @keyframes float1{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(12vw,9vh) scale(1.1)} }
  @keyframes float2{ 0%,100%{transform:translate(0,0) scale(1.05)} 50%{transform:translate(-13vw,-8vh) scale(.92)} }
  @keyframes float3{ 0%,100%{transform:translate(-50%,0) scale(1)} 50%{transform:translate(-38%,-9vh) scale(1.14)} }
  @media (prefers-reduced-motion: reduce){ .glow{ animation-duration:240s !important; } }

  .app{ position:relative; z-index:1; height:100dvh; display:grid; grid-template-columns:300px 1fr; transition:grid-template-columns .42s cubic-bezier(.2,.8,.2,1); }
  .app.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .app.sidebar-collapsed .drawer{ min-width:0; overflow:hidden; opacity:0; pointer-events:none; }
  .app.sidebar-focus{ grid-template-columns:minmax(0,1fr); grid-template-rows:1fr; }
  .app.sidebar-focus .drawer,.app.sidebar-focus .main{ grid-column:1; grid-row:1; }
  .app.sidebar-focus .drawer{ z-index:1; width:min(100%,760px); justify-self:center; border-right:0; background:linear-gradient(135deg,rgba(8,8,12,.94),rgba(0,0,0,.88)); box-shadow:0 0 80px rgba(0,0,0,.34),0 0 120px var(--accent-soft); animation:sidebarFocusIn .48s cubic-bezier(.2,.9,.25,1.05) both; }
  .app.sidebar-focus .main{ opacity:0; transform:translateX(22px) scale(.985); pointer-events:none; }
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; transition:opacity .28s ease,transform .42s cubic-bezier(.2,.8,.2,1); }

  /* ---------- top bar ---------- */
  .bar{ display:flex; align-items:center; gap:6px; padding:calc(var(--safe-t) + 12px) 18px 12px; flex:none; }
  .icon{ width:40px; height:40px; flex:none; display:grid; place-items:center; border:none; background:none; color:var(--ink-dim); cursor:pointer; border-radius:12px; transition:.15s; }
  #settingsBtn{ display:none; }
  .icon:hover{ color:var(--ink); background:rgba(255,255,255,.05); } .icon svg{ width:20px; height:20px; transition:transform .24s cubic-bezier(.2,.9,.3,1.4); }
  .icon:hover svg{ transform:scale(1.1); } .icon:active{ transform:scale(.92); }
  #settingsBtn:hover svg,.settings-gear:hover svg{ transform:rotate(65deg); }
  .icon.hide-wide{ display:grid; }
  .spacer{ flex:1; }
  .bar-actions{ display:flex; align-items:center; justify-content:flex-end; gap:6px; min-width:0; }
  /* Top-bar actions are secondary chrome, so they read as quiet outline chips.
     The one filled accent control in the app is ＋ New in the sidebar; add
     .primary here if a bar action ever needs to outrank it. */
  .copy-all{ display:inline-flex; align-items:center; gap:7px; flex:none; white-space:nowrap; font-weight:600; font-size:.82rem; color:var(--ink-dim); background:rgba(255,255,255,.045); cursor:pointer; border:1px solid var(--line); border-radius:10px; padding:8px 13px; transition:transform .06s, background .15s, border-color .15s, color .15s; }
  .copy-all:hover{ color:var(--ink); background:rgba(255,255,255,.085); border-color:var(--accent-line); } .copy-all:active{ transform:scale(.97); } .copy-all svg{ width:15px; height:15px; }
  .copy-all.primary{ color:#08080a; background:var(--accent); border-color:transparent; }
  .copy-all.primary:hover{ color:#08080a; background:var(--accent); filter:brightness(1.08); }
  .copy-all.done{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .save-state{ margin-right:8px; font-family:"DM Mono",monospace; font-size:.68rem; color:var(--ink-faint); white-space:nowrap; transition:color .16s; }
  .save-state.saving{ color:var(--accent); }
  .save-state.cloud{ color:#6ee7b7; }
  .save-state.bad{ color:#f87171; }

  .title-tools{ display:flex; align-items:center; gap:10px; margin:4px 0 0; }
  .title-tools .title{ flex:1; min-width:0; }
  .ai-title{ flex:none; display:inline-flex; align-items:center; gap:6px; margin-top:5px; padding:8px 10px; border:1px solid var(--accent-line); border-radius:10px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font:600 .72rem "DM Sans",sans-serif; white-space:nowrap; }
  .ai-title:hover{ filter:brightness(1.1); } .ai-title:disabled{ cursor:wait; opacity:.7; }

  /* ---------- canvas ---------- */
  .canvas{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; padding:0 26px calc(120px + var(--safe-b)); }
  .canvas::-webkit-scrollbar{ width:9px; } .canvas::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:9px; }
  .sheet{ max-width:760px; margin:0 auto; padding-top:8px; }
  .title{ width:100%; background:none; border:none; outline:none; resize:none; overflow:hidden; display:block; color:var(--ink); font-family:inherit; font-weight:700; letter-spacing:-.02em; font-size:clamp(2rem,6vw,3rem); line-height:1.06; padding:6px 0 0; }
  .title::placeholder{ color:var(--ink-faint); }
  .todo-title-row{ display:flex; align-items:flex-start; gap:12px; }
  .todo-title-row .title{ flex:1; min-width:0; }
  .todo-item-check{ width:40px; height:40px; margin-top:8px; flex:none; display:grid; place-items:center; border:1px solid var(--accent-line); border-radius:12px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font-size:1.1rem; font-weight:800; transition:.15s; }
  .todo-item-check:hover{ filter:brightness(1.15); transform:scale(1.04); }
  .todo-item-check.done{ color:#07110c; background:#6ee7b7; border-color:#6ee7b7; }
  .todo-item-delete{ flex:none; margin-top:8px; border:1px solid rgba(248,113,113,.3); border-radius:10px; padding:10px 12px; color:#f87171; background:rgba(248,113,113,.09); cursor:pointer; font:600 .78rem "DM Sans",sans-serif; }
  .todo-item-delete:hover{ background:rgba(248,113,113,.18); }
  .todo-title-row.done .title{ color:var(--ink-dim); text-decoration:line-through; }

  .assign{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:14px 0 12px; }
  .pickbtn{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; transition:color .14s,background .14s,border-color .14s,transform .16s cubic-bezier(.2,.9,.3,1.3); }
  .pickbtn:hover{ color:var(--ink); background:rgba(255,255,255,.08); border-color:var(--accent-line); transform:translateY(-1px); }
  .pickbtn:active{ transform:translateY(0) scale(.96); }
  .chip{ animation:popIn .28s cubic-bezier(.2,1.1,.35,1) both; }
  .pickbtn svg{ width:13px; height:13px; }
  .color-swatch{ width:10px; height:10px; border:1px solid rgba(255,255,255,.28); border-radius:50%; background:var(--ink-dim); }
  .chip{ display:inline-flex; align-items:center; gap:7px; font-size:.78rem; font-weight:500; color:var(--ink-dim); padding:5px 9px 5px 8px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .chip .cx{ cursor:pointer; opacity:.55; font-size:.92rem; line-height:1; color:var(--ink-faint); } .chip .cx:hover{ opacity:1; color:#f87171; }

  .meta{ font-family:"DM Mono",monospace; font-size:.72rem; color:var(--ink-faint); margin:0 0 26px; }
  .meta b{ color:var(--ink-dim); font-weight:500; }
  .due-prominent{ display:inline-flex; align-items:center; gap:7px; margin:0 0 18px; padding:8px 11px; border:1px solid var(--accent-line); border-radius:10px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font:600 .76rem "DM Mono",monospace; }
  .due-prominent.overdue{ color:#fecaca; border-color:rgba(248,113,113,.45); background:rgba(248,113,113,.12); }
  .due-prominent svg{ width:15px; height:15px; }

  .note-editor{ display:grid; gap:4px; padding-bottom:24px; }
  .note-editor-tools{ display:flex; justify-content:flex-end; margin:-7px 0 6px; }
  .attachment-add{ flex:none; border:1px solid var(--line); border-radius:999px; padding:7px 11px; color:var(--ink-dim); background:rgba(255,255,255,.035); cursor:pointer; font:600 .75rem "DM Sans",sans-serif; transition:.15s; }
  .attachment-add:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-paragraph-wrap{ position:relative; padding-bottom:2px; transition:padding-bottom .15s; }
  .note-paragraph{ min-height:88px; outline:none; color:var(--ink); font-size:1.08rem; line-height:1.72; padding:2px 0; white-space:pre-wrap; }
  .note-paragraph:empty::before{ content:attr(data-placeholder); color:var(--ink-faint); pointer-events:none; }
  .note-paragraph b,.note-paragraph strong{ font-weight:700; } .note-paragraph i,.note-paragraph em{ font-style:italic; } .note-paragraph u{ text-decoration-color:var(--accent); text-underline-offset:3px; }
  .note-format-trigger{ position:absolute; z-index:5; right:0; bottom:5px; width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; color:var(--ink-dim); background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); cursor:pointer; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,color .15s,border-color .15s,background .15s,visibility .15s; }
  .note-format-trigger svg{ width:14px; height:14px; }
  .note-paragraph-wrap:hover .note-format-trigger,.note-paragraph-wrap:focus-within .note-format-trigger,.note-paragraph-wrap.format-open .note-format-trigger{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-format-trigger:hover,.note-paragraph-wrap.format-open .note-format-trigger{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-format{ position:absolute; z-index:4; right:34px; bottom:5px; display:flex; gap:3px; padding:4px; border:1px solid var(--line); border-radius:10px; background:rgba(13,13,17,.92); box-shadow:0 12px 30px rgba(0,0,0,.28); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,visibility .15s; }
  .note-paragraph-wrap.format-open .note-format{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-format button{ min-width:25px; height:24px; border:0; border-radius:6px; color:var(--ink-dim); background:transparent; cursor:pointer; font:700 .73rem "DM Sans",sans-serif; }
  .note-format button:hover{ color:var(--ink); background:var(--accent-soft); }
  .note-block-actions{ position:absolute; z-index:6; display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:10px; background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,visibility .15s; }
  .note-block-actions button{ width:24px; height:24px; display:grid; place-items:center; border:0; border-radius:6px; color:var(--ink-dim); background:transparent; cursor:pointer; }
  .note-block-actions button svg{ width:14px; height:14px; } .note-block-actions button:hover{ color:var(--ink); background:var(--accent-soft); } .note-block-actions button.delete:hover{ color:#fca5a5; background:rgba(248,113,113,.12); } .note-block-actions button:disabled{ cursor:default; opacity:.3; }
  .note-paragraph-actions{ right:34px; bottom:5px; } .note-heading-actions{ right:34px; bottom:5px; } .note-chapter-actions{ right:0; bottom:5px; }
  .note-paragraph-wrap:hover .note-paragraph-actions,.note-paragraph-wrap:focus-within .note-paragraph-actions,.note-heading:hover .note-heading-actions,.note-heading:focus-within .note-heading-actions,.note-chapter:hover .note-chapter-actions,.note-chapter:focus-within .note-chapter-actions{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .note-paragraph-wrap:hover,.note-paragraph-wrap:focus-within,.note-heading:hover,.note-heading:focus-within{ padding-bottom:39px; }
  .note-paragraph-wrap.format-open .note-paragraph-actions{ opacity:0; visibility:hidden; pointer-events:none; }
  .note-heading{ position:relative; display:flex; align-items:center; gap:8px; margin:18px 0 5px; padding-bottom:2px; transition:padding-bottom .15s; }
  .note-heading input{ flex:1; min-width:0; padding:1px 0; border:0; outline:none; color:var(--ink); background:transparent; font-family:inherit; font-weight:700; letter-spacing:-.025em; transition:padding .14s; }
  .note-heading.h1 input{ font-size:1.75rem; } .note-heading.h2 input{ font-size:1.4rem; } .note-heading.h3 input{ font-size:1.12rem; }
  .heading-size{ position:absolute; right:0; bottom:5px; width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; color:var(--ink-dim); background:rgba(13,13,17,.92); box-shadow:0 8px 22px rgba(0,0,0,.2); cursor:pointer; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); transition:opacity .15s,transform .15s,color .15s,border-color .15s,background .15s,visibility .15s; }
  .heading-size svg{ width:14px; height:14px; } .note-heading:focus-within .heading-size,.note-heading:hover .heading-size{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); } .heading-size:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-comment{ margin:10px 0; padding:12px 16px; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); color:var(--ink-dim); text-align:center; }
  .note-comment small{ display:block; margin-bottom:4px; color:var(--accent); font:500 .6rem "DM Mono",monospace; letter-spacing:.15em; }
  .note-comment textarea{ width:100%; min-height:34px; border:0; outline:none; resize:none; color:inherit; background:transparent; text-align:center; font:italic .94rem/1.55 "DM Sans",sans-serif; }
  .note-prompt{ display:grid; gap:9px; margin:12px 0; padding:13px; border:1px solid var(--accent-line); border-radius:14px; background:linear-gradient(135deg,var(--accent-soft),rgba(255,255,255,.025)); }
  .note-prompt-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; } .note-prompt-head b{ color:var(--accent); font-size:.78rem; } .note-prompt-head button{ border:1px solid var(--line); border-radius:7px; padding:5px 8px; color:var(--ink-dim); background:rgba(0,0,0,.15); cursor:pointer; font:600 .68rem "DM Sans",sans-serif; }
  .note-prompt textarea{ width:100%; min-height:108px; border:0; outline:none; resize:vertical; color:var(--ink); background:transparent; font:.9rem/1.6 "DM Mono",monospace; }
  .note-group{ margin:12px 0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.022); }
  .note-group summary{ display:flex; align-items:center; gap:9px; padding:11px 12px; color:var(--ink); cursor:pointer; list-style:none; font-size:.86rem; font-weight:600; } .note-group summary::-webkit-details-marker{ display:none; }
  .note-group summary::before{ content:"›"; color:var(--accent); font-size:1.2rem; transition:transform .16s; } .note-group[open] summary::before{ transform:rotate(90deg); }
  .note-group summary input{ flex:1; min-width:0; border:0; outline:none; color:inherit; background:transparent; font:inherit; font-weight:inherit; }
  .note-group-body{ min-height:74px; padding:2px 13px 14px 34px; outline:none; color:var(--ink-dim); font-size:.94rem; line-height:1.65; white-space:pre-wrap; } .note-group-body:empty::before{ content:"Add group content…"; color:var(--ink-faint); }
  .note-chapter{ position:relative; padding:4px 0 22px; border-bottom:1px solid var(--line-soft); margin-bottom:18px; }
  .note-chapter:last-child{ border-bottom:none; }
  .note-chapter-head{ display:flex; align-items:center; gap:9px; }
  .note-chapter-index{ flex:none; color:var(--accent); font:500 .66rem "DM Mono",monospace; }
  .note-chapter-title{ flex:1; min-width:0; border:0; outline:0; padding:3px 0; color:var(--ink); background:transparent; font:600 1.02rem "DM Sans",sans-serif; }
  .note-chapter-title::placeholder{ color:var(--ink-faint); }
  .note-chapter-listen{ flex:none; display:inline-flex; align-items:center; gap:5px; padding:6px 9px; border:1px solid var(--accent-line); border-radius:8px; color:var(--accent); background:var(--accent-soft); cursor:pointer; font:600 .7rem "DM Sans",sans-serif; }
  .note-chapter-listen.done{ color:#04120c; background:#34d399; border-color:#34d399; }
  .note-chapter-audio-menu{ flex:none; width:29px; height:29px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:8px; color:var(--ink-dim); background:rgba(255,255,255,.04); cursor:pointer; font:700 1rem/1 "DM Sans",sans-serif; }
  .note-chapter-audio-menu:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .note-chapter .note-paragraph-wrap{ margin:5px 0 0 25px; }
  .note-chapter .note-paragraph{ min-height:64px; font-size:1rem; }
  /* Code has a status line at its bottom. Keep its block controls below the
     editor instead of covering that line, while all other block controls stay
     exactly where they are. */
  .note-code{ position:relative; margin:12px 0 51px; padding-top:1px; }
  .note-code .note-block-actions{ right:9px; bottom:-34px; top:auto; }
  .note-code:hover .note-block-actions,.note-code:focus-within .note-block-actions{ opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
  .workout-summary{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:8px 0 12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--accent-soft); }
  .workout-summary b{ color:var(--accent); } .workout-summary small{ color:var(--ink-faint); }
  .note-drop{ height:10px; margin:0; border-radius:7px; transition:height .14s,background .14s,border-color .14s; }
  .note-editor.dragging .note-drop{ height:30px; border:1px dashed rgba(255,255,255,.14); }
  .note-editor.dragging .note-drop::after{ content:"Drop attachment here"; display:block; color:var(--ink-faint); font:500 .64rem "DM Mono",monospace; text-align:center; line-height:28px; opacity:0; transition:opacity .14s; }

  /* ---------- floating menu ---------- */
  /* --menu-origin is set from openMenu so the pop scales out of the corner the

  .menu-body{ flex:1 1 auto; min-height:0; padding:6px; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; }
  .menu-body::-webkit-scrollbar{ width:8px; } .menu-body::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:8px; }
  .menu-body > *{ animation:menuRow .26s cubic-bezier(.2,.9,.3,1) both; }
  .menu-body > :nth-child(1){ animation-delay:.03s } .menu-body > :nth-child(2){ animation-delay:.05s } .menu-body > :nth-child(3){ animation-delay:.07s }
  .menu-body > :nth-child(4){ animation-delay:.09s } .menu-body > :nth-child(5){ animation-delay:.105s } .menu-body > :nth-child(6){ animation-delay:.12s }
  .menu-body > :nth-child(7){ animation-delay:.135s } .menu-body > :nth-child(n+8){ animation-delay:.15s }
  .menu .mtitle{ font-family:"DM Mono",monospace; font-size:.56rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); padding:6px 10px 4px; }
  .menu button.mi{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 11px; background:none; border:none; color:var(--ink); font-size:.86rem; border-radius:8px; cursor:pointer; transition:background .14s,transform .14s,padding-left .14s; }
  .menu button.mi:hover{ background:rgba(255,255,255,.06); padding-left:14px; } .menu button.mi:active{ transform:scale(.98); } .menu button.mi svg{ width:16px; height:16px; color:var(--ink-dim); flex:none; transition:color .14s,transform .18s cubic-bezier(.2,.9,.3,1.4); }
  .menu button.mi:hover svg{ color:var(--accent); transform:scale(1.12); }

  .menu button.mi .chk{ margin-left:auto; color:var(--accent); opacity:0; transform:scale(.6); transition:opacity .16s,transform .22s cubic-bezier(.2,1.4,.4,1); } .menu button.mi.on .chk{ opacity:1; transform:scale(1); }
  .menu button.mi.has-sub .chk{ display:none; }
  .menu button.mi .mi-more{ margin-left:auto; display:grid; place-items:center; color:var(--ink-faint); }
  .menu button.mi .mi-more svg{ width:14px; height:14px; color:inherit; }
  .menu .mi-split{ display:grid; grid-template-columns:1fr 1fr; gap:2px; }

  .menu .sep{ height:1px; background:var(--line); margin:5px 4px; }
  .menu .mrow{ padding:6px; } .menu .mrow input{ width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:9px 10px; font-family:inherit; font-size:.85rem; outline:none; }
  .menu .mrow input:focus{ border-color:var(--accent-line); }

  /* ---------- due-date calendar ---------- */
  .menu.calendar-menu{ min-width:272px; max-width:288px; }

  @media (max-width:560px){ .menu.calendar-menu{ min-width:min(348px,calc(100vw - 24px)); max-width:calc(100vw - 24px); } }
  .cal-quick{ display:flex; gap:5px; padding:4px 6px 7px; }

  .cal-head{ display:flex; align-items:center; gap:4px; padding:2px 4px 6px; }

  .cal-nav{ width:30px; height:30px; display:grid; place-items:center; border:0; border-radius:8px; background:none; color:var(--ink-faint); cursor:pointer; transition:color .14s,background .14s,transform .18s cubic-bezier(.2,.9,.3,1.5); }

  .cal-dow{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 4px 4px; }
  .cal-dow span{ text-align:center; font-family:"DM Mono",monospace; font-size:.56rem; letter-spacing:.1em; color:var(--ink-faint); }
  /* Specific enough to beat the generic .menu-body > :nth-child() row delays, which

  .menu.calendar-menu .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 4px 4px; animation:calSwap .26s cubic-bezier(.2,.9,.3,1) both; animation-delay:0s; }
  .cal-cell{ aspect-ratio:1; min-height:32px; display:grid; place-items:center; border:1px solid transparent; border-radius:9px; background:none; color:var(--ink); cursor:pointer; font:500 .78rem "DM Sans",sans-serif; transition:background .14s,color .14s,border-color .14s; animation:dayIn .26s cubic-bezier(.2,.9,.3,1.15) both; animation-delay:calc(var(--d,0) * 7ms); }
  .cal-cell.blank{ animation:none; pointer-events:none; }

  .cal-cell:hover{ background:rgba(255,255,255,.07); }
  .cal-cell.is-today{ border-color:var(--accent-line); color:var(--accent); }
  .cal-cell.is-selected{ background:var(--accent); border-color:var(--accent); color:#08080b; font-weight:700; }
  /* The pick animation has to outrank the entrance one, so it is declared after. */

  /* ---------- toast ---------- */
  .toast{ position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%,20px) scale(.94); z-index:120; padding:10px 18px; border-radius:12px; background:#141418; border:1px solid var(--line); box-shadow:0 16px 40px rgba(0,0,0,.5); font-size:.82rem; color:var(--ink); opacity:0; pointer-events:none; transition:opacity .18s ease,transform .36s cubic-bezier(.2,1.15,.35,1); max-width:88vw; }

  /* ---------- required sign-in gate ---------- */
  .auth-locked .app{ filter:blur(13px) saturate(.62); transform:scale(1.018); pointer-events:none; user-select:none; transition:filter .45s ease,transform .45s ease; }
  .auth-locked .modal,.auth-locked .toast{ pointer-events:none; }
  .auth-locked .collab{ display:none; }
  .auth-gate{ position:fixed; z-index:160; inset:0; display:grid; place-items:center; overflow:hidden; padding:max(24px,calc(var(--safe-t) + 16px)) 24px max(24px,calc(var(--safe-b) + 16px)); color:var(--ink); background:rgba(0,0,0,.61); opacity:0; visibility:hidden; pointer-events:none; transition:opacity .32s ease,visibility .32s; }
  .auth-gate.show{ opacity:1; visibility:visible; pointer-events:auto; }
  .auth-gate::before{ content:""; position:absolute; inset:-20%; background:radial-gradient(circle at 22% 18%,rgba(174,126,255,.28),transparent 26%),radial-gradient(circle at 78% 20%,rgba(91,180,255,.2),transparent 24%),radial-gradient(circle at 72% 80%,rgba(50,219,170,.18),transparent 28%),radial-gradient(circle at 25% 76%,rgba(255,104,171,.16),transparent 26%); filter:blur(28px) hue-rotate(0deg); animation:gate-wash 16s ease-in-out infinite alternate,gate-hue 40s linear infinite; }
  .gate-orbit{ position:absolute; width:min(78vw,720px); aspect-ratio:1; border:1px solid rgba(174,126,255,.13); border-radius:50%; opacity:.5; animation:gate-orbit 15s ease-in-out infinite alternate,gate-orbit-hue 40s linear infinite; }
  .auth-card{ position:relative; width:min(100%,356px); padding:clamp(26px,5vw,32px); overflow:hidden; border:1px solid rgba(255,255,255,.12); border-radius:20px; background:linear-gradient(145deg,rgba(17,17,25,.93),rgba(3,3,7,.9)); box-shadow:0 28px 80px rgba(0,0,0,.68),inset 0 1px rgba(255,255,255,.06); backdrop-filter:blur(24px); text-align:center; }
  .auth-card::after{ content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(120deg,rgba(255,255,255,.08),transparent 28%,transparent 70%,rgba(255,255,255,.035)); }
  .gate-eyebrow{ position:relative; z-index:1; margin:0 0 8px; color:var(--accent); font:600 .64rem "DM Mono",monospace; letter-spacing:.18em; text-transform:uppercase; animation:gate-label-spectrum 40s linear infinite; }
  .auth-card h1{ position:relative; z-index:1; max-width:300px; margin:0 auto; font-size:clamp(1.55rem,4.2vw,1.85rem); line-height:1.1; letter-spacing:-.04em; }
  .auth-card > p:not(.gate-eyebrow){ position:relative; z-index:1; max-width:280px; margin:10px auto 20px; color:var(--ink-dim); font-size:.8rem; line-height:1.5; }
  .auth-signin{ position:relative; z-index:1; width:100%; min-height:48px; display:inline-flex; align-items:center; justify-content:center; gap:9px; border:1px solid rgba(255,255,255,.16); border-radius:12px; color:#09090c; background:#ad7eef; box-shadow:0 10px 26px rgba(173,126,239,.22); cursor:pointer; font:700 .84rem "DM Sans",sans-serif; transition:transform .15s,filter .15s,box-shadow .15s; animation:gate-button-spectrum 40s linear infinite; }
  .auth-signin:hover{ filter:brightness(1.1); box-shadow:0 16px 38px var(--accent-soft); transform:translateY(-2px); }.auth-signin:active{ transform:translateY(0) scale(.985); }.auth-signin:disabled{ cursor:wait; filter:saturate(.6); }

  .auth-gate-status{ position:relative; z-index:1; margin:14px 0 0; color:var(--ink-faint); font-size:.72rem; line-height:1.4; }.auth-gate-status:empty{ display:none; }.auth-gate-status.error{ color:#fca5a5; }
  @keyframes gate-orbit{ to{ transform:scale(1.06); opacity:.22; } } @keyframes gate-wash{ to{ transform:translate3d(4%,3%,0) scale(1.08); } } @keyframes gate-hue{ to{ filter:blur(28px) hue-rotate(360deg); } } @keyframes gate-orbit-hue{ to{ filter:hue-rotate(360deg); } } @keyframes gate-label-spectrum{ 0%,100%{ color:#b57df4; } 25%{ color:#78adff; } 50%{ color:#61d8bd; } 75%{ color:#ff91cb; } } @keyframes gate-button-spectrum{ 0%,100%{ background:#ad7eef; box-shadow:0 10px 26px rgba(173,126,239,.22); } 25%{ background:#78adff; box-shadow:0 10px 26px rgba(120,173,255,.22); } 50%{ background:#61d8bd; box-shadow:0 10px 26px rgba(97,216,189,.2); } 75%{ background:#ff91cb; box-shadow:0 10px 26px rgba(255,145,203,.2); } }

  /* ---------- modals ---------- */
  .modal{ position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); padding:18px; }

  .modal-box::-webkit-scrollbar{ width:8px; } .modal-box::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.09); border-radius:8px; }
  .mh{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }

  .settings-nav{ display:grid; gap:8px; margin-top:20px; }
  .settings-nav button{ display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; padding:13px 14px; cursor:pointer; text-align:left; color:var(--ink); background:rgba(255,255,255,.035); border:1px solid var(--line); border-radius:13px; transition:background .16s,border-color .16s,transform .16s cubic-bezier(.2,.9,.3,1.2); }

  .settings-nav button:active{ transform:translateX(3px) scale(.99); }
  .settings-nav b{ display:block; font-size:.9rem; } .settings-nav small{ display:block; margin-top:3px; color:var(--ink-faint); font-size:.74rem; } .settings-nav .arrow{ color:var(--accent); font-size:1.1rem; transition:transform .2s cubic-bezier(.2,.9,.3,1.4); }
  .settings-nav button:hover .arrow{ transform:translateX(4px); }

  .srow{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-top:1px solid var(--line); }

  .toggle:active b{ width:25px; } .toggle.on:active b{ left:16px; }

  .b2:hover{ background:rgba(255,255,255,.1); transform:translateY(-1px); } .b2:active{ transform:translateY(0) scale(.97); }
  .b2.primary{ background:var(--accent); color:#08080a; border-color:transparent; } .b2.primary:hover{ filter:brightness(1.08); box-shadow:0 8px 20px -8px var(--accent-line); }
  .b2.danger{ color:#f87171; } .b2.danger:hover{ background:rgba(248,113,113,.12); }
  .gsign{ width:100%; display:flex; align-items:center; justify-content:center; gap:9px; padding:12px; cursor:pointer; font-weight:600; font-size:.88rem; color:#1f1f1f; background:#fff; border:none; border-radius:12px; }

  .acctbox{ display:flex; align-items:center; gap:11px; padding:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; }
  .acctbox img{ width:38px; height:38px; border-radius:50%; flex:none; }
  .acctbox .ai{ flex:1; min-width:0; } .acctbox .ai b{ display:block; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acctbox .ai small{ color:#34d399; font-size:.72rem; }

  .modal-opt{ width:100%; text-align:left; padding:13px 15px; margin-bottom:9px; cursor:pointer; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; transition:.14s; }

  .agent-stage .collab-body{ min-height:330px; }

  .voice-picker{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; color:var(--ink); text-align:left; cursor:pointer; border:1px solid var(--line); border-radius:12px; background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.03)); transition:border-color .15s,background .15s; }

  /* ---------- Voice stage ----------
     A quiet full-screen presence. The default look is a talking orb / face;
     cinematic HUDs stay available in Edit for people who want them. */
  .voice-overlay{ position:fixed; inset:0; z-index:55; display:none; color:var(--ink);
    --voice-accent:var(--accent); --voice-accent-soft:var(--accent-soft); }

  .voice-overlay.companion-mode .voice-overlay-actions,

  .voice-overlay.companion-mode .voice-overlay-decision,

  /* ---------- motion system ----------
     Entrance animations are opt-in per render: JS adds .enter (or a --i stagger

  @keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }

  @keyframes popIn{ 0%{ opacity:0; transform:translateY(6px) scale(.96) } 62%{ opacity:1; transform:translateY(-1px) scale(1.012) } 100%{ opacity:1; transform:none } }

     for its last row to arrive. */

  /* Headings share the row stagger so a regrouped list unfurls top to bottom

  /* A hand-rolled calendar rather than <input type="date">. The native control

  function openTodoDueDatePicker(anchor,it,owner){
    openMenu(anchor,function(menu){
      menu.classList.add("calendar-menu"); menu.setAttribute("data-noautofocus","1");
      var today=startOfDay(new Date()), selected=dateFromKey(it.dueDate), weekStart=weekStartDay();
      var view=new Date((selected||today).getFullYear(),(selected||today).getMonth(),1);
      function commit(key,cell){
        it.dueDate=key||""; it.updated=Date.now();
        if(owner&&owner!==it) owner.updated=Date.now();
        persist();
        /* Only close our own menu — by the time the delay below elapses the user
           may already have opened a different one. */
        function finish(){ if(openMenuEl===menu) closeMenu(); renderAll(); showToast(key?"Due "+dueDateLabel(key):"Due date cleared"); }
        /* Let the tap register visually before the menu goes away. */
        if(cell&&!document.body.classList.contains("reduce-fx")) setTimeout(finish,190); else finish();
      }

      var title=document.createElement("div"); title.className="mtitle"; title.textContent="Due date"; menu.appendChild(title);

      var quick=document.createElement("div"); quick.className="cal-quick";
      [["Today",0],["Tomorrow",1],["+1 week",7]].forEach(function(option){
        var button=document.createElement("button"); button.type="button"; button.className="cal-quick-btn"; button.textContent=option[0];
        if(selected&&dateKey(selected)===dateKey(addDays(today,option[1]))) button.classList.add("on");
        button.onclick=function(){ commit(dateKey(addDays(today,option[1]))); };
        quick.appendChild(button);

      menu.appendChild(quick);

      var head=document.createElement("div"); head.className="cal-head";
      head.innerHTML='<button type="button" class="cal-nav" aria-label="Previous month">'+ICON_CHEV_LEFT+'</button><span class="cal-month" aria-live="polite"></span><button type="button" class="cal-nav" aria-label="Next month">'+ICON_CHEV_RIGHT+'</button>';
      var monthLabel=head.querySelector(".cal-month"), navButtons=head.querySelectorAll(".cal-nav");
      navButtons[0].onclick=function(){ view.setMonth(view.getMonth()-1); draw(-1); };
      navButtons[1].onclick=function(){ view.setMonth(view.getMonth()+1); draw(1); };
      menu.appendChild(head);

      var dow=document.createElement("div"); dow.className="cal-dow";

        var name=new Date(2024,8,1+((weekStart+offset)%7)).toLocaleDateString(undefined,{weekday:"narrow"});
        var cellLabel=document.createElement("span"); cellLabel.textContent=name; dow.appendChild(cellLabel);
      }
      menu.appendChild(dow);

      var grid=document.createElement("div"); grid.className="cal-grid"; menu.appendChild(grid);
      function draw(direction){
        monthLabel.textContent=view.toLocaleDateString(undefined,{month:"long",year:"numeric"});
        grid.style.setProperty("--cal-slide",(direction<0?-10:10)+"px");
        grid.innerHTML="";
        if(direction){ grid.style.animation="none"; void grid.offsetWidth; grid.style.animation=""; }
        var lead=(new Date(view.getFullYear(),view.getMonth(),1).getDay()-weekStart+7)%7;
        var days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
        for(var blank=0;blank<lead;blank++){ var gap=document.createElement("span"); gap.className="cal-cell blank"; grid.appendChild(gap); }
        for(var day=1;day<=days;day++) grid.appendChild(dayCell(day,lead));
      }
      function dayCell(day,lead){
        var date=new Date(view.getFullYear(),view.getMonth(),day), key=dateKey(date);
        var cell=document.createElement("button"); cell.type="button"; cell.className="cal-cell"; cell.textContent=String(day);
        cell.setAttribute("aria-label",date.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}));
        if(date<today) cell.classList.add("is-past");
        if(key===dateKey(today)) cell.classList.add("is-today");
        if(selected&&key===dateKey(selected)){ cell.classList.add("is-selected"); cell.setAttribute("aria-current","date"); }
        cell.style.setProperty("--d",lead+day-1);

        var clear=document.createElement("button"); clear.type="button"; clear.className="color-reset"; clear.textContent="Clear due date";
        clear.onclick=function(){ commit(""); };

    });

              messages.push({role:"user",content:"The open note was not changed. Call update_open_document now with this wording:\n"+(wording||"(use the owner's last dictated note)")+"\nUse mode replace if the note body is empty. update_open_document is available on this turn. Do not say the editing tool is unavailable, and do not claim the edit happened until the tool result says Saved."});
            }
            toolChoice={type:"function",function:{name:"update_open_document"}};
            return step();
          }
          return spoken;
        }
        dropStream();
        messages.push({role:"assistant",content:message.content||null,tool_calls:calls});
        calls.forEach(function(call){
          var name=call&&call.function&&call.function.name, args=parseToolArguments(call&&call.function&&call.function.arguments), result="Done.";
          if(name==="update_open_document"){
            var writeTargetItem=targetItem||collabWritableItem();
            if(!writeTargetItem) result="No document is open. Call open_note first.";
            else if(agentRequiresApproval(agentItem)){
              var preview=buildProposal(cleanText(args.title)?"Update title and body":"Update the open note",[
                args.title?{target_id:"title",action:"replace",text:args.title}:null,
                {target_id:"body",action:args.mode==="append"?"append":args.mode==="prepend"?"prepend":"replace",text:agentEditText(args.text!=null?args.text:args.content)}
              ].filter(Boolean),targets);
              if(!preview) result="No usable text was in that call. Pass text to write into the note.";
              else {
                collab.proposals.push(preview); turnProposals.push(preview);
                renderCollabLog();
                result="Preview shown to the user with Apply and Discard buttons. The app will read the exact proposed wording aloud and remind them it is waiting for approval.";
              }
            } else {
              var written=writeOpenDocument(writeTargetItem,args);
              if(written.ok){
                turnWrites++;
                retargetTurn(writeTargetItem);
                result="Saved. The open document is now:\n"+written.text;
              } else result=written.error||"The note was not changed.";
            }
          } else if(name==="propose_edits"){
            var proposal=buildProposal(args.summary,args.edits,targets);
            if(proposal){
              collab.proposals.push(proposal); turnProposals.push(proposal);
              if(agentRequiresApproval(agentItem)){
                renderCollabLog();
                result="Preview shown to the user with Apply and Discard buttons. The app will read the exact proposed wording aloud and remind them it is waiting for approval.";
              } else {
                var applied=applyProposal(proposal);
                if(applied&&applied.ok){
                  turnWrites++;
                  result="Saved. The open document is now:\n"+(applied.text||noteTextForAgent(targetItem));
                } else {
                  result=(applied&&applied.error)||"The note was not changed. Call update_open_document with the exact wording, or propose_edits with target_id \"body\".";
                }
              }
            }
            else result="No usable edits were in that call. Call update_open_document with the text, or propose_edits using target_id \"body\" or \"title\".";
          } else if(name==="list_notes"){
            result=JSON.stringify(noteCatalog(!!args.include_agents));
          } else if(name==="search_notes"){
            var found=searchNotesForAgent(args.query,{type:args.type,limit:args.limit});
            result=found.length?JSON.stringify(found):"No notes matched "+JSON.stringify(cleanText(args.query)||"")+".";
          } else if(name==="list_todos"){
            result=JSON.stringify(listTodosForAgent(args.filter));
          } else if(name==="update_todo"){
            var matches=findTodosForAgent(args.todo_id||args.query);
            var todoBody=agentEditText(args.detail!=null?args.detail:args.text);
            if(!matches.length) result="No todo matched. Use list_todos or search_notes first.";
            else if(matches.length>1&&!args.todo_id) result="Multiple todos matched. Ask the user which one, or call again with todo_id: "+JSON.stringify(matches.slice(0,8).map(todoRecord));
            else if(typeof args.done!=="boolean"&&args.due_date==null&&!todoBody) result="Set done, due_date, and/or detail.";
            else {
              var targetTodo=matches[0];
              var changeBits=[];
              if(typeof args.done==="boolean") changeBits.push(args.done?"mark done":"reopen");
              if(args.due_date!=null) changeBits.push(cleanText(args.due_date)==="clear"||!cleanText(args.due_date)?"clear due date":"due "+cleanText(args.due_date));
              if(todoBody) changeBits.push("update body");
              var label=(targetTodo.title||"Untitled todo")+(changeBits.length?" — "+changeBits.join(", "):"");
              if(!confirmAgentChange(agentItem,"Update this todo?\n\n"+label+(todoBody?"\n\n"+todoBody.slice(0,400):""))) result="The user cancelled the todo update.";
              else {
                backupBeforeAgentChange();
                var updated=applyTodoUpdate(targetTodo,args.done,args.due_date==null?null:args.due_date);
                if(todoBody){
                  var bodyWrite=writeOpenDocument(targetTodo,{text:todoBody,mode:cleanText(itemText(targetTodo))?"append":"replace"});
                  if(bodyWrite.ok) turnWrites++;
                }
                pushCollabNote((updated.done?"Completed":"Updated")+" todo: "+updated.title+(updated.due?" · due "+updated.due_label:""));
                result="Updated: "+JSON.stringify(updated)+(todoBody?"\n"+noteTextForAgent(targetTodo):"");
              }
            }
          } else if(name==="create_todo"){
            var todoTitle=cleanText(args.title);
            var todoExtra={due:args.due_date,content:args.detail,blocks:Array.isArray(args.blocks)?args.blocks:[]};
            if(!todoTitle) result="A title is required.";
            else if(!window.confirm(agentCreateConfirmText(agentItemKind("todo"),todoTitle,todoExtra))) result="The user cancelled todo creation.";
            else {
              backupBeforeAgentChange();
              var createdTodo=createAgentItem("todo",todoTitle,todoExtra);
              attachCollabDocument(createdTodo);
              retargetTurn(createdTodo);
              result="Created todo "+createdTodo.id+" titled \""+createdTodo.title+"\""+(createdTodo.dueDate?" due "+createdTodo.dueDate:"")+". "+openDocumentToolResult(createdTodo);
            }
          } else if(name==="open_note"){
            var openIt=(state.items||[]).find(function(it){ return it.id===cleanText(args.note_id)&&it.type!=="agent"; });
            if(!openIt) result="No note with that id. Use search_notes or list_notes first.";
            else if(attachCollabDocument(openIt)){ retargetTurn(openIt); result=openDocumentToolResult(openIt); }
            else result="That item could not be opened.";
          } else if(name==="request_note_access"){
            var requested=(Array.isArray(args.note_ids)?args.note_ids:[]).map(cleanText).filter(Boolean);
            var available=(state.items||[]).filter(function(it){ return requested.indexOf(it.id)>=0&&it.type!=="agent"; });
            if(!available.length) result="No matching notes were found. Use list_notes first.";
            else {
              var labels=available.map(function(it){ return (it.title||"Untitled")+" ("+itemLabel(it)+")"; }).join(", ");
              var allowed=window.confirm("Allow the assistant to read these notes?\n\n"+labels+"\n\nReason: "+(cleanText(args.reason)||"requested by the assistant"));
              if(allowed){ collab.grantedNoteIds=collab.grantedNoteIds||{}; available.forEach(function(it){ collab.grantedNoteIds[it.id]=true; }); result="Permission granted for: "+available.map(function(it){return it.id;}).join(", "); }
              else result="Permission denied by the user.";
            }
          } else if(name==="read_notes"){
            var ids=(Array.isArray(args.note_ids)?args.note_ids:[]).map(cleanText).filter(Boolean), granted=collab.grantedNoteIds||{};
            var readable=(state.items||[]).filter(function(it){ return ids.indexOf(it.id)>=0&&granted[it.id]&&it.type!=="agent"; });
            result=readable.length?readable.map(noteTextForAgent).join("\n\n---\n\n"):"No approved notes matched. Ask for permission first.";
          } else if(name==="list_item_types"){
            result=JSON.stringify({
              kinds:agentItemKinds().map(function(row){ return {kind:row.kind,label:row.label,enabled:!!state.enabledTypes[row.type]}; }),
              note_blocks:agentBlockTypeEnum().map(function(type){ return {type:type,label:prettyBlockType(type)}; })
            });
          } else if(name==="create_note"){
            var spec=agentItemKind(args.kind);
            var noteTitle=cleanText(args.title);
            var extra={content:typeof args.content==="string"?args.content:"",due:args.due_date||args.due,blocks:Array.isArray(args.blocks)?args.blocks:[],language:args.language};
            if(!noteTitle) result="A title is required.";
            else if(!window.confirm(agentCreateConfirmText(spec,noteTitle,extra))) result="The user cancelled creation.";
            else {
              backupBeforeAgentChange();
              var created=createAgentItem(spec.kind,noteTitle,extra);
              attachCollabDocument(created);
              retargetTurn(created);
              var createdBits="Created "+(spec.label||"note").toLowerCase()+" "+created.id+" titled \""+created.title+"\".";
              if(spec.kind==="audio"||spec.kind==="video"||spec.kind==="file"||spec.kind==="edit") createdBits+=" This type is a file container — add media in the editor. The title is set.";
              result=createdBits+" "+openDocumentToolResult(created);
            }
          } else if(name==="remember"){
            var key=cleanText(args.key), value=cleanText(args.value);
            if(key&&value){
              var where=agentMemoryWrite(agentItem,args.scope==="short"?"short":"long",key,value);
              pushCollabNote("Saved to "+where+" memory: "+key);
              result="Saved.";
            } else result="A key and a value are both required.";
          } else if(name==="set_task"){
            var task=agentTaskWrite(agentItem,args.title,args.status,args.detail,agentModelForRole(agentItem,role));
            result="Task recorded: "+task.title+" ("+task.status+").";
          } else result="Unknown tool.";
          messages.push({role:"tool",tool_call_id:call.id,name:name,content:result});
        });
        if(rounds>=COLLAB_TOOL_ROUNDS) return cleanText(message.content)||cleanText(message.refusal)||"I have put a suggestion above for you to look at.";
        return step();
      });
    }
    step().then(function(reply){
      collab.busy=false; updateCollabControls();
      var a=normalizeAgent(agentItem);
      var spokenProposals=turnProposals.filter(function(proposal){ return proposal.state==="applied"||proposal.state==="pending"; });
      var text=spokenProposals.length?proposalSpokenReply(spokenProposals):cleanText(reply);
      var shouldSpeak=opts.forceSpeak;
      if(typeof shouldSpeak!=="boolean"){
        shouldSpeak=agentSettings().speakReplies;
        if(a.readBack==="never") shouldSpeak=false;
        else if(a.readBack==="after_edits") shouldSpeak=shouldSpeak&&!!spokenProposals.length;
      }
      if(!turnWrites&&!spokenProposals.length&&targetItem){
        var recoveredMiss=recoverMissedNoteWrite(targetItem,text,opts);
        if(recoveredMiss.ok){
          turnWrites++;
          text=recoveredMiss.text;
        }
      }
      if(!turnWrites&&!spokenProposals.length&&targetItem&&looksLikeNoteWriteClaim(text)){
        pushCollabNote("No note edit was received from the agent, so the document was not changed. Ask it to try the edit again.",true);
      }
      var emptyVoice=!text&&collab.voice&&collab.voice.active;
      if(emptyVoice){
        text="I heard you, but the language model sent back an empty reply.";
        if(streamEntry) abandonCollabStream(streamEntry);
        streamEntry=null;
        pushCollabNote(text,true);
        shouldSpeak=shouldSpeak!==false;
      }
      var talking=Promise.resolve();
      if(text){
        if(streamEntry) finishCollabStream(streamEntry,text);
        else if(!emptyVoice) pushCollabMessage("agent",text);
        setCollabStatus("");
        if(shouldSpeak){ markCompanionState("speaking"); talking=speakCollab(text); }
      }
      else {
        if(streamEntry) abandonCollabStream(streamEntry);
        setCollabStatus("");
      }
      completeAgentWorkTasks(agentItem,"done");
      save();
      return Promise.resolve(talking).catch(function(){}).then(function(){
        if(collab.voice&&collab.voice.active){
          markCompanionState("listening");
          setVoiceStatus("Listening");
          if(collab.queuedUtterance){ var leftover=collab.queuedUtterance; collab.queuedUtterance=""; considerVoiceTurn(leftover,true); }
        }
      });
    }).catch(function(error){
      if(streamEntry) abandonCollabStream(streamEntry);
      collab.busy=false; updateCollabControls();
      console.warn("Agent turn failed:",error);
      var msg=cleanText(error&&error.message)||"The model could not be reached.";
      pushCollabNote(msg,true);
      setCollabStatus(msg,true);
      completeAgentWorkTasks(agentItem,"done");
      var talking=Promise.resolve();
      if(collab.voice&&collab.voice.active){
        setVoiceStatus("Error");
        talking=speakCollab("I heard you, but I hit a snag. "+msg);
      }
      return Promise.resolve(talking).catch(function(){}).then(function(){
        if(collab.voice&&collab.voice.active){ markCompanionState("listening"); setVoiceStatus("Listening"); }
      });
    });
  }
  function sendCollabMessage(text){
    var message=cleanText(text);
    if(!message||collab.busy) return;
    var captured=captureDictationIntoNote(message);
    if(captured) pushCollabNote("Added to the open note.");
    startCollabSession();
    pushCollabMessage("user",message);
    runCollabTurn();
  }

  /* ---------- transcribed audio in the open note ---------- */
  function rememberPendingDictation(text){
    var value=cleanText(text);
    if(value) collab.pendingDictation=value;
  }
  function captureDictationIntoNote(text){
    var value=cleanText(text);
    if(!value||!looksLikeDirectNoteContent(value)) return false;
    rememberPendingDictation(value);
    var note=collabWritableItem();
    if(!note) return false;
    if(agentRequiresApproval(collabAgent())) return false;
    if(!noteBodyIsVisuallyEmpty(note)) return false;
    var written=writeOpenDocument(note,{text:value,mode:"replace",quiet:true});
    return !!(written&&written.ok);
  }
  function ensureTranscriptGroup(note){
    if(!note||note.type!=="note") return null;
    ensureNoteBlocks(note);
    var found=note.blocks.find(function(block){ return block.type==="group"&&cleanText(block.title).toLowerCase()===TRANSCRIPT_GROUP_TITLE.toLowerCase(); });
    if(found) return found;
    var group={id:uid(),type:"group",title:TRANSCRIPT_GROUP_TITLE,text:"",collapsed:false};
    note.blocks.push(group);
    return group;
  }
  function patchTranscriptGroupDom(note,group,created){
    if(!current()||current().id!==note.id) return true;
    var editor=canvas.querySelector('.note-editor[data-note-id="'+note.id+'"]');
    if(!editor) return false;
    var details=editor.querySelector('[data-group-id="'+group.id+'"]');
    var body=editor.querySelector('[data-group-body="'+group.id+'"]');
    if(!details||!body){
      if(!created) return false;
      var rendered=buildNoteGroup(note,group);
      var lastDrop=editor.querySelector(".note-drop-target:last-child");
      if(lastDrop) editor.insertBefore(rendered,lastDrop);
      else editor.appendChild(rendered);
      details=rendered; body=rendered.querySelector("[data-group-body]");
    }
    if(document.activeElement===body) return true;
    body.textContent=group.text||"";
    if(details&&details.tagName==="DETAILS") details.open=true;
    body.scrollTop=body.scrollHeight;
    return true;
  }
  function appendTranscriptUtterance(text,continuing){
    var note=collabWritableItem();
    var agentItem=collabAgent(), a=agentItem?normalizeAgent(agentItem):null;
    if(!note||!a||!a.transcribeToNote||note.type!=="note") return;
    var existed=note.blocks.some(function(block){ return block.type==="group"&&cleanText(block.title).toLowerCase()===TRANSCRIPT_GROUP_TITLE.toLowerCase(); });
    var group=ensureTranscriptGroup(note);
    if(!group) return;
    var stamp=new Date(), label=stamp.getHours()+":"+String(stamp.getMinutes()).padStart(2,"0");
    var line=continuing?("  "+text):("You · "+label+"\n  "+text);
    group.text=group.text?group.text.replace(/\s+$/,"")+"\n"+line:line;
    syncNoteBody(note); touchContent(note); save();
    if(!patchTranscriptGroupDom(note,group,!existed)) refreshNoteEditor(note);
  }

  /* ---------- voice stage ---------- */
  function setVoiceStatus(text){
    var el=$("voiceOverlayStatus"); if(el) el.textContent=text||"";
    setCollabStatus(text||"");
    paintVoiceMind();
  }
  function setVoiceLink(text){
    var el=$("voiceOverlayLink"); if(!el) return;
    el.textContent=agentSettings().developerTrace?(text||""):"";
  }
  function setVoiceTranscriptPreview(text){
    var el=$("voiceOverlayTranscript"); if(el) el.textContent=text||"";
  }
  function showListenDecision(decision){
    collab.decisions.push(decision);
    if(collab.decisions.length>20) collab.decisions=collab.decisions.slice(-20);
    var el=$("voiceOverlayDecision");
    var show=agentSettings().developerTrace;
    if(el){
      el.hidden=!show;
      if(show) el.textContent=(decision.action||"?")+" · "+(decision.reason||"");
    }
    if(collab.host){
      var log=collab.host.querySelector(".collab-log");
      if(log&&show){
        var chip=document.createElement("div");
        chip.className="listen-chip "+(decision.action==="respond"?"respond":decision.action==="dictate_only"?"dictate":"keep");
        chip.textContent="subconscious: "+(decision.action||"?")+(decision.reason?" — "+decision.reason:"");
        log.appendChild(chip); log.scrollTop=log.scrollHeight;
      }
    }
    renderVoiceChrome();
  }
  function markCompanionState(mode){
    var face=$("voiceCompanion"), overlay=$("voiceOverlay");
    if(face){
      face.classList.remove("listening","writing","speaking","thinking");
      if(mode) face.classList.add(mode);
    }
    if(overlay){
      overlay.classList.remove("is-listening","is-writing","is-speaking","is-thinking");
      if(mode) overlay.classList.add("is-"+mode);
    }
    var editor=canvas.querySelector(".note-editor");
    if(editor) editor.classList.toggle("agent-writing",mode==="writing");
    paintVoiceMind();
    refreshCollabChrome();
  }
  function voiceArtPieces(count,cls){
    var html="";
    for(var i=0;i<count;i++) html+='<i class="'+cls+'" style="--deg:'+(i*(360/count))+'deg;--n:'+((i%5)/5).toFixed(2)+'"></i>';
    return html;
  }
  function starFieldHtml(){
    var html='<div class="voice-art-stars"><div class="star-core"></div>';
    for(var i=0;i<28;i++){
      html+='<i style="left:'+(8+((i*37)%84))+'%;top:'+(10+((i*53)%72))+'%;animation-delay:'+(i*.11)+'s"></i>';
    }
    return html+"</div>";
  }
  function voiceArtHtml(style,agent){
    if(style==="face") return '<div class="voice-art-face'+(agent&&agent.faceData?" has-photo":"")+'"><div class="face-photo"></div><div class="face-head"></div><div class="face-mouth"></div></div>';
    if(style==="jarvis") return '<div class="voice-art-jarvis"><div class="vj-sweep"></div><div class="vj-ticks">'+voiceArtPieces(48,"")+'</div><div class="vj-bars">'+voiceArtPieces(36,"")+'</div><span class="vj-ring vj-a"></span><span class="vj-ring vj-b"></span><span class="vj-ring vj-c"></span><div class="vj-scan"></div><div class="vj-core"></div></div>';
    if(style==="iris") return '<div class="voice-art-iris"><div class="iris-glow"></div><div class="iris-ring"></div><div class="iris-pupil"><span></span></div></div>';
    if(style==="core") return '<div class="voice-art-core"><i></i><i></i><i></i><i></i></div>';
    if(style==="nova") return '<div class="voice-art-nova"><span></span><span></span><span></span><span></span><div class="nova-core"></div></div>';
    if(style==="radial") return '<div class="voice-art-radial">'+voiceArtPieces(40,"")+'<div class="radial-core"></div></div>';
    if(style==="plasma") return '<div class="voice-art-plasma"><b></b><b></b><b></b><b></b></div>';
    if(style==="constellation") return starFieldHtml();
    if(style==="hex") return '<div class="voice-art-hex"></div>';
    if(style==="beam") return '<div class="voice-art-beam"><div class="beam-shaft"></div><div class="beam-flare"></div><div class="beam-base"></div></div>';
    if(style==="aurora") return '<div class="voice-art-aurora"></div>';
    if(style==="waveform") return '<div class="voice-art-waveform">'+new Array(16).join("<i></i>")+"</div>";
    if(style==="cinema") return '<div class="voice-art-cinema-light"></div>';
    if(style==="companion") return "";
    return '<div class="voice-art-core"><i></i><i></i><i></i><i></i></div>';
  }
  function voicePreviewAgent(fallback){
    if(fallback) return fallback;
    var open=current();
    if(open&&open.type==="agent") return normalizeAgent(open);
    var agentItem=collabAgent();
    return agentItem?normalizeAgent(agentItem):null;
  }
  function renderVoiceArt(style,level){
    var art=$("voiceStageArt"); if(!art) return;
    var amp=Math.max(0.18,Math.min(1.6,0.4+(Number(level)||0)*1.8));
    setVoiceAmp(amp);
    if(style==="waveform"){
      var bars=art.querySelectorAll(".voice-art-waveform i");
      Array.prototype.forEach.call(bars,function(bar,index){
        bar.style.height=Math.round(12+amp*70*((index%5)+1)/5)+"px";
      });
    }
  }
  function buildVoiceArt(style,target,agent){
    var art=target||$("voiceStageArt"); if(!art) return;
    style=knownVoiceStyle(style);
    var a=voicePreviewAgent(agent);
    art.innerHTML=voiceArtHtml(style,a);
    paintFaceStage(art,a);
    art.style.setProperty("--voice-amp",String(collab.voiceAmp||0.45));
  }
  function buildVoiceLookGrid(a,it,onPick){
    var wrap=document.createElement("div"); wrap.className="voice-look-grid";
    AGENT_VOICE_STYLES.forEach(function(style){
      var card=document.createElement("button"); card.type="button";
      card.className="voice-look-card"+(a.animationStyle===style.id?" on":"");
      card.innerHTML='<span class="look-mini look-mini-'+style.id+'"></span><b>'+style.name+'</b><small>'+style.hint+'</small>';
      card.onclick=function(){
        a.animationStyle=style.id;
        if(style.id==="companion"&&a.voicePresence==="overlay") a.voicePresence="companion";
        if(style.id==="cinema"&&a.voicePresence==="overlay") a.voicePresence="cinema";
        it.updated=Date.now(); save();
        Array.prototype.forEach.call(wrap.querySelectorAll(".voice-look-card"),function(el){ el.classList.toggle("on",el===card); });
        if(collab.voice&&collab.voice.active){ buildVoiceArt(style.id,null,a); renderVoiceChrome(); }
        if(onPick) onPick(style);
      };
      wrap.appendChild(card);
    });
    return wrap;
  }
  function renderVoiceChrome(){
    var agentItem=collabAgent(), a=agentItem?normalizeAgent(agentItem):null;
    var overlay=$("voiceOverlay"), companion=$("voiceCompanion"), nameEl=$("voiceOverlayName"), tasksEl=$("voiceOverlayTasks");
    var accent=agentAccent(agentItem)||"";
    if(overlay){
      overlay.style.setProperty("--voice-accent",accent||"var(--accent)");
      overlay.style.setProperty("--voice-accent-soft",accent?accent+"33":"var(--accent-soft)");
      overlay.classList.toggle("cinema",(a&&a.voicePresence==="cinema")||(a&&a.animationStyle==="cinema"));
      overlay.classList.toggle("companion-mode",a&&(a.voicePresence==="companion"||a.animationStyle==="companion"));
      overlay.setAttribute("data-voice-look",a?a.animationStyle:"face");
    }
    if(nameEl) nameEl.textContent=a?a.name:"Assistant";
    if(companion){
      companion.style.setProperty("--voice-accent",accent||"var(--accent)");
      applyCompanionFace(a);
      var showCompanion=!!(collab.voice&&collab.voice.active&&a&&(a.voicePresence==="companion"||a.animationStyle==="companion"));
      companion.hidden=!showCompanion;
      companion.classList.toggle("open",showCompanion);
      companion.setAttribute("aria-hidden",showCompanion?"false":"true");
    }
    if(tasksEl){
      tasksEl.innerHTML="";
      (a&&a.tasks||[]).filter(function(task){ return task.status==="running"; }).slice(-4).forEach(function(task){
        var chip=document.createElement("span"); chip.className="voice-task-chip "+task.status; chip.textContent=task.title; tasksEl.appendChild(chip);
      });
    }
    var micBtn=$("voiceOverlayMic");
    if(micBtn){ micBtn.innerHTML=ICON_STOPSQ; }
    paintVoiceMind();
  }
  function hideVoiceStage(){
    var overlay=$("voiceOverlay"), companion=$("voiceCompanion");
    if(overlay){ overlay.classList.remove("open","cinema","companion-mode"); overlay.setAttribute("aria-hidden","true"); }
    if(companion){ companion.hidden=true; companion.classList.remove("open"); companion.setAttribute("aria-hidden","true"); }
    setVoiceLink("");
