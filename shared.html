<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<title>Shared document · Second Brain</title>
<script src="./astral.config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{--bg:#09090c;--surface:#15151b;--line:rgba(255,255,255,.1);--ink:#f5f5f7;--dim:#a1a1ae;--faint:#696975;--accent:#c4a5ff;--accent-soft:rgba(174,130,255,.15);}
  *{box-sizing:border-box} html,body{min-height:100%;margin:0} body{background:radial-gradient(70rem 35rem at 15% -10%,rgba(118,62,210,.22),transparent 60%),radial-gradient(54rem 36rem at 100% 100%,rgba(210,59,191,.12),transparent 62%),var(--bg);color:var(--ink);font-family:"DM Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .page{width:min(100% - 32px,780px);margin:0 auto;padding:28px 0 72px}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:42px;color:var(--dim);font-size:.88rem}.brand{font-weight:700;color:var(--ink);letter-spacing:-.015em}.bar-actions{display:flex;align-items:center;gap:8px}.home-link,.view-only{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);font-size:.75rem;font-weight:600}.home-link{color:var(--ink);text-decoration:none}.home-link:hover{border-color:var(--accent);background:var(--accent-soft)}.view-only::before{content:"";width:7px;height:7px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 12px rgba(110,231,183,.75)}
  .document{padding:clamp(22px,6vw,48px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));box-shadow:0 28px 80px rgba(0,0,0,.22)}.eyebrow{margin:0 0 11px;color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.title-row{display:flex;align-items:flex-start;gap:14px}.title-row .title{flex:1}.title{margin:0;overflow-wrap:anywhere;font-size:clamp(2rem,7vw,3.25rem);line-height:1.06;letter-spacing:-.045em}.todo-check{display:grid;place-items:center;width:40px;height:40px;flex:none;margin-top:5px;border:1px solid var(--accent);border-radius:12px;color:#08080b;background:var(--accent-soft);font-size:1.15rem;font-weight:800}.todo-check.done{border-color:#6ee7b7;background:#6ee7b7}.updated{margin:15px 0 0;color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem}.rule{height:1px;margin:30px 0;background:var(--line)}
  .note-text,.section-body,.group-body{color:#e2e2e8;font-size:1.05rem;line-height:1.75;overflow-wrap:anywhere}.note-text{margin:0 0 18px}.note-text p,.note-text div{margin:0 0 1em}.note-text ul,.note-text ol{padding-left:1.4em}.note-text code{padding:.12em .35em;border-radius:5px;background:rgba(255,255,255,.09);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}.note-heading{margin:32px 0 10px;letter-spacing:-.03em;line-height:1.18}.note-heading.h1{font-size:1.75rem}.note-heading.h2{font-size:1.4rem}.note-heading.h3{font-size:1.12rem}.comment,.prompt{margin:20px 0;padding:15px 17px;border-left:3px solid var(--accent);border-radius:0 12px 12px 0;background:var(--accent-soft);color:var(--dim);font-size:.95rem;line-height:1.65;white-space:pre-wrap}.comment b,.prompt b{display:block;margin-bottom:6px;color:var(--accent);font-size:.67rem;letter-spacing:.12em;text-transform:uppercase}.group{margin:20px 0;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.group summary{padding:13px 15px;cursor:pointer;font-weight:700}.group-body{padding:0 15px 15px;white-space:pre-wrap;font-size:.96rem}
  .attachment{margin:20px 0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.035)}.attachment img,.attachment video{display:block;width:100%;max-height:72vh;object-fit:contain;background:rgba(0,0,0,.28)}.attachment-file{display:flex;align-items:center;gap:12px;padding:15px;text-decoration:none;color:var(--ink)}.attachment-file:hover{background:rgba(255,255,255,.045)}.file-mark{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:.67rem;font-weight:800}.file-copy{min-width:0}.file-copy b,.file-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-copy b{font-size:.88rem}.file-copy small{margin-top:3px;color:var(--faint);font:400 .68rem ui-monospace,SFMono-Regular,Menlo,monospace}.unavailable{padding:14px 15px;color:var(--faint);font-size:.86rem}.chapter{padding:4px 0 26px;margin-bottom:25px;border-bottom:1px solid var(--line)}.chapter h2{margin:0 0 11px;font-size:1.2rem;letter-spacing:-.02em}.chapter-body{color:#e2e2e8;font-size:1.05rem;line-height:1.75}.code-block{margin:20px 0;overflow:auto;padding:15px;border:1px solid var(--line);border-radius:14px;background:#08080b;color:#e8e8ee;font:400 .84rem/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
  .script-section{padding:4px 0 26px;margin-bottom:25px;border-bottom:1px solid var(--line)}.script-section:last-child{padding-bottom:0;margin-bottom:0;border-bottom:0}.section-title{margin:0 0 11px;font-size:1.2rem;letter-spacing:-.02em}.script-section.cue{padding:12px 14px;margin:16px 0;border:1px dashed rgba(196,165,255,.35);border-radius:12px;background:rgba(196,165,255,.07)}.script-section.cue .section-title{display:none}.script-section.cue .section-body{color:var(--dim);font-size:.92rem;font-style:italic}.empty{padding:34px 20px;color:var(--dim);text-align:center;line-height:1.6}.error{border-color:rgba(248,113,113,.34);background:rgba(248,113,113,.08)}.footer{margin-top:24px;color:var(--faint);text-align:center;font-size:.75rem}
  @media (max-width:560px){.page{width:min(100% - 24px,780px);padding-top:18px}.bar{margin-bottom:26px}.document{padding:25px 20px;border-radius:18px}}
</style>
</head>
<body>
<main class="page">
  <header class="bar"><span class="brand">Second Brain</span><div class="bar-actions"><a class="home-link" href="https://secondbrainnotes.com/">Home</a><span class="view-only">View only</span></div></header>
  <article class="document" id="document" aria-live="polite"><div class="empty">Loading shared document…</div></article>
  <p class="footer">Shared from Second Brain</p>
</main>
<script>
(function(){
  "use strict";
  var container=document.getElementById("document");
  function text(value){ return typeof value==="string"?value:""; }
  function fileSize(bytes){ var size=Number(bytes)||0, units=["B","KB","MB","GB"], index=0; while(size>=1024&&index<units.length-1){ size/=1024; index++; } return (index?size.toFixed(size>=10?0:1):size)+" "+units[index]; }
  function safeUrl(value){ try{ var url=new URL(value,location.href); return /^(https?:)$/i.test(url.protocol)||/^data:image\//i.test(text(value))?url.href:""; }catch(error){ return ""; } }
  function appendRichText(parent,html,fallback){
    var source=document.createElement("div"), allowed={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,BR:1,DIV:1,P:1,UL:1,OL:1,LI:1,CODE:1};
    source.innerHTML=text(html);
    function copyNode(node,target){
      if(node.nodeType===3){ target.appendChild(document.createTextNode(node.nodeValue||"")); return; }
      if(node.nodeType!==1) return;
      if(!allowed[node.tagName]){ Array.prototype.forEach.call(node.childNodes,function(child){ copyNode(child,target); }); return; }
      var clean=document.createElement(node.tagName.toLowerCase());
      Array.prototype.forEach.call(node.childNodes,function(child){ copyNode(child,clean); }); target.appendChild(clean);
    }
    Array.prototype.forEach.call(source.childNodes,function(node){ copyNode(node,parent); });
    if(!parent.childNodes.length&&fallback) parent.textContent=fallback;
  }
  function attachmentView(file){
    var box=document.createElement("div"); box.className="attachment";
    var url=safeUrl(file&&file.url), image=/^image\//i.test(text(file&&file.type)), video=/^video\//i.test(text(file&&file.type));
    if(!url){ box.innerHTML='<div class="unavailable">This attachment is not available in the public copy.</div>'; return box; }
    if(image){ var imageLink=document.createElement("a"), imageEl=document.createElement("img"); imageLink.href=url; imageLink.target="_blank"; imageLink.rel="noreferrer"; imageEl.src=url; imageEl.alt=text(file.name)||"Shared image"; imageLink.appendChild(imageEl); box.appendChild(imageLink); return box; }
    if(video){ var videoEl=document.createElement("video"); videoEl.src=url; videoEl.controls=true; videoEl.preload="metadata"; videoEl.setAttribute("aria-label",text(file.name)||"Shared video"); box.appendChild(videoEl); return box; }
    var link=document.createElement("a"), mark=document.createElement("span"), copy=document.createElement("span"), name=document.createElement("b"), detail=document.createElement("small");
    link.className="attachment-file"; link.href=url; link.target="_blank"; link.rel="noreferrer"; mark.className="file-mark"; mark.textContent="FILE"; copy.className="file-copy"; name.textContent=text(file.name)||"Attachment"; detail.textContent=[text(file.type)||"File",fileSize(file.size)].join(" · "); copy.appendChild(name); copy.appendChild(detail); link.appendChild(mark); link.appendChild(copy); box.appendChild(link); return box;
  }
  function renderNote(data,body){
    var files={}; (data.attachments||[]).forEach(function(file){ if(file&&file.id) files[file.id]=file; });
    (data.blocks||[]).forEach(function(block){
      if(!block||!block.type) return;
      if(block.type==="text"){ var paragraph=document.createElement("div"); paragraph.className="note-text"; appendRichText(paragraph,block.html,block.text); body.appendChild(paragraph); return; }
      if(block.type==="heading"){ var level=Math.max(1,Math.min(3,Number(block.level)||2)), heading=document.createElement("h"+level); heading.className="note-heading h"+level; heading.textContent=text(block.text); body.appendChild(heading); return; }
      if(block.type==="chapter"){ var chapter=document.createElement("section"), chapterTitle=document.createElement("h2"), chapterBody=document.createElement("div"); chapter.className="chapter"; chapterTitle.textContent=text(block.title)||"Untitled chapter"; chapterBody.className="chapter-body"; appendRichText(chapterBody,block.html,block.text); chapter.appendChild(chapterTitle); chapter.appendChild(chapterBody); body.appendChild(chapter); return; }
      if(block.type==="comment"||block.type==="prompt"){ var callout=document.createElement("aside"), label=document.createElement("b"); callout.className=block.type; label.textContent=block.type==="prompt"?"Prompt":"Note"; callout.appendChild(label); callout.appendChild(document.createTextNode(text(block.text))); body.appendChild(callout); return; }
      if(block.type==="group"){ var group=document.createElement("details"), summary=document.createElement("summary"), groupBody=document.createElement("div"); group.className="group"; group.open=true; summary.textContent=text(block.title)||"Untitled group"; groupBody.className="group-body"; groupBody.textContent=text(block.text); group.appendChild(summary); group.appendChild(groupBody); body.appendChild(group); return; }
      if(block.type==="code"){ var code=document.createElement("pre"); code.className="code-block"; code.textContent=text(block.code); body.appendChild(code); return; }
      if(block.type==="attachment"){ body.appendChild(attachmentView(files[block.attachmentId])); }
    });
    if(!body.childNodes.length){ var empty=document.createElement("p"); empty.className="empty"; empty.textContent="This note is empty."; body.appendChild(empty); }
  }
  function renderScript(data,body){
    (data.sections||[]).forEach(function(section){
      var item=document.createElement("section"), title=document.createElement("h2"), content=document.createElement("div"); item.className="script-section"+(section.kind==="cue"?" cue":""); title.className="section-title"; title.textContent=text(section.title)||"Untitled section"; content.className="section-body"; content.textContent=text(section.body); item.appendChild(title); item.appendChild(content); body.appendChild(item);
    });
    if(!body.childNodes.length){ var empty=document.createElement("p"); empty.className="empty"; empty.textContent="This script is empty."; body.appendChild(empty); }
  }
  function render(data){
    if(!data||["note","script"].indexOf(data.type)<0){ throw new Error("This public link is not valid."); }
    document.title=(text(data.title)||"Shared document")+" · Second Brain";
    container.innerHTML="";
    var eyebrow=document.createElement("p"), title=document.createElement("h1"), titleRow=document.createElement("div"), updated=document.createElement("p"), rule=document.createElement("div"), body=document.createElement("div"), isTodo=!!data.todo;
    eyebrow.className="eyebrow"; eyebrow.textContent=data.type==="script"?"Shared video script":(isTodo?"Shared todo":"Shared note"); title.className="title"; title.textContent=text(data.title)||"Untitled "+(isTodo?"todo":(data.type==="script"?"video script":"note")); updated.className="updated"; updated.textContent=data.updatedAt?"Updated "+new Date(data.updatedAt).toLocaleString():"Shared view"; rule.className="rule"; container.appendChild(eyebrow); if(isTodo){ var check=document.createElement("span"); titleRow.className="title-row"; titleRow.appendChild(title); check.className="todo-check"+(data.done?" done":""); check.textContent=data.done?"✓":""; check.setAttribute("role","img"); check.setAttribute("aria-label",data.done?"Completed todo":"Open todo"); titleRow.appendChild(check); container.appendChild(titleRow); } else container.appendChild(title); container.appendChild(updated); container.appendChild(rule); container.appendChild(body);
    if(data.type==="script") renderScript(data,body); else renderNote(data,body);
  }
  function showError(message){ container.classList.add("error"); container.innerHTML=""; var title=document.createElement("h1"), copy=document.createElement("p"); title.className="title"; title.textContent="This link isn’t available"; copy.className="empty"; copy.textContent=message; container.appendChild(title); container.appendChild(copy); }
  var shareId=(new URLSearchParams(location.search)).get("share");
  var config=window.ASTRAL_CONFIG&&window.ASTRAL_CONFIG.firebase;
  if(!shareId){ showError("Ask the sender for the complete public link."); return; }
  if(!config||typeof firebase==="undefined"){ showError("Public sharing is not configured for this site."); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    firebase.firestore().collection("shared").doc(shareId).get().then(function(doc){ if(!doc.exists) throw new Error("The sender may have stopped sharing it, or the link may be incomplete."); render(doc.data()); }).catch(function(error){ console.warn("Could not load shared document:",error); showError(error.message||"Please try again later."); });
  }catch(error){ console.warn("Could not start public sharing:",error); showError("Please try again later."); }
})();
</script>
</body>
</html>
