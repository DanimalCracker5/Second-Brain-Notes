<main class="page">
  <header class="bar"><span class="brand">Second Brain</span><div class="bar-actions"><a class="home-link" href="https://secondbrainnotes.com/">Home</a><button type="button" class="auth-btn" id="signInBtn" hidden>Sign in to edit</button><span class="view-only" id="accessBadge">View only</span></div></header>

<script>

  function renderScript(data,body,editing,onChange){

  function render(data,editing,onChange,onAddPhoto){

      var addText=document.createElement("button"); addText.type="button"; addText.textContent="Add text";
      addText.onclick=function(){ data.blocks=data.blocks||[]; data.blocks.push({id:uid(),type:"text",text:"",html:""}); onChange(); render(data,true,onChange,onAddPhoto); };
      var addPhoto=document.createElement("button"); addPhoto.type="button"; addPhoto.textContent="Add photo";
      var picker=document.createElement("input"); picker.type="file"; picker.accept="image/*"; picker.hidden=true;
      addPhoto.onclick=function(){ picker.click(); };
      picker.onchange=function(){ if(picker.files&&picker.files[0]&&onAddPhoto) onAddPhoto(picker.files[0]); picker.value=""; };
      tools.appendChild(addText); tools.appendChild(addPhoto); tools.appendChild(picker); container.appendChild(tools);
      if(title.tagName==="TEXTAREA"){ title.style.height="auto"; title.style.height=title.scrollHeight+"px"; }
    }
  }
  function showError(message){ container.classList.add("error"); container.innerHTML=""; var title=document.createElement("h1"), copy=document.createElement("p"); title.className="title"; title.textContent="This link isn’t available"; copy.className="empty"; copy.textContent=message; container.appendChild(title); container.appendChild(copy); }
  var shareId=(new URLSearchParams(location.search)).get("share");
  var config=window.ASTRAL_CONFIG&&window.ASTRAL_CONFIG.firebase;
  var clientId="s"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  var currentUser=null, docData=null, saveTimer=null, saving=false, saveAgain=false, lastPushed=0;
  var badge=document.getElementById("accessBadge"), signInBtn=document.getElementById("signInBtn");
  if(!shareId){ showError("Ask the sender for the complete public link."); return; }
  if(!config||typeof firebase==="undefined"){ showError("Public sharing is not configured for this site."); return; }
  function canEdit(){ return !!(docData&&docData.allowEdit&&currentUser); }
  function updateChrome(){
    if(!badge) return;
    if(docData&&docData.allowEdit){
      badge.classList.add("can-edit");
      badge.textContent=currentUser?"Editing":"Can edit";
      if(signInBtn) signInBtn.hidden=!!currentUser;
    } else {
      badge.classList.remove("can-edit");
      badge.textContent="View only";
      if(signInBtn) signInBtn.hidden=true;
    }
  }
  function paint(){
    if(!docData) return;
    render(docData,canEdit(),scheduleSave,addSharedPhoto);
    updateChrome();
  }
  function scheduleSave(){
    if(!canEdit()) return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(pushShare,280);
  }
  function pushShare(){
    if(!canEdit()||!docData) return;
    if(saving){ saveAgain=true; return; }
    saving=true;
    var payload=JSON.parse(JSON.stringify(docData));
    payload.updatedAt=Date.now();
    payload.updatedBy=clientId;
    payload.allowEdit=true;
    firebase.firestore().collection("shared").doc(shareId).update(payload).then(function(){
      lastPushed=payload.updatedAt; saving=false;
      if(saveAgain){ saveAgain=false; pushShare(); }
    }).catch(function(error){
      saving=false;
      console.warn("Shared edits could not be saved:",error);
    });
  }
  function addSharedPhoto(file){
    if(!canEdit()||!file||!firebase.storage) return;
    var id=uid(), path="shares/"+shareId+"/"+id;
    firebase.storage().ref(path).put(file,{contentType:file.type||"image/jpeg"}).then(function(){
      return firebase.storage().ref(path).getDownloadURL();
    }).then(function(url){
      docData.attachments=docData.attachments||[];
      docData.blocks=docData.blocks||[];
      docData.attachments.push({id:id,name:file.name||"Photo",type:file.type||"image/jpeg",size:file.size||0,url:url,storagePath:path});
      docData.blocks.push({id:uid(),type:"attachment",attachmentId:id,width:100});
      scheduleSave();
      paint();
    }).catch(function(error){ console.warn("Shared photo could not be added:",error); });
  }
  function signIn(){
    var auth=firebase.auth(), provider=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function(){ return auth.signInWithRedirect(provider); });
  }
  if(signInBtn) signInBtn.onclick=signIn;
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    firebase.auth().onAuthStateChanged(function(user){ currentUser=user||null; paint(); });
    firebase.firestore().collection("shared").doc(shareId).onSnapshot(function(doc){
      if(!doc.exists){ showError("The sender may have stopped sharing it, or the link may be incomplete."); return; }
      var incoming=doc.data()||{};
      if(incoming.updatedBy===clientId&&(Number(incoming.updatedAt)||0)<=lastPushed) return;
      if(canEdit()&&saveTimer) return;
      docData=incoming;
      paint();
    },function(error){ console.warn("Could not load shared document:",error); showError(error.message||"Please try again later."); });
  }catch(error){ console.warn("Could not start public sharing:",error); showError("Please try again later."); }
})();
</script>
</body>
</html>
